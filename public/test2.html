<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BobotEditha.net - QR WiFi Manager</title>

    <script
        src="https://unpkg.com/html5-qrcode"
        type="text/javascript"
    ></script>

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* =====================================================
           THEME
        ===================================================== */

        :root {

            --bg: #0b0f14;
            --card: #121820;
            --card2: #18212b;
            --border: #263341;

            --text: #f5f7fa;
            --muted: #9aa7b5;

            --primary: #00d084;
            --primary-dark: #00a86b;

            --danger: #ff4d4d;
            --warning: #ffc107;
            --info: #3da5ff;

            --radius: 14px;

        }


        /* =====================================================
           LIGHT THEME
        ===================================================== */

        :root[data-theme="light"] {

            --bg: #f4f6f8;
            --card: #ffffff;
            --card2: #f0f3f6;
            --border: #d9e0e7;

            --text: #151a20;
            --muted: #66717d;

            --primary: #00b873;
            --primary-dark: #00945e;

            --danger: #e53935;
            --warning: #f5b800;
            --info: #1689e8;

        }


        /* =====================================================
           DARK THEME
        ===================================================== */

        :root[data-theme="dark"] {

            --bg: #0b0f14;
            --card: #121820;
            --card2: #18212b;
            --border: #263341;

            --text: #f5f7fa;
            --muted: #9aa7b5;

            --primary: #00d084;
            --primary-dark: #00a86b;

            --danger: #ff4d4d;
            --warning: #ffc107;
            --info: #3da5ff;

        }


        /* =====================================================
           AUTO LIGHT
        ===================================================== */

        @media (prefers-color-scheme: light) {

            :root[data-theme="auto"] {

                --bg: #f4f6f8;
                --card: #ffffff;
                --card2: #f0f3f6;
                --border: #d9e0e7;

                --text: #151a20;
                --muted: #66717d;

                --primary: #00b873;
                --primary-dark: #00945e;

                --danger: #e53935;
                --warning: #f5b800;
                --info: #1689e8;

            }

        }


        /* =====================================================
           AUTO DARK
        ===================================================== */

        @media (prefers-color-scheme: dark) {

            :root[data-theme="auto"] {

                --bg: #0b0f14;
                --card: #121820;
                --card2: #18212b;
                --border: #263341;

                --text: #f5f7fa;
                --muted: #9aa7b5;

                --primary: #00d084;
                --primary-dark: #00a86b;

                --danger: #ff4d4d;
                --warning: #ffc107;
                --info: #3da5ff;

            }

        }


        /* =====================================================
           BODY
        ===================================================== */

        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: var(--bg);
            color: var(--text);

            min-height: 100vh;

            transition:
                background 0.2s ease,
                color 0.2s ease;

        }


        /* =====================================================
           HEADER
        ===================================================== */

        header {

            position: sticky;
            top: 0;
            z-index: 100;

            height: 60px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 15px;

            background: rgba(11, 15, 20, 0.96);

            border-bottom:
                1px solid var(--border);

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

        }


        :root[data-theme="light"] header {

            background:
                rgba(255, 255, 255, 0.96);

        }


        @media (prefers-color-scheme: light) {

            :root[data-theme="auto"] header {

                background:
                    rgba(255, 255, 255, 0.96);

            }

        }


        .logo {

            font-size: 18px;
            font-weight: 800;

            letter-spacing: 1px;

        }


        .header-right {

            display: flex;

            align-items: center;

            gap: 8px;

        }


        /* =====================================================
           THEME BUTTON
        ===================================================== */

        .theme-btn {

            height: 40px;

            min-width: 58px;

            padding: 0 10px;

            border:
                1px solid var(--border);

            border-radius: 10px;

            background: var(--card);

            color: var(--text);

            font-size: 13px;
            font-weight: 700;

            cursor: pointer;

        }


        .theme-btn:active {

            transform: scale(0.95);

        }


        /* =====================================================
           SETTINGS BUTTON
        ===================================================== */

        .icon-btn {

            width: 40px;
            height: 40px;

            border:
                1px solid var(--border);

            border-radius: 10px;

            background: var(--card);

            color: var(--text);

            font-size: 20px;

            cursor: pointer;

        }


        .icon-btn:active {

            transform: scale(0.95);

        }


        /* =====================================================
           MAIN
        ===================================================== */

        main {

            width: 100%;

            max-width: 700px;

            margin: auto;

            padding:
                20px 15px 40px;

        }


        /* =====================================================
           CARD
        ===================================================== */

        .card {

            background: var(--card);

            border:
                1px solid var(--border);

            border-radius: var(--radius);

            padding: 16px;

            margin-bottom: 15px;

        }


        .card-title {

            font-size: 16px;

            font-weight: 700;

            margin-bottom: 12px;

        }


        /* =====================================================
           QR SCANNER
        ===================================================== */

        #qr-reader {

            width: 100%;

            overflow: hidden;

            border-radius: 12px;

            background: #000;

        }


        #qr-reader video {

            width: 100% !important;

            border-radius: 12px;

        }


        #qr-reader__scan_region {

            min-height: 260px;

        }


        #qr-reader__dashboard {

            display: none !important;

        }


        /* =====================================================
           BUTTONS
        ===================================================== */

        .buttons {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 10px;

            margin-top: 12px;

        }


        button {

            border: 0;

            border-radius: 10px;

            min-height: 45px;

            padding:
                10px 12px;

            background: var(--card2);

            border:
                1px solid var(--border);

            color: var(--text);

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

        }


        button:active {

            transform: scale(0.97);

        }


        .primary {

            background: var(--primary);

            color: #00150d;

            border-color:
                var(--primary);

        }


        .danger {

            background: var(--danger);

            color: white;

            border-color:
                var(--danger);

        }


        .warning {

            background: var(--warning);

            color: #111;

            border-color:
                var(--warning);

        }


        .info {

            background: var(--info);

            color: white;

            border-color:
                var(--info);

        }


        /* =====================================================
           STATUS
        ===================================================== */

        .status {

            display: flex;

            align-items: center;

            gap: 9px;

            padding: 12px;

            border-radius: 10px;

            background: var(--card2);

            font-size: 14px;

        }


        .status-dot {

            width: 10px;
            height: 10px;

            border-radius: 50%;

            background: var(--muted);

            flex-shrink: 0;

        }


        .status-dot.online {

            background:
                var(--primary);

        }


        .status-dot.error {

            background:
                var(--danger);

        }


        .status-dot.warning {

            background:
                var(--warning);

        }


        /* =====================================================
           USER INFO
        ===================================================== */

        #userInfo {

            display: none;

        }


        .user-grid {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 10px;

        }


        .info-box {

            padding: 12px;

            background:
                var(--card2);

            border:
                1px solid var(--border);

            border-radius: 10px;

        }


        .info-label {

            color: var(--muted);

            font-size: 12px;

            margin-bottom: 5px;

        }


        .info-value {

            font-size: 15px;

            font-weight: 700;

            word-break: break-word;

        }


        /* =====================================================
           LOG
        ===================================================== */

        #log {

            white-space: pre-wrap;

            word-break: break-word;

            min-height: 100px;

            max-height: 400px;

            overflow-y: auto;

            padding: 12px;

            background: #070a0e;

            border:
                1px solid var(--border);

            border-radius: 10px;

            color: #c8d2dc;

            font-family: monospace;

            font-size: 12px;

            line-height: 1.5;

        }


        /* =====================================================
           MODAL
        ===================================================== */

        .modal {

            position: fixed;

            inset: 0;

            z-index: 999;

            display: none;

            align-items: center;

            justify-content: center;

            padding: 15px;

            background:
                rgba(0, 0, 0, 0.75);

        }


        .modal.show {

            display: flex;

        }


        .modal-box {

            width: 100%;

            max-width: 450px;

            background:
                var(--card);

            border:
                1px solid var(--border);

            border-radius: 16px;

            padding: 20px;

        }


        .modal-title {

            font-size: 19px;

            font-weight: 800;

            margin-bottom: 18px;

        }


        /* =====================================================
           INPUT
        ===================================================== */

        .field {

            margin-bottom: 14px;

        }


        .field label {

            display: block;

            color: var(--muted);

            font-size: 13px;

            margin-bottom: 6px;

        }


        .input-row {

            display: flex;

            gap: 5px;

        }


        input {

            width: 100%;

            padding: 12px;

            background: var(--card2);

            color: var(--text);

            border:
                1px solid var(--border);

            border-radius: 9px;

            outline: none;

            font-size: 14px;

        }


        input:focus {

            border-color:
                var(--primary);

        }


        .eye {

            width: 48px;

            flex-shrink: 0;

        }


        /* =====================================================
           CHECKBOX
        ===================================================== */

        .remember {

            display: flex;

            align-items: center;

            gap: 8px;

            margin-bottom: 15px;

            color: var(--muted);

            font-size: 13px;

        }


        .remember input {

            width: auto;

        }


        /* =====================================================
           MODAL BUTTONS
        ===================================================== */

        .modal-buttons {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 8px;

        }


        .modal-buttons .full {

            grid-column: 1 / -1;

        }


        /* =====================================================
           PLAN MODAL
        ===================================================== */

        #planModal .modal-box {

            max-width: 500px;

        }


        #plans {

            display: grid;

            gap: 10px;

        }


        .plan {

            text-align: left;

            padding: 14px;

            background:
                var(--card2);

            border:
                1px solid var(--border);

            border-radius: 12px;

        }


        .plan-name {

            font-size: 16px;

            font-weight: 800;

        }


        .plan-description {

            margin-top: 5px;

            color: var(--muted);

            font-size: 13px;

        }


        .plan-bottom {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-top: 10px;

        }


        .plan-duration {

            color:
                var(--primary);

            font-weight: 700;

        }


        .plan-price {

            font-weight: 800;

        }


        /* =====================================================
           HIDDEN GALLERY SCANNER
        ===================================================== */

        #temporaryQrScanner {

            position: fixed;

            width: 1px;
            height: 1px;

            left: -10000px;
            top: -10000px;

            opacity: 0;

            pointer-events: none;

            overflow: hidden;

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 500px) {

            header {

                padding: 0 10px;

            }


            main {

                padding:
                    12px 10px 30px;

            }


            .buttons {

                grid-template-columns:
                    1fr 1fr 1fr;

            }


            .user-grid {

                grid-template-columns:
                    1fr;

            }


            .logo {

                font-size: 16px;

            }


            .theme-btn {

                height: 38px;

                min-width: 52px;

                padding: 0 7px;

                font-size: 12px;

            }


            .icon-btn {

                width: 38px;

                height: 38px;

            }

        }








/* =====================================================
   QR SCAN CORNER MARKERS
===================================================== */

#qr-reader {
    position: relative;
}

/* Scanner frame */
#qr-reader::before {
    content: "";
    position: absolute;

    width: 210px;
    height: 210px;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    pointer-events: none;

    z-index: 20;

    background:
        linear-gradient(var(--primary), var(--primary)) top left,
        linear-gradient(var(--primary), var(--primary)) top right,
        linear-gradient(var(--primary), var(--primary)) bottom left,
        linear-gradient(var(--primary), var(--primary)) bottom right;

    background-size:
        35px 4px,
        35px 4px,
        35px 4px,
        35px 4px;

    background-repeat: no-repeat;
}

/* Optional scanning line */
#qr-reader::after {
    content: "";

    position: absolute;

    width: 210px;
    height: 2px;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    background: var(--primary);

    opacity: 0.7;

    box-shadow:
        0 0 8px var(--primary);

    pointer-events: none;

    z-index: 21;

    animation: qrScanLine 2s ease-in-out infinite;
}

@keyframes qrScanLine {

    0% {
        transform:
            translate(-50%, -105px);
    }

    50% {
        transform:
            translate(-50%, 105px);
    }

    100% {
        transform:
            translate(-50%, -105px);
    }

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 500px) {

    #qr-reader::before {
        width: 190px;
        height: 190px;

        background-size:
            32px 4px,
            32px 4px,
            32px 4px,
            32px 4px;
    }

    #qr-reader::after {
        width: 190px;
    }

}

    </style>

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header>

    <div class="logo">
        BobotEditha.net
    </div>


    <div class="header-right">

        <button
            class="theme-btn"
            id="themeButton"
            onclick="cycleTheme()"
            title="Change Theme"
        >
            Auto
        </button>


        <button
            class="icon-btn"
            onclick="openSettings()"
            title="MikroTik Settings"
        >
            ⚙
        </button>

    </div>

</header>


<!-- =========================================================
     MAIN
========================================================= -->

<main>


    <!-- =====================================================
         QR CARD
    ====================================================== -->

    <div class="card">

        <div class="card-title">
            QR Scanner
        </div>


        <div id="qr-reader"></div>


        <div class="buttons">

            <button
                class="info"
                onclick="scanGallery()"
            >
                🖼 Gallery
            </button>


            <button
                class="warning"
                id="flashButton"
                onclick="toggleFlash()"
            >
                🔦 Flash
            </button>


            <button
                class="danger"
                onclick="restartScanner()"
            >
                ↻ Restart
            </button>

        </div>

    </div>


    <!-- =====================================================
         STATUS
    ====================================================== -->

    <div class="card">

        <div class="card-title">
            MikroTik Status
        </div>


        <div class="status">

            <span
                id="statusDot"
                class="status-dot"
            ></span>


            <span id="statusText">
                Not connected
            </span>

        </div>

    </div>


    <!-- =====================================================
         USER INFORMATION
    ===================================================== -->

    <div
        class="card"
        id="userInfo"
    >

        <div class="card-title">
            User Information
        </div>


        <div class="user-grid">


            <div class="info-box">

                <div class="info-label">
                    Username
                </div>

                <div
                    class="info-value"
                    id="infoUsername"
                >
                    -
                </div>

            </div>


            <div class="info-box">

                <div class="info-label">
                    Current Time Left
                </div>

                <div
                    class="info-value"
                    id="infoCurrentTime"
                >
                    -
                </div>

            </div>


            <div class="info-box">

                <div class="info-label">
                    Plan to Add
                </div>

                <div
                    class="info-value"
                    id="infoPlan"
                >
                    -
                </div>

            </div>


            <div class="info-box">

                <div class="info-label">
                    New Total Time
                </div>

                <div
                    class="info-value"
                    id="infoTotal"
                >
                    -
                </div>

            </div>


            <div class="info-box">

                <div class="info-label">
                    New Expiration
                </div>

                <div
                    class="info-value"
                    id="infoExpiration"
                >
                    -
                </div>

            </div>

        </div>

    </div>


    <!-- =====================================================
         ACTIVITY LOG
    ====================================================== -->

    <div class="card">

        <div class="card-title">
            Activity Log
        </div>


        <div id="log"></div>

    </div>


</main>


<!-- =========================================================
     TEMPORARY QR SCANNER
========================================================= -->

<div id="temporaryQrScanner"></div>


<!-- =========================================================
     SETTINGS MODAL
========================================================= -->

<div
    class="modal"
    id="settingsModal"
>

    <div class="modal-box">


        <div class="modal-title">
            MikroTik Settings
        </div>


        <div class="field">

            <label>
                API URL
            </label>

            <input
                type="text"
                id="apiUrl"
                placeholder="https://10.0.0.1/rest"
            >

        </div>


        <div class="field">

            <label>
                Username
            </label>

            <input
                type="text"
                id="mtUsername"
                placeholder="admin"
                autocomplete="username"
            >

        </div>


        <div class="field">

            <label>
                Password
            </label>


            <div class="input-row">

                <input
                    type="password"
                    id="mtPassword"
                    placeholder="Password"
                    autocomplete="current-password"
                >


                <button
                    class="eye"
                    onclick="togglePassword()"
                    type="button"
                >
                    👁
                </button>

            </div>

        </div>


        <label class="remember">

            <input
                type="checkbox"
                id="rememberMe"
            >

            Remember Me

        </label>


        <div class="modal-buttons">

            <button
                class="primary"
                onclick="connectMikrotik()"
            >
                Connect
            </button>


            <button
                class="danger"
                onclick="clearSavedSettings()"
            >
                Clear
            </button>


            <button
                class="full"
                onclick="closeSettings()"
            >
                Cancel
            </button>

        </div>

    </div>

</div>


<!-- =========================================================
     PLAN MODAL
========================================================= -->

<div
    class="modal"
    id="planModal"
>

    <div class="modal-box">


        <div class="modal-title">
            Select WiFi Plan
        </div>


        <div id="plans">
            Loading plans...
        </div>


        <div style="margin-top:15px">

            <button
                class="full"
                onclick="closePlanModal()"
            >
                Cancel
            </button>

        </div>

    </div>

</div>


<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script src="script.js"></script>


</body>

</html>
