<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="BobotEditha.net QR WiFi Manager"
    >

    <title>BobotEditha.net - QR WiFi Manager</title>


    <!-- =====================================================
         HTML5 QR CODE
    ====================================================== -->

    <script
        src="https://unpkg.com/html5-qrcode"
        type="text/javascript"
    ></script>


    <!-- =====================================================
         STYLE
    ====================================================== -->

    <style>


        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* =====================================================
           THEME VARIABLES
        ===================================================== */

        :root {

            --bg: #f4f6f8;
            --card: #ffffff;
            --card2: #f0f2f5;
            --border: #dfe3e8;

            --text: #15191e;
            --muted: #69737d;

            --primary: #00b86b;
            --primary-dark: #00995a;

            --danger: #e5484d;
            --warning: #e5a900;
            --info: #2684ff;

            --input: #ffffff;
            --log-bg: #f5f6f8;

            --radius: 10px;
        }


        /* =====================================================
           DARK MODE
        ===================================================== */

        html[data-theme="dark"] {

            --bg: #0b0f14;
            --card: #11171e;
            --card2: #171e26;
            --border: #252e38;

            --text: #f1f4f7;
            --muted: #929eaa;

            --primary: #00d084;
            --primary-dark: #00aa6b;

            --danger: #ff5055;
            --warning: #ffc107;
            --info: #3d9bff;

            --input: #0c1117;
            --log-bg: #070a0e;
        }


        /* =====================================================
           AUTO DARK MODE
        ===================================================== */

        @media (prefers-color-scheme: dark) {

            html:not([data-theme="light"]) {

                --bg: #0b0f14;
                --card: #11171e;
                --card2: #171e26;
                --border: #252e38;

                --text: #f1f4f7;
                --muted: #929eaa;

                --primary: #00d084;
                --primary-dark: #00aa6b;

                --danger: #ff5055;
                --warning: #ffc107;
                --info: #3d9bff;

                --input: #0c1117;
                --log-bg: #070a0e;
            }

        }


        /* =====================================================
           COLOR SCHEME
        ===================================================== */

        html {
            color-scheme: light;
        }

        html[data-theme="dark"] {
            color-scheme: dark;
        }

        @media (prefers-color-scheme: dark) {

            html:not([data-theme="light"]) {
                color-scheme: dark;
            }

        }


        /* =====================================================
           BODY
        ===================================================== */

        body {

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background: var(--bg);

            color: var(--text);

            min-height: 100vh;

            transition:
                background .2s ease,
                color .2s ease;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        header {

            position: sticky;

            top: 0;

            z-index: 100;

            height: 52px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 12px;

            background: var(--card);

            border-bottom:
                1px solid var(--border);
        }


        .logo {

            font-size: 15px;

            font-weight: 800;

            letter-spacing: .3px;

            white-space: nowrap;
        }


        .header-right {

            display: flex;

            align-items: center;

            gap: 5px;
        }


        /* =====================================================
           ICON BUTTON
        ===================================================== */

        .icon-btn {

            width: 34px;

            height: 34px;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            padding: 0;

            border:
                1px solid var(--border);

            border-radius: 8px;

            background: var(--card2);

            color: var(--text);

            cursor: pointer;
        }


        .icon-btn svg {

            width: 17px;

            height: 17px;

            stroke: currentColor;

            fill: none;

            stroke-width: 1.8;

            stroke-linecap: round;

            stroke-linejoin: round;
        }


        .icon-btn:active {

            transform: scale(.95);
        }


        /* =====================================================
           MAIN
        ===================================================== */

        main {

            width: 100%;

            max-width: 620px;

            margin: auto;

            padding:
                12px
                10px
                30px;
        }


        /* =====================================================
           CARD
        ===================================================== */

        .card {

            background: var(--card);

            border:
                1px solid var(--border);

            border-radius: var(--radius);

            padding: 12px;

            margin-bottom: 9px;
        }


        .card-title {

            display: flex;

            align-items: center;

            font-size: 13px;

            font-weight: 750;

            margin-bottom: 9px;
        }


        /* =====================================================
           QR SCANNER
        ===================================================== */

        #qr-reader {

            width: 100%;

            overflow: hidden;

            border-radius: 9px;

            background: #000;

            border:
                1px solid var(--border);
        }


        #qr-reader video {

            display: block;

            width: 100% !important;

            border-radius: 9px;
        }


        #qr-reader__scan_region {

            min-height: 220px;
        }


        #qr-reader__dashboard {

            display: none !important;
        }


        /* =====================================================
           BUTTONS
        ===================================================== */

        .buttons {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 6px;

            margin-top: 7px;
        }


        button {

            min-height: 38px;

            padding:
                7px
                9px;

            border:
                1px solid var(--border);

            border-radius: 8px;

            background: var(--card2);

            color: var(--text);

            font-family: inherit;

            font-size: 12px;

            font-weight: 700;

            cursor: pointer;

            transition:
                transform .12s ease,
                opacity .12s ease,
                background .15s ease;
        }


        button:active {

            transform: scale(.97);
        }


        button svg {

            width: 15px;

            height: 15px;

            vertical-align: -3px;

            margin-right: 4px;

            stroke: currentColor;

            fill: none;

            stroke-width: 1.8;

            stroke-linecap: round;

            stroke-linejoin: round;
        }


        .primary {

            background: var(--primary);

            color: #00150d;

            border-color:
                var(--primary);
        }


        .primary:hover {

            background:
                var(--primary-dark);
        }


        .danger {

            background: var(--danger);

            color: #fff;

            border-color:
                var(--danger);
        }


        .warning {

            background: var(--warning);

            color: #111;

            border-color:
                var(--warning);
        }


        .info {

            background: var(--info);

            color: #fff;

            border-color:
                var(--info);
        }


        /* =====================================================
           STATUS
        ===================================================== */

        .status {

            display: flex;

            align-items: center;

            gap: 7px;

            min-height: 38px;

            padding:
                8px
                10px;

            border-radius: 8px;

            background: var(--card2);

            font-size: 12px;
        }


        .status-dot {

            width: 8px;

            height: 8px;

            flex-shrink: 0;

            border-radius: 50%;

            background: var(--muted);
        }


        .status-dot.online {

            background:
                var(--primary);

            box-shadow:
                0 0 0 3px
                rgba(0,208,132,.10);
        }


        .status-dot.error {

            background:
                var(--danger);

            box-shadow:
                0 0 0 3px
                rgba(229,72,77,.10);
        }


        .status-dot.warning {

            background:
                var(--warning);

            box-shadow:
                0 0 0 3px
                rgba(229,169,0,.10);
        }


        /* =====================================================
           USER INFORMATION
        ===================================================== */

        #userInfo {

            display: none;
        }


        .user-grid {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 6px;
        }


        .info-box {

            padding: 9px;

            background: var(--card2);

            border:
                1px solid var(--border);

            border-radius: 8px;
        }


        .info-label {

            color: var(--muted);

            font-size: 10px;

            margin-bottom: 3px;
        }


        .info-value {

            font-size: 12px;

            font-weight: 750;

            word-break: break-word;
        }


        /* =====================================================
           LOG
        ===================================================== */

        #log {

            white-space: pre-wrap;

            word-break: break-word;

            min-height: 75px;

            max-height: 260px;

            overflow-y: auto;

            padding: 9px;

            background: var(--log-bg);

            border:
                1px solid var(--border);

            border-radius: 8px;

            color: var(--muted);

            font-family:
                "SFMono-Regular",
                Consolas,
                "Liberation Mono",
                monospace;

            font-size: 10px;

            line-height: 1.45;
        }


        /* =====================================================
           MODAL
        ===================================================== */

        .modal {

            position: fixed;

            inset: 0;

            z-index: 999;

            display: none;

            align-items: center;

            justify-content: center;

            padding: 12px;

            background:
                rgba(0,0,0,.68);

            backdrop-filter:
                blur(4px);
        }


        .modal.show {

            display: flex;
        }


        .modal-box {

            width: 100%;

            max-width: 410px;

            max-height: 90vh;

            overflow-y: auto;

            background: var(--card);

            border:
                1px solid var(--border);

            border-radius: 12px;

            padding: 14px;

            box-shadow:
                0 15px 50px
                rgba(0,0,0,.25);
        }


        .modal-title {

            font-size: 16px;

            font-weight: 800;

            margin-bottom: 14px;
        }


        /* =====================================================
           INPUT
        ===================================================== */

        .field {

            margin-bottom: 10px;
        }


        .field label {

            display: block;

            color: var(--muted);

            font-size: 11px;

            margin-bottom: 4px;
        }


        .input-row {

            display: flex;

            gap: 5px;
        }


        input {

            width: 100%;

            min-height: 38px;

            padding:
                8px
                10px;

            background: var(--input);

            color: var(--text);

            border:
                1px solid var(--border);

            border-radius: 8px;

            outline: none;

            font-family: inherit;

            font-size: 12px;

            transition:
                border-color .15s ease;
        }


        input:focus {

            border-color:
                var(--primary);
        }


        .eye {

            width: 38px;

            min-width: 38px;

            padding: 0;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        .eye svg {

            width: 16px;

            height: 16px;

            margin: 0;

            stroke: currentColor;

            fill: none;

            stroke-width: 1.8;

            stroke-linecap: round;

            stroke-linejoin: round;
        }


        /* =====================================================
           SELECT
        ===================================================== */

        select {

            width: 100%;

            min-height: 38px;

            padding:
                8px
                10px;

            background: var(--input);

            color: var(--text);

            border:
                1px solid var(--border);

            border-radius: 8px;

            outline: none;

            font-family: inherit;

            font-size: 12px;

            cursor: pointer;
        }


        select:focus {

            border-color:
                var(--primary);
        }


        /* =====================================================
           CHECKBOX
        ===================================================== */

        .remember {

            display: flex;

            align-items: center;

            gap: 6px;

            margin-bottom: 11px;

            color: var(--muted);

            font-size: 11px;
        }


        .remember input {

            width: 14px;

            min-height: 14px;

            accent-color:
                var(--primary);
        }


        /* =====================================================
           MODAL BUTTONS
        ===================================================== */

        .modal-buttons {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 6px;
        }


        .modal-buttons .full {

            grid-column:
                1 / -1;
        }


        /* =====================================================
           PLAN MODAL
        ===================================================== */

        #planModal .modal-box {

            max-width: 430px;
        }


        #plans {

            display: grid;

            gap: 6px;
        }


        .plan {

            width: 100%;

            min-height: auto;

            text-align: left;

            padding: 10px;

            background: var(--card2);

            border:
                1px solid var(--border);

            border-radius: 9px;
        }


        .plan:hover {

            border-color:
                var(--primary);
        }


        .plan-name {

            font-size: 13px;

            font-weight: 800;
        }


        .plan-description {

            margin-top: 3px;

            color: var(--muted);

            font-size: 10px;
        }


        .plan-bottom {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-top: 7px;
        }


        .plan-duration {

            color: var(--primary);

            font-size: 11px;

            font-weight: 750;
        }


        .plan-price {

            font-size: 12px;

            font-weight: 800;
        }


        /* =====================================================
           HIDDEN GALLERY SCANNER
        ===================================================== */

        #temporaryQrScanner {

            position: fixed;

            width: 1px;

            height: 1px;

            left: -10000px;

            top: -10000px;

            opacity: 0;

            pointer-events: none;

            overflow: hidden;
        }


        /* =====================================================
           SCROLLBAR
        ===================================================== */

        ::-webkit-scrollbar {

            width: 5px;
        }


        ::-webkit-scrollbar-track {

            background: transparent;
        }


        ::-webkit-scrollbar-thumb {

            background: var(--border);

            border-radius: 10px;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 500px) {

            header {

                height: 50px;

                padding:
                    0 10px;
            }


            main {

                padding:
                    9px
                    8px
                    25px;
            }


            .card {

                padding: 10px;

                margin-bottom: 7px;
            }


            .buttons {

                gap: 5px;
            }


            button {

                min-height: 36px;

                padding:
                    6px
                    5px;

                font-size: 11px;
            }


            button svg {

                width: 14px;

                height: 14px;

                margin-right: 2px;
            }


            .user-grid {

                grid-template-columns:
                    1fr;
            }


            .logo {

                font-size: 14px;
            }

        }


        /* =====================================================
           VERY SMALL SCREEN
        ===================================================== */

        @media (max-width: 350px) {

            .buttons {

                grid-template-columns:
                    1fr;
            }

        }


        /* =====================================================
           REDUCE MOTION
        ===================================================== */

        @media (prefers-reduced-motion: reduce) {

            * {

                transition:
                    none !important;
            }

        }

    </style>

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header>

    <div class="logo">
        BobotEditha.net
    </div>


    <div class="header-right">

        <button
            class="icon-btn"
            onclick="openSettings()"
            title="MikroTik Settings"
            type="button"
        >

            <!-- SETTINGS SVG -->

            <svg viewBox="0 0 24 24">

                <path
                    d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"
                />

                <path
                    d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.8 1.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V20h-2.6v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1-1.8-1.8.1-.1A1.7 1.7 0 0 0 8 15a1.7 1.7 0 0 0-1.6-1H6v-2.6h.4A1.7 1.7 0 0 0 8 10.3a1.7 1.7 0 0 0-.3-1.9l-.1-.1 1.8-1.8.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6V5h2.6v.3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.8 1.8-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.3V14h-.3a1.7 1.7 0 0 0-1.6 1Z"
                />

            </svg>

        </button>

    </div>

</header>


<!-- =========================================================
     MAIN
========================================================= -->

<main>


    <!-- =====================================================
         QR CARD
    ====================================================== -->

    <div class="card">

        <div class="card-title">
            QR Scanner
        </div>


        <div id="qr-reader"></div>


        <div class="buttons">


            <!-- GALLERY -->

            <button
                class="info"
                onclick="scanGallery()"
                type="button"
            >

                <svg viewBox="0 0 24 24">

                    <rect
                        x="3"
                        y="4"
                        width="18"
                        height="16"
                        rx="2"
                    />

                    <circle
                        cx="8.5"
                        cy="9"
                        r="1.5"
                    />

                    <path
                        d="m3 17 5-5 4 4 3-3 6 6"
                    />

                </svg>

                Gallery

            </button>


            <!-- FLASH -->

            <button
                class="warning"
                id="flashButton"
                onclick="toggleFlash()"
                type="button"
            >

                <svg viewBox="0 0 24 24">

                    <path
                        d="M9 2h6l-1 7h4l-7 13 1-9H8L9 2Z"
                    />

                </svg>

                Flash

            </button>


            <!-- RESTART -->

            <button
                class="danger"
                onclick="restartScanner()"
                type="button"
            >

                <svg viewBox="0 0 24 24">

                    <path
                        d="M20 11a8 8 0 0 0-14.9-4"
                    />

                    <path
                        d="M5 3v4h4"
                    />

                    <path
                        d="M4 13a8 8 0 0 0 14.9 4"
                    />

                    <path
                        d="M19 21v-4h-4"
                    />

                </svg>

                Restart

            </button>


        </div>

    </div>


    <!-- =====================================================
         STATUS
    ====================================================== -->

    <div class="card">

        <div class="card-title">
            MikroTik Status
        </div>


        <div class="status">

            <span
                id="statusDot"
                class="status-dot"
            ></span>


            <span id="statusText">
                Not connected
            </span>

        </div>

    </div>


    <!-- =====================================================
         USER INFORMATION
    ====================================================== -->

    <div
        class="card"
        id="userInfo"
    >

        <div class="card-title">
            User Information
        </div>


        <div class="user-grid">


            <div class="info-box">

                <div class="info-label">
                    Username
                </div>

                <div
                    class="info-value"
                    id="infoUsername"
                >
                    -
                </div>

            </div>


            <div class="info-box">

                <div class="info-label">
                    Current Time Left
                </div>

                <div
                    class="info-value"
                    id="infoCurrentTime"
                >
                    -
                </div>

            </div>


            <div class="info-box">

                <div class="info-label">
                    Plan to Add
                </div>

                <div
                    class="info-value"
                    id="infoPlan"
                >
                    -
                </div>

            </div>


            <div class="info-box">

                <div class="info-label">
                    New Total Time
                </div>

                <div
                    class="info-value"
                    id="infoTotal"
                >
                    -
                </div>

            </div>


            <div class="info-box">

                <div class="info-label">
                    New Expiration
                </div>

                <div
                    class="info-value"
                    id="infoExpiration"
                >
                    -
                </div>

            </div>


        </div>

    </div>


    <!-- =====================================================
         ACTIVITY LOG
    ====================================================== -->

    <div class="card">

        <div class="card-title">
            Activity Log
        </div>

        <div id="log"></div>

    </div>


</main>


<!-- =========================================================
     TEMPORARY QR SCANNER
========================================================= -->

<div id="temporaryQrScanner"></div>


<!-- =========================================================
     SETTINGS MODAL
========================================================= -->

<div
    class="modal"
    id="settingsModal"
>

    <div class="modal-box">


        <div class="modal-title">
            MikroTik Settings
        </div>


        <!-- API URL -->

        <div class="field">

            <label>
                API URL
            </label>

            <input
                type="text"
                id="apiUrl"
                placeholder="https://10.0.0.1/rest"
                autocomplete="url"
            >

        </div>


        <!-- USERNAME -->

        <div class="field">

            <label>
                Username
            </label>

            <input
                type="text"
                id="mtUsername"
                placeholder="admin"
                autocomplete="username"
            >

        </div>


        <!-- PASSWORD -->

        <div class="field">

            <label>
                Password
            </label>


            <div class="input-row">

                <input
                    type="password"
                    id="mtPassword"
                    placeholder="Password"
                    autocomplete="current-password"
                >


                <button
                    class="eye"
                    onclick="togglePassword()"
                    type="button"
                    title="Show password"
                >

                    <svg
                        id="eyeIcon"
                        viewBox="0 0 24 24"
                    >

                        <path
                            d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
                        />

                        <circle
                            cx="12"
                            cy="12"
                            r="3"
                        />

                    </svg>

                </button>

            </div>

        </div>


        <!-- APPEARANCE -->

        <div class="field">

            <label>
                Appearance
            </label>


            <select
                id="themeSelect"
                onchange="setTheme(this.value)"
            >

                <option value="auto">
                    Auto
                </option>

                <option value="light">
                    Light
                </option>

                <option value="dark">
                    Dark
                </option>

            </select>

        </div>


        <!-- REMEMBER -->

        <label class="remember">

            <input
                type="checkbox"
                id="rememberMe"
            >

            Remember Me

        </label>


        <!-- BUTTONS -->

        <div class="modal-buttons">


            <button
                class="primary"
                onclick="connectMikrotik()"
                type="button"
            >

                Connect

            </button>


            <button
                class="danger"
                onclick="clearSavedSettings()"
                type="button"
            >

                Clear

            </button>


            <button
                class="full"
                onclick="closeSettings()"
                type="button"
            >

                Cancel

            </button>


        </div>


    </div>

</div>


<!-- =========================================================
     PLAN MODAL
========================================================= -->

<div
    class="modal"
    id="planModal"
>

    <div class="modal-box">


        <div class="modal-title">
            Select WiFi Plan
        </div>


        <div id="plans">
            Loading plans...
        </div>


        <div style="margin-top:10px">

            <button
                class="full"
                onclick="closePlanModal()"
                type="button"
            >

                Cancel

            </button>

        </div>


    </div>

</div>


<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script>


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let mikrotik = {

    apiUrl: "",
    username: "",
    password: ""

};


let plans = [];

let currentQR = null;

let currentFlashTrack = null;

let scanner = null;

let scanBusy = false;


/* =========================================================
   THEME
========================================================= */

function setTheme(theme) {

    if (theme === "auto") {

        localStorage.removeItem(
            "qr_theme"
        );

        document.documentElement
            .removeAttribute(
                "data-theme"
            );

    } else {

        document.documentElement
            .setAttribute(
                "data-theme",
                theme
            );

        localStorage.setItem(
            "qr_theme",
            theme
        );

    }

}


/* =========================================================
   LOAD THEME
========================================================= */

function loadTheme() {

    const saved =
        localStorage.getItem(
            "qr_theme"
        ) || "auto";


    const select =
        document.getElementById(
            "themeSelect"
        );


    if (select) {

        select.value = saved;

    }


    if (saved === "auto") {

        document.documentElement
            .removeAttribute(
                "data-theme"
            );

    } else {

        document.documentElement
            .setAttribute(
                "data-theme",
                saved
            );

    }

}


/* =========================================================
   LOG
========================================================= */

function log(message) {

    const logBox =
        document.getElementById(
            "log"
        );


    const time =
        new Date()
            .toLocaleTimeString();


    logBox.textContent +=
        `[${time}] ${message}\n`;


    logBox.scrollTop =
        logBox.scrollHeight;

}


/* =========================================================
   STATUS
========================================================= */

function setStatus(
    text,
    type = ""
) {

    document.getElementById(
        "statusText"
    ).textContent = text;


    const dot =
        document.getElementById(
            "statusDot"
        );


    dot.className =
        "status-dot";


    if (type) {

        dot.classList.add(
            type
        );

    }

}


/* =========================================================
   LOAD PLANS
========================================================= */

async function loadPlans() {

    try {

        const response =
            await fetch(
                "plan.json",
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Cannot load plan.json"
            );

        }


        const data =
            await response.json();


        plans =
            Array.isArray(data)
                ? data
                : data.plans || [];


        plans =
            plans.filter(
                plan =>
                    plan.enabled !== false
            );


        renderPlans();


        log(
            `Loaded ${plans.length} active plans.`
        );


    } catch (error) {

        console.error(error);


        document.getElementById(
            "plans"
        ).innerHTML =

            `<div style="color:var(--danger)">
                Failed to load plan.json
             </div>`;


        log(
            "ERROR loading plan.json: " +
            error.message
        );

    }

}


/* =========================================================
   RENDER PLANS
========================================================= */

function renderPlans() {

    const container =
        document.getElementById(
            "plans"
        );


    container.innerHTML = "";


    if (!plans.length) {

        container.innerHTML =
            "No active plans.";

        return;

    }


    plans.forEach(
        plan => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "plan";


            button.type =
                "button";


            button.innerHTML = `

                <div class="plan-name">
                    ${escapeHtml(
                        plan.name ||
                        "Plan"
                    )}
                </div>

                <div class="plan-description">
                    ${escapeHtml(
                        plan.description ||
                        ""
                    )}
                </div>

                <div class="plan-bottom">

                    <span class="plan-duration">
                        ${escapeHtml(
                            plan.duration ||
                            ""
                        )}
                    </span>

                    <span class="plan-price">
                        ₱${Number(
                            plan.price || 0
                        ).toFixed(2)}
                    </span>

                </div>
            `;


            button.onclick =
                () => {

                    closePlanModal();


                    processUser(
                        currentQR.username,
                        currentQR.password,
                        plan
                    );

                };


            container.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =========================================================
   SETTINGS
========================================================= */

function openSettings() {

    document.getElementById(
        "settingsModal"
    ).classList.add(
        "show"
    );

}


function closeSettings() {

    document.getElementById(
        "settingsModal"
    ).classList.remove(

    );

}

   PASSWORD SHOW / HIDE
========================================================= */

                d="M10.6 10.6a2 2 0 0 0 2.8 2.8"
            />

            <path
                d="M9.9 5.2A10.6 10.6 0 0 1 12 5c6.5 0 10 7 10 7a17.5 17.5 0 0 1-3.1 3.9"
            />

            <path
                d="M6.2 6.2C3.5 8 2 12 2 12s3.5 7 10 7c1.8 0 3.4-.5 4.8-1.2"
            />

        `;


    } else {

        input.type =

        icon.innerHTML = `

            <path

/* =========================================================
   SAVE SETTINGS
========================================================= */

function saveSettings() {

    const remember =
        document.getElementById(
            "rememberMe"
        ).checked;


    if (!remember) {

        localStorage.removeItem(
            "mikrotik_qr_config"
        );

        return;

    }


    const config = {

        apiUrl:
            document.getElementById(
                "apiUrl"
            ).value.trim(),

        username:
            document.getElementById(
                "mtUsername"
            ).value.trim(),

        password:
            document.getElementById(
                "mtPassword"
            ).value,

        remember:
            true

    };


    localStorage.setItem(
        "mikrotik_qr_config",
        JSON.stringify(config)
    );

}


/* =========================================================
   LOAD SAVED SETTINGS
========================================================= */

function loadSavedSettings() {

    try {

        const saved =
            localStorage.getItem(
                "mikrotik_qr_config"
            );


        if (!saved) return;


        const config =
            JSON.parse(saved);


        document.getElementById(
            "apiUrl"
        ).value =
            config.apiUrl || "";


        document.getElementById(
            "mtUsername"
        ).value =
            config.username || "";


        document.getElementById(
            "mtPassword"
        ).value =
            config.password || "";


        document.getElementById(
            "rememberMe"
        ).checked =
            config.remember === true;


        mikrotik.apiUrl =
            config.apiUrl || "";


        mikrotik.username =
            config.username || "";


        mikrotik.password =
            config.password || "";


        if (mikrotik.apiUrl) {

            log(
                "Saved MikroTik configuration loaded."
            );

        }


    } catch (error) {

        console.error(error);

    }

}


/* =========================================================
   CLEAR SETTINGS
========================================================= */

function clearSavedSettings() {

    localStorage.removeItem(
        "mikrotik_qr_config"
    );


    document.getElementById(
        "apiUrl"
    ).value = "";


    document.getElementById(
        "mtUsername"
    ).value = "";


    document.getElementById(
        "mtPassword"
    ).value = "";


    document.getElementById(
        "rememberMe"
    ).checked = false;


    mikrotik = {

        apiUrl: "",
        username: "",
        password: ""

    };


    setStatus(
        "Configuration cleared.",
        "warning"
    );


    log(
        "Saved MikroTik configuration cleared."
    );

}


/* =========================================================
   CONNECT MIKROTIK
========================================================= */

async function connectMikrotik() {

    const apiUrl =
        document.getElementById(
            "apiUrl"
        ).value.trim();


    const username =
        document.getElementById(
            "mtUsername"
        ).value.trim();


    const password =
        document.getElementById(
            "mtPassword"
        ).value;


    if (!apiUrl) {

        alert(
            "Enter MikroTik API URL."
        );

        return;

    }


    if (!username) {

        alert(
            "Enter MikroTik username."
        );

        return;

    }


    mikrotik = {

        apiUrl:
            apiUrl.replace(
                /\/+$/,
                ""
            ),

        username,

        password

    };


    saveSettings();


    setStatus(
        "Testing MikroTik connection...",
        "warning"
    );


    log(
        "Testing MikroTik REST API..."
    );


    try {

        /*
         * Small connection test.
         *
         * Does NOT download hotspot users.
         */

        const response =
            await mtFetch(
                "/system/identity"
            );


        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const data =
            await response.json();


        const identity =
            data[0]?.name ||
            "MikroTik";


        setStatus(
            `Connected: ${identity}`,
            "online"
        );


        log(
            `Connected to MikroTik: ${identity}`
        );


        closeSettings();


    } catch (error) {

        setStatus(
            "Connection failed",
            "error"
        );


        log(
            "Connection ERROR: " +
            error.message
        );


        alert(
            "MikroTik connection failed.\n\n" +
            error.message
        );

    }

}


/* =========================================================
   MIKROTIK FETCH
========================================================= */

async function mtFetch(
    endpoint,
    options = {}
) {

    if (!mikrotik.apiUrl) {

        throw new Error(
            "MikroTik API is not configured."
        );

    }


    const url =
        mikrotik.apiUrl +
        "/" +
        endpoint.replace(
            /^\/+/,
            ""
        );


    const headers = {

        "Content-Type":
            "application/json",

        "Authorization":
            "Basic " +
            btoa(
                mikrotik.username +
                ":" +
                mikrotik.password
            )

    };


    return fetch(
        url,
        {

            ...options,

            headers: {

                ...headers,

                ...(options.headers || {})

            }

        }
    );

}

   QR SUCCESS
========================================================= */

/* =========================================================
   START SCANNER
========================================================= */

async function startScanner() {

    if (scanner) return;


    scanner =
        new Html5Qrcode(
            "qr-reader"
        );


    try {

        const cameras =
            await Html5Qrcode.getCameras();


        if (!cameras.length) {

            throw new Error(
                "No camera found."
            );

        }


        /*
         * Prefer back camera.
         */

        let cameraId =
            cameras[0].id;


        const backCamera =
            cameras.find(
                camera =>
                    /back|rear|environment/i
                        .test(
                            camera.label
                        )
            );


        if (backCamera) {

            cameraId =
                backCamera.id;

        }


        await scanner.start(

            cameraId,

            {

                fps: 10,

                qrbox:
                    function(
                        width,
                        height
                    ) {

                        const size =
                            Math.min(
                                width,
                                height
                            ) * 0.70;


                        return {

                            width: size,

                            height: size

                        };

                    }

            },

            onScanSuccess,

            onScanFailure

        );


        log(
            "Camera scanner started."
        );


    } catch (error) {

        console.error(error);


        log(
            "Camera ERROR: " +
            error.message
        );


        setStatus(
            "Camera unavailable",
            "error"
        );

    }

}


/* =========================================================
   STOP SCANNER
========================================================= */

async function stopScanner() {

    if (!scanner) return;


    try {

        if (
            scanner.getState() ===
            Html5QrcodeScannerState.SCANNING
        ) {

            await scanner.stop();

        }

    } catch (error) {

        console.warn(error);

    }


    try {

        scanner.clear();

    } catch (error) {

        console.warn(error);

    }


    scanner = null;


    currentFlashTrack =
        null;


    const flashButton =
        document.getElementById(
            "flashButton"
        );


    if (flashButton) {

        flashButton.innerHTML = `

            <svg viewBox="0 0 24 24">

                <path
                    d="M9 2h6l-1 7h4l-7 13 1-9H8L9 2Z"
                />

            </svg>

            Flash

        `;

    }

}


/* =========================================================
   RESTART SCANNER
========================================================= */

async function restartScanner() {

    scanBusy = false;


    currentQR = null;


    closePlanModal();


    document.getElementById(
        "userInfo"
    ).style.display =
        "none";


    await stopScanner();


    await startScanner();

}


/* =========================================================
   FINISH SCAN
========================================================= */

function finishScan() {

    setTimeout(
        () => {

            scanBusy = false;

            startScanner();

        },
        1500
    );

}


/* =========================================================
   GALLERY QR SCANNER
========================================================= */

async function scanGallery() {

    if (scanBusy) return;


    const input =
        document.createElement(
            "input"
        );


    input.type =
        "file";


    input.accept =
        "image/*";


    input.style.display =
        "none";


    document.body.appendChild(
        input
    );


    input.onchange =
        async function() {

            const file =
                input.files[0];


            if (!file) {

                input.remove();

                return;

            }


            scanBusy = true;


            log("");


            log(
                "================================="
            );


            log(
                "QR CODE FROM GALLERY"
            );


            log(
                "================================="
            );


            try {

                /*
                 * Temporary invisible scanner.
                 *
                 * Selected image is NOT displayed
                 * inside the visible camera area.
                 */

                const tempId =
                    "temporaryQrScanner";


                const tempScanner =
                    new Html5Qrcode(
                        tempId
                    );


                const decodedText =
                    await tempScanner.scanFile(
                        file,
                        false
                    );


                try {

                    await tempScanner.clear();

                } catch (e) {}


                log(
                    decodedText
                );


                log(
                    "================================="
                );


                processGalleryQR(
                    decodedText
                );


            } catch (error) {

                log(
                    "Gallery QR ERROR: " +
                    error.message
                );


                log(
                    "================================="
                );


                alert(
                    "No valid QR code found in the image."
                );


                finishScan();

            }


            input.remove();

        };


    input.click();

}

/* =========================================================
   PROCESS USER
========================================================= */

async function processUser(
    username,
    password,
    plan
) {

    if (!mikrotik.apiUrl) {

        alert(
            "Configure MikroTik first."
        );


        openSettings();


        finishScan();


        return;

    }


    if (!plan) {

        finishScan();

        return;

    }


    document.getElementById(
        "userInfo"
    ).style.display =
        "block";


    document.getElementById(
        "infoUsername"
    ).textContent =
        username;


    document.getElementById(
        "infoPlan"
    ).textContent =
        `${plan.name} (${plan.duration})`;


    setStatus(
        "Looking up user...",
        "warning"
    );


    log("");


    log(
        "================================="
    );


    log(
        "USER LOOKUP"
    );


    log(
        "================================="
    );


    log(
        `Searching only for username: ${username}`
    );


    try {

        /*
         * =================================================
         * IMPORTANT OPTIMIZATION
         * =================================================
         *
         * Only request the specific username.
         *
         * No:
         *
         * GET /ip/hotspot/user
         *
         * which would download all users.
         */

        const queryName =
            encodeURIComponent(
                username
            );


        const response =
            await mtFetch(
                `/ip/hotspot/user?name=${queryName}`
            );


        if (!response.ok) {

            throw new Error(
                `User lookup HTTP ${response.status}`
            );

        }


        const users =
            await response.json();


        const user =
            Array.isArray(users) &&
            users.length
                ? users[0]
                : null;


        /* =================================================
           USER NOT FOUND
        ================================================= */

        if (!user) {

            log(
                "USER NOT FOUND"
            );


            log(
                "Creating new hotspot user..."
            );


            await createUser(
                username,
                password,
                plan
            );


            return;

        }


        /* =================================================
           USER FOUND
        ================================================= */

        log(
            "USER FOUND"
        );


        log(
            `Username: ${user.name || username}`
        );


        const currentExpiration =
            user.comment || "";


        const currentMs =
            parseExpiration(
                currentExpiration
            );


        const now =
            Date.now();


        let currentTimeLeft =
            0;


        if (
            currentMs !== null &&
            currentMs > now
        ) {

            currentTimeLeft =
                currentMs - now;

        }


        log(
            "Current Expiration: " +
            (
                currentExpiration ||
                "NONE"
            )
        );


        log(
            "Current Time Left: " +
            formatDuration(
                currentTimeLeft
            )
        );


        /* =================================================
           CALCULATE PLAN
        ================================================= */

        const addMs =
            validityToMilliseconds(
                plan.duration
            );


        if (!addMs) {

            throw new Error(
                `Invalid plan duration: ${plan.duration}`
            );

        }


        let newExpirationMs;


        /*
         * Active expiration:
         *
         * current expiration + new plan
         *
         * Expired:
         *
         * now + new plan
         */

        if (
            currentMs !== null &&
            currentMs > now
        ) {

            newExpirationMs =
                currentMs + addMs;

        } else {

            newExpirationMs =
                now + addMs;

        }


        const newTimeLeft =
            Math.max(
                0,
                newExpirationMs - now
            );


        const newExpirationText =
            formatDate(
                newExpirationMs
            );


        /* =================================================
           DISPLAY INFO
        ================================================= */

        document.getElementById(
            "infoCurrentTime"
        ).textContent =
            formatDuration(
                currentTimeLeft
            );


        document.getElementById(
            "infoTotal"
        ).textContent =
            formatDuration(
                newTimeLeft
            );


        document.getElementById(
            "infoExpiration"
        ).textContent =
            newExpirationText;


        /* =================================================
           LOG
        ================================================= */

        log(
            `Plan Selected: ${plan.name}`
        );


        log(
            `Duration: ${plan.duration}`
        );


        log(
            `Price: ₱${Number(
                plan.price || 0
            ).toFixed(2)}`
        );


        log(
            "Time to Add: " +
            formatDuration(
                addMs
            )
        );


        log(
            "New Total Time Left: " +
            formatDuration(
                newTimeLeft
            )
        );


        log(
            "New Expiration: " +
            newExpirationText
        );


        /* =================================================
           UPDATE USER
        ================================================= */

        setStatus(
            "Updating MikroTik...",
            "warning"
        );


        log(
            "Updating MikroTik..."
        );


        const userId =
            user[".id"];


        if (!userId) {

            throw new Error(
                "MikroTik user ID (.id) not found."
            );

        }


        const updateResponse =
            await mtFetch(

                `/ip/hotspot/user/${encodeURIComponent(
                    userId
                )}`,

                {

                    method:
                        "PATCH",

                    body:
                        JSON.stringify({

                            comment:
                                newExpirationText,

                            password:
                                password

                        })

                }

            );


        if (!updateResponse.ok) {

            throw new Error(
                `Update HTTP ${updateResponse.status}`
            );

        }


        log(
            "User updated successfully."
        );


        log(
            "Added: " +
            formatDuration(
                addMs
            )
        );


        log(
            "Total remaining: " +
            formatDuration(
                newTimeLeft
            )
        );


        /* =================================================
           RUN SCRIPT
        ================================================= */

        await runScript3();


        setStatus(
            "User updated successfully.",
            "online"
        );


        finishScan();


    } catch (error) {

        console.error(error);


        log(
            "ERROR: " +
            error.message
        );


        setStatus(
            "Operation failed",
            "error"
        );


        alert(
            "Operation failed.\n\n" +
            error.message
        );


        finishScan();

    }

}


/* =========================================================
   CREATE USER
========================================================= */

async function createUser(
    username,
    password,
    plan
) {

    const addMs =
        validityToMilliseconds(
            plan.duration
        );


    if (!addMs) {

        throw new Error(
            `Invalid plan duration: ${plan.duration}`
        );

    }


    const expirationMs =
        Date.now() +
        addMs;


    const expirationText =
        formatDate(
            expirationMs
        );


    /* =====================================================
       DISPLAY
    ===================================================== */

    document.getElementById(
        "infoCurrentTime"
    ).textContent =
        "0 minutes";


    document.getElementById(
        "infoTotal"
    ).textContent =
        formatDuration(
            addMs
        );


    document.getElementById(
        "infoExpiration"
    ).textContent =
        expirationText;


    /* =====================================================
       LOG
    ===================================================== */

    log(
        `Plan Selected: ${plan.name}`
    );


    log(
        `Duration: ${plan.duration}`
    );


    log(
        `Price: ₱${Number(
            plan.price || 0
        ).toFixed(2)}`
    );


    log(
        "Time to Add: " +
        formatDuration(
            addMs
        )
    );


    log(
        "New Expiration: " +
        expirationText
    );


    log(
        "Creating MikroTik user..."
    );


    setStatus(
        "Creating user...",
        "warning"
    );


    /* =====================================================
       CREATE
    ===================================================== */

    const response =
        await mtFetch(

            "/ip/hotspot/user",

            {

                method:
                    "PUT",

                body:
                    JSON.stringify({

                        name:
                            username,

                        password:
                            password,

                        comment:
                            expirationText,

                        profile:
                            "General"

                    })

            }

        );


    if (!response.ok) {

        let errorText =
            "";


        try {

            errorText =
                await response.text();

        } catch (e) {}


        throw new Error(

            `Create HTTP ${response.status}` +

            (
                errorText
                    ? `: ${errorText}`
                    : ""
            )

        );

    }


    log(
        "New user created successfully."
    );


    log(
        "Expiration: " +
        expirationText
    );


    /* =====================================================
       RUN SCRIPT
    ===================================================== */

    await runScript3();


    setStatus(
        "New user created successfully.",
        "online"
    );


    finishScan();

}

/* =========================================================
   VALIDITY TO MILLISECONDS
========================================================= */

function validityToMilliseconds(
    value
) {

    if (!value) return 0;


    const text =
        String(value)
            .trim()
            .toLowerCase();


    const match =
        text.match(
            /^(\d+(?:\.\d+)?)\s*(m|h|d)$/
        );


    if (!match) {

        return 0;

    }


    const amount =
        Number(
            match[1]
        );


    const unit =
        match[2];


    if (unit === "m") {

        return amount *
            60 *
            1000;

    }


    if (unit === "h") {

        return amount *
            60 *
            60 *
            1000;

    }


    if (unit === "d") {

        return amount *
            24 *
            60 *
            60 *
            1000;

    }


    return 0;

}


/* =========================================================
   PARSE MIKROTIK EXPIRATION
========================================================= */

function parseExpiration(
    value
) {

    if (!value) return null;


    const match =
        String(value)
            .trim()
            .match(

                /^([a-z]{3})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2}):(\d{2})$/i

            );


    if (!match) {

        return null;

    }


    const months = {

        jan: 0,
        feb: 1,
        mar: 2,
        apr: 3,
        may: 4,
        jun: 5,
        jul: 6,
        aug: 7,
        sep: 8,
        oct: 9,
        nov: 10,
        dec: 11

    };


    const month =
        months[
            match[1]
                .toLowerCase()
        ];


    if (
        month === undefined
    ) {

        return null;

    }


    const date =
        new Date(

            Number(
                match[3]
            ),

            month,

            Number(
                match[2]
            ),

            Number(
                match[4]
            ),

            Number(
                match[5]
            ),

            Number(
                match[6]
            )

        );


    const timestamp =
        date.getTime();


    return Number.isNaN(
        timestamp
    )
        ? null
        : timestamp;

}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDate(
    timestamp
) {

    const date =
        new Date(
            timestamp
        );


    const months = [

        "jan",
        "feb",
        "mar",
        "apr",
        "may",
        "jun",
        "jul",
        "aug",
        "sep",
        "oct",
        "nov",
        "dec"

    ];


    const month =
        months[
            date.getMonth()
        ];


    const day =
        String(
            date.getDate()
        ).padStart(
            2,
            "0"
        );


    const year =
        date.getFullYear();


    const hours =
        String(
            date.getHours()
        ).padStart(
            2,
            "0"
        );


    const minutes =
        String(
            date.getMinutes()
        ).padStart(
            2,
            "0"
        );


    const seconds =
        String(
            date.getSeconds()
        ).padStart(
            2,
            "0"
        );


    return (
        `${month}/${day}/${year} ` +
        `${hours}:${minutes}:${seconds}`
    );

}


/* =========================================================
   FORMAT DURATION
========================================================= */

function formatDuration(
    milliseconds
) {

    if (
        !milliseconds ||
        milliseconds <= 0
    ) {

        return "EXPIRED";

    }


    let totalSeconds =
        Math.floor(
            milliseconds / 1000
        );


    const days =
        Math.floor(
            totalSeconds /
            86400
        );


    totalSeconds %=
        86400;


    const hours =
        Math.floor(
            totalSeconds /
            3600
        );


    totalSeconds %=
        3600;


    const minutes =
        Math.floor(
            totalSeconds /
            60
        );


    const parts = [];


    if (days) {

        parts.push(
            `${days} day${days !== 1 ? "s" : ""}`
        );

    }


    if (hours) {

        parts.push(
            `${hours} hour${hours !== 1 ? "s" : ""}`
        );

    }


    if (minutes) {

        parts.push(
            `${minutes} minute${minutes !== 1 ? "s" : ""}`
        );

    }


    if (!parts.length) {

        return "less than 1 minute";

    }


    return parts.join(
        " "
    );

}


/* =========================================================
   FLASHLIGHT
========================================================= */

async function toggleFlash() {

    try {

        if (!scanner) {

            alert(
                "Camera scanner is not running."
            );

            return;

        }


        const videoTrack =
            getVideoTrack();


        if (!videoTrack) {

            alert(
                "Camera track not available."
            );

            return;

        }


        const capabilities =
            videoTrack.getCapabilities();


        if (!capabilities.torch) {

            alert(
                "Flashlight is not supported by this camera."
            );

            return;

        }


        currentFlashTrack =
            videoTrack;


        const settings =
            videoTrack.getSettings();


        const enabled =
            settings.torch === true;


        await videoTrack.applyConstraints({

            advanced: [

                {
                    torch:
                        !enabled
                }

            ]

        });


        const flashButton =
            document.getElementById(
                "flashButton"
            );


        if (!enabled) {

            flashButton.innerHTML = `

                <svg viewBox="0 0 24 24">

                    <path
                        d="M9 2h6l-1 7h4l-7 13 1-9H8L9 2Z"
                    />

                </svg>

                Flash ON

            `;

        } else {

            flashButton.innerHTML = `

                <svg viewBox="0 0 24 24">

                    <path
                        d="M9 2h6l-1 7h4l-7 13 1-9H8L9 2Z"
                    />

                </svg>

                Flash

            `;

        }


    } catch (error) {

        console.error(error);


        log(
            "Flashlight ERROR: " +
            error.message
        );

    }

}


/* =========================================================
   GET VIDEO TRACK
========================================================= */

function getVideoTrack() {

    const video =
        document.querySelector(
            "#qr-reader video"
        );


    if (
        !video ||
        !video.srcObject
    ) {

        return null;

    }


    const tracks =
        video.srcObject
            .getVideoTracks();


    return tracks.length
        ? tracks[0]
        : null;

}
