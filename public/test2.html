<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="description"
        content="MikroTik Hotspot QR WiFi Manager"
    >

    <title>BobotEditha.net</title>


    <!-- =====================================================
         HTML5 QR CODE
    ====================================================== -->

    <script src="https://unpkg.com/html5-qrcode"></script>


    <!-- =====================================================
         LOAD THEME BEFORE PAGE RENDER
    ====================================================== -->

    <script>

        (function () {

            const theme =
                localStorage.getItem(
                    "mikrotik_theme"
                ) || "auto";

            document.documentElement.dataset.theme =
                theme;

        })();

    </script>


    <!-- =====================================================
         CSS
    ====================================================== -->

    <style>

        /* =================================================
           RESET
        ================================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html,
        body {

            width: 100%;
            min-width: 100%;

        }


        html {

            min-height: 100%;

        }


        body {

            width: 100%;
            min-height: 100vh;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            font-size: 14px;

            background: var(--bg);
            color: var(--text);

            overflow-x: hidden;

            transition:
                background .2s ease,
                color .2s ease;

        }


        button,
        input,
        select {

            font-family: inherit;

        }


        /* =================================================
           LIGHT THEME
        ================================================= */

        :root {

            --bg: #f4f5f7;

            --card: #ffffff;

            --border: #e1e4e8;

            --text: #17191c;

            --muted: #70757d;

            --button: #f0f1f3;

            --button-hover: #e5e7ea;

            --input: #ffffff;

            --primary: #1677ff;

            --success: #18a058;

            --danger: #e53935;

            color-scheme: light;

        }


        /* =================================================
           DARK THEME
        ================================================= */

        :root[data-theme="dark"] {

            --bg: #101214;

            --card: #181b1f;

            --border: #2a2f35;

            --text: #f1f3f5;

            --muted: #9299a3;

            --button: #22262b;

            --button-hover: #2c3137;

            --input: #20242a;

            --primary: #4d9cff;

            --success: #32c77a;

            --danger: #ff5c57;

            color-scheme: dark;

        }


        /* =================================================
           AUTO LIGHT
        ================================================= */

        @media (prefers-color-scheme: light) {

            :root[data-theme="auto"] {

                --bg: #f4f5f7;

                --card: #ffffff;

                --border: #e1e4e8;

                --text: #17191c;

                --muted: #70757d;

                --button: #f0f1f3;

                --button-hover: #e5e7ea;

                --input: #ffffff;

                --primary: #1677ff;

                --success: #18a058;

                --danger: #e53935;

                color-scheme: light;

            }

        }


        /* =================================================
           AUTO DARK
        ================================================= */

        @media (prefers-color-scheme: dark) {

            :root[data-theme="auto"] {

                --bg: #101214;

                --card: #181b1f;

                --border: #2a2f35;

                --text: #f1f3f5;

                --muted: #9299a3;

                --button: #22262b;

                --button-hover: #2c3137;

                --input: #20242a;

                --primary: #4d9cff;

                --success: #32c77a;

                --danger: #ff5c57;

                color-scheme: dark;

            }

        }


        /* =================================================
           HEADER
        ================================================= */

        header {

            width: 100%;

            min-height: 62px;

            padding-top:
                env(safe-area-inset-top);

            padding-left: 14px;

            padding-right: 10px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            background: var(--card);

            border-bottom:
                1px solid var(--border);

            position: sticky;

            top: 0;

            z-index: 100;

        }


        .brand {

            display: flex;

            align-items: center;

            font-size: 17px;

            font-weight: 700;

            white-space: nowrap;

        }


        .settings-button {

            width: 46px;

            height: 46px;

            display: flex;

            align-items: center;

            justify-content: center;

            border: 0;

            border-radius: 11px;

            background: transparent;

            color: var(--text);

            cursor: pointer;

            touch-action: manipulation;

        }


        .settings-button:active {

            background: var(--button);

        }


        .settings-button svg {

            width: 22px;

            height: 22px;

        }


        /* =================================================
           MAIN
        ================================================= */

        main {

            width: 100%;

            max-width: 900px;

            margin: 0 auto;

            padding:

                12px
                clamp(10px, 3vw, 20px)
                calc(
                    24px +
                    env(safe-area-inset-bottom)
                );

        }


        /* =================================================
           CARD
        ================================================= */

        .card {

            width: 100%;

            background: var(--card);

            border:
                1px solid var(--border);

            border-radius: 13px;

            padding: 14px;

            margin-bottom: 12px;

        }


        .card-title {

            font-size: 14px;

            font-weight: 700;

            margin-bottom: 10px;

        }


        /* =================================================
           QR READER
        ================================================= */

        #reader {

            width: 100% !important;

            overflow: hidden;

            border:
                1px solid var(--border) !important;

            border-radius: 11px;

            background: #000;

        }


        #reader video {

            width: 100% !important;

            height: auto !important;

            display: block;

            object-fit: cover;

        }


        #reader img {

            max-width: 100%;

        }


        #reader__dashboard {

            padding: 6px !important;

        }


        #reader__dashboard_section_csr {

            display: none !important;

        }


        /* =================================================
           ACTION BUTTONS
        ================================================= */

        .buttons {

            width: 100%;

            display: grid;

            grid-template-columns:
                repeat(
                    3,
                    minmax(0, 1fr)
                );

            gap: 9px;

            margin-top: 10px;

        }


        .btn {

            width: 100%;

            min-height: 48px;

            padding:
                9px 10px;

            border:
                1px solid var(--border);

            border-radius: 10px;

            background: var(--button);

            color: var(--text);

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 7px;

            cursor: pointer;

            font-size: 14px;

            font-weight: 600;

            touch-action: manipulation;

            -webkit-tap-highlight-color:
                transparent;

        }


        .btn:hover {

            background:
                var(--button-hover);

        }


        .btn:active {

            transform:
                scale(.98);

        }


        .btn.primary {

            background:
                var(--primary);

            border-color:
                var(--primary);

            color: #ffffff;

        }


        .btn.danger {

            color:
                var(--danger);

        }


        .btn svg {

            width: 19px;

            height: 19px;

            flex-shrink: 0;

        }


        /* =================================================
           STATUS
        ================================================= */

        .status-row {

            display: flex;

            align-items: center;

            gap: 9px;

            min-height: 30px;

        }


        .status-dot {

            width: 10px;

            height: 10px;

            border-radius: 50%;

            background:
                var(--danger);

            flex-shrink: 0;

        }


        .status-dot.online {

            background:
                var(--success);

        }


        #statusText {

            font-size: 14px;

            color: var(--muted);

        }


        /* =================================================
           USER INFO
        ================================================= */

        .info-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    2,
                    minmax(0, 1fr)
                );

            gap: 9px;

        }


        .info-item {

            min-width: 0;

            padding: 11px;

            border-radius: 10px;

            background:
                var(--button);

        }


        .info-label {

            font-size: 12px;

            color: var(--muted);

            margin-bottom: 4px;

        }


        .info-value {

            font-size: 14px;

            font-weight: 600;

            overflow-wrap:
                anywhere;

        }


        /* =================================================
           LOG
        ================================================= */

        #log {

            font-family:
                ui-monospace,
                SFMono-Regular,
                Menlo,
                Monaco,
                Consolas,
                monospace;

            font-size: 11px;

            line-height: 1.5;

            color: var(--muted);

            white-space: pre-wrap;

            overflow-wrap: anywhere;

            max-height: 180px;

            overflow-y: auto;

        }


        /* =================================================
           MODAL
        ================================================= */

        .modal {

            position: fixed;

            inset: 0;

            display: none;

            align-items: center;

            justify-content: center;

            padding: 12px;

            background:
                rgba(
                    0,
                    0,
                    0,
                    .45
                );

            z-index: 1000;

        }


        .modal.show {

            display: flex;

        }


        .modal-box {

            width: min(
                100%,
                460px
            );

            max-height: 92vh;

            overflow-y: auto;

            padding: 16px;

            background:
                var(--card);

            border:
                1px solid var(--border);

            border-radius: 14px;

        }


        .modal-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 14px;

        }


        .modal-title {

            font-size: 16px;

            font-weight: 700;

        }


        .close {

            width: 38px;

            height: 38px;

            border: 0;

            border-radius: 9px;

            background:
                var(--button);

            color:
                var(--text);

            font-size: 21px;

            cursor: pointer;

        }


        /* =================================================
           FORM
        ================================================= */

        .field {

            margin-bottom: 13px;

        }


        .field label {

            display: block;

            font-size: 13px;

            font-weight: 600;

            margin-bottom: 6px;

        }


        .field input,
        .field select {

            width: 100%;

            min-height: 46px;

            padding:
                10px 11px;

            border:
                1px solid var(--border);

            border-radius: 10px;

            background:
                var(--input);

            color:
                var(--text);

            outline: none;

            font-size: 14px;

        }


        .field input:focus,
        .field select:focus {

            border-color:
                var(--primary);

        }


        /* =================================================
           PASSWORD
        ================================================= */

        .password-box {

            position: relative;

        }


        .password-box input {

            padding-right: 48px;

        }


        .eye-button {

            position: absolute;

            right: 5px;

            top: 5px;

            width: 36px;

            height: 36px;

            border: 0;

            background:
                transparent;

            color:
                var(--muted);

            display: flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;

        }


        .eye-button svg {

            width: 20px;

            height: 20px;

        }


        /* =================================================
           REMEMBER ME
        ================================================= */

        .remember {

            display: flex;

            align-items: center;

            gap: 8px;

            margin:
                8px 0 14px;

            font-size: 13px;

            color:
                var(--muted);

        }


        .remember input {

            width: 17px;

            height: 17px;

        }


        /* =================================================
           MODAL BUTTONS
        ================================================= */

        .modal-buttons {

            display: grid;

            grid-template-columns:
                repeat(
                    2,
                    minmax(0, 1fr)
                );

            gap: 8px;

        }


        .modal-buttons .btn {

            min-height: 46px;

        }


        /* =================================================
           PLANS
        ================================================= */

        .plans {

            display: grid;

            gap: 9px;

        }


        .plan {

            width: 100%;

            padding: 13px;

            border:
                1px solid var(--border);

            border-radius: 11px;

            background:
                var(--button);

            color:
                var(--text);

            text-align: left;

            cursor: pointer;

            touch-action: manipulation;

        }


        .plan:active {

            transform:
                scale(.99);

        }


        .plan-name {

            font-size: 14px;

            font-weight: 700;

        }


        .plan-description {

            font-size: 12px;

            color:
                var(--muted);

            margin-top: 4px;

        }


        .plan-price {

            font-size: 13px;

            color:
                var(--primary);

            margin-top: 6px;

            font-weight: 700;

        }


        /* =================================================
           HIDDEN
        ================================================= */

        .hidden {

            display: none !important;

        }


        #galleryScanner {

            position: fixed;

            left: -99999px;

            top: -99999px;

            width: 1px;

            height: 1px;

            overflow: hidden;

        }


        /* =================================================
           TABLET / DESKTOP
        ================================================= */

        @media (min-width: 600px) {

            main {

                padding-left: 20px;

                padding-right: 20px;

            }


            .card {

                padding: 16px;

            }


            .buttons {

                gap: 10px;

            }


            .btn {

                min-height: 50px;

            }

        }


        /* =================================================
           SMALL PHONE
        ================================================= */

        @media (max-width: 380px) {

            header {

                min-height: 58px;

                padding-left: 11px;

                padding-right: 7px;

            }


            .brand {

                font-size: 16px;

            }


            .settings-button {

                width: 43px;

                height: 43px;

            }


            main {

                padding-left: 8px;

                padding-right: 8px;

            }


            .card {

                padding: 11px;

            }


            .buttons {

                gap: 6px;

            }


            .btn {

                min-height: 46px;

                padding-left: 5px;

                padding-right: 5px;

                font-size: 12px;

            }


            .btn svg {

                width: 17px;

                height: 17px;

            }

        }


        /* =================================================
           VERY SMALL PHONE
        ================================================= */

        @media (max-width: 320px) {

            .brand {

                font-size: 15px;

            }


            .btn {

                font-size: 11px;

            }


            .btn svg {

                width: 16px;

                height: 16px;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header>


        <div class="brand">

            BobotEditha.net

        </div>


        <button
            class="settings-button"
            onclick="openSettings()"
            aria-label="Settings"
        >

            <!-- GEAR SVG -->

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >

                <circle
                    cx="12"
                    cy="12"
                    r="3"
                ></circle>

                <path
                    d="
                    M19.4 15
                    a1.7 1.7 0 0 0 .34 1.88
                    l.06.06
                    -1.7 1.7
                    -.06-.06
                    a1.7 1.7 0 0 0-1.88-.34
                    1.7 1.7 0 0 0-1.03 1.56
                    V20
                    h-2.4
                    v-.2
                    a1.7 1.7 0 0 0-1.03-1.56
                    1.7 1.7 0 0 0-1.88.34
                    l-.06.06
                    -1.7-1.7
                    .06-.06
                    A1.7 1.7 0 0 0 8.4 15
                    1.7 1.7 0 0 0 6.84 14
                    H6.6
                    v-2.4
                    h.24
                    A1.7 1.7 0 0 0 8.4 10
                    a1.7 1.7 0 0 0-.34-1.88
                    L8 8.06
                    l1.7-1.7
                    .06.06
                    a1.7 1.7 0 0 0 1.88.34
                    A1.7 1.7 0 0 0 12.67 5.2
                    V5
                    h2.4
                    v.2
                    a1.7 1.7 0 0 0 1.03 1.56
                    1.7 1.7 0 0 0 1.88-.34
                    l.06-.06
                    1.7 1.7
                    -.06.06
                    A1.7 1.7 0 0 0 19.4 10
                    c.28.66.93 1.09 1.64 1.09
                    H21.2
                    v2.4
                    h-.16
                    A1.7 1.7 0 0 0 19.4 15Z
                    "
                ></path>

            </svg>

        </button>

    </header>



    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main>


        <!-- =================================================
             QR SCANNER CARD
        ================================================== -->

        <section class="card">


            <div class="card-title">

                Scan WiFi QR

            </div>


            <div id="reader"></div>


            <div class="buttons">


                <!-- GALLERY -->

                <button
                    class="btn"
                    onclick="scanGallery()"
                >

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <rect
                            x="3"
                            y="3"
                            width="18"
                            height="18"
                            rx="2"
                        ></rect>

                        <circle
                            cx="8.5"
                            cy="8.5"
                            r="1.5"
                        ></circle>

                        <path
                            d="m21 15-5-5L5 21"
                        ></path>

                    </svg>

                    Gallery

                </button>


                <!-- FLASH -->

                <button
                    class="btn"
                    onclick="toggleFlash()"
                >

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <path
                            d="
                            M13 2
                            3 14
                            h9
                            l-1 8
                            10-12
                            h-9
                            z
                            "
                        ></path>

                    </svg>

                    Flash

                </button>


                <!-- RESTART -->

                <button
                    class="btn"
                    onclick="restartScanner()"
                >

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <path
                            d="M3 12a9 9 0 1 0 3-6.7"
                        ></path>

                        <path
                            d="M3 4v5h5"
                        ></path>

                    </svg>

                    Restart

                </button>


            </div>

        </section>



        <!-- =================================================
             MIKROTIK STATUS
        ================================================== -->

        <section class="card">


            <div class="card-title">

                MikroTik Status

            </div>


            <div class="status-row">


                <span
                    id="statusDot"
                    class="status-dot"
                ></span>


                <span id="statusText">

                    Not connected

                </span>


            </div>

        </section>



        <!-- =================================================
             USER INFORMATION
        ================================================== -->

        <section
            id="userCard"
            class="card hidden"
        >


            <div class="card-title">

                User Information

            </div>


            <div class="info-grid">


                <div class="info-item">

                    <div class="info-label">

                        Username

                    </div>


                    <div
                        id="username"
                        class="info-value"
                    >

                        —

                    </div>

                </div>


                <div class="info-item">

                    <div class="info-label">

                        Current Time Left

                    </div>


                    <div
                        id="currentTime"
                        class="info-value"
                    >

                        —

                    </div>

                </div>


                <div class="info-item">

                    <div class="info-label">

                        Plan to Add

                    </div>


                    <div
                        id="planToAdd"
                        class="info-value"
                    >

                        —

                    </div>

                </div>


                <div class="info-item">

                    <div class="info-label">

                        New Total Time

                    </div>


                    <div
                        id="newTotal"
                        class="info-value"
                    >

                        —

                    </div>

                </div>


                <div class="info-item">

                    <div class="info-label">

                        New Expiration

                    </div>


                    <div
                        id="newExpiration"
                        class="info-value"
                    >

                        —

                    </div>

                </div>


            </div>

        </section>



        <!-- =================================================
             ACTIVITY LOG
        ================================================== -->

        <section class="card">


            <div class="card-title">

                Activity Log

            </div>


            <div id="log">

                Ready.

            </div>


        </section>


    </main>



    <!-- =====================================================
         HIDDEN GALLERY SCANNER
    ====================================================== -->

    <div id="galleryScanner"></div>



    <!-- =====================================================
         SETTINGS MODAL
    ====================================================== -->

    <div
        id="settingsModal"
        class="modal"
        onclick="
            if(event.target===this)
            closeSettings()
        "
    >


        <div class="modal-box">


            <div class="modal-header">


                <div class="modal-title">

                    Settings

                </div>


                <button
                    class="close"
                    onclick="closeSettings()"
                >

                    ×

                </button>


            </div>



            <!-- API URL -->

            <div class="field">


                <label>

                    MikroTik API URL

                </label>


                <input
                    id="apiUrl"
                    type="text"
                    placeholder="https://192.168.88.1/rest"
                    autocomplete="off"
                >


            </div>



            <!-- USERNAME -->

            <div class="field">


                <label>

                    Username

                </label>


                <input
                    id="apiUser"
                    type="text"
                    placeholder="admin"
                    autocomplete="username"
                >


            </div>



            <!-- PASSWORD -->

            <div class="field">


                <label>

                    Password

                </label>


                <div class="password-box">


                    <input
                        id="apiPassword"
                        type="password"
                        placeholder="Password"
                        autocomplete="current-password"
                    >


                    <button
                        class="eye-button"
                        onclick="togglePassword()"
                        aria-label="Show password"
                    >


                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >

                            <path
                                d="
                                M2 12
                                s3.5-7 10-7
                                10 7 10 7
                                -3.5 7-10 7
                                S2 12 2 12Z
                                "
                            ></path>

                            <circle
                                cx="12"
                                cy="12"
                                r="3"
                            ></circle>

                        </svg>


                    </button>


                </div>


            </div>



            <!-- THEME -->

            <div class="field">


                <label>

                    Theme

                </label>


                <select
                    id="themeSelect"
                    onchange="setTheme(this.value)"
                >

                    <option value="auto">

                        Auto

                    </option>


                    <option value="light">

                        Light

                    </option>


                    <option value="dark">

                        Dark

                    </option>


                </select>


            </div>



            <!-- REMEMBER -->

            <label class="remember">


                <input
                    id="rememberMe"
                    type="checkbox"
                >


                <span>

                    Remember settings

                </span>


            </label>



            <!-- MODAL BUTTONS -->

            <div class="modal-buttons">


                <button
                    class="btn primary"
                    onclick="connectMikrotik()"
                >

                    Connect

                </button>


                <button
                    class="btn danger"
                    onclick="clearSavedSettings()"
                >

                    Clear

                </button>


                <button
                    class="btn"
                    onclick="closeSettings()"
                >

                    Cancel

                </button>


            </div>


        </div>


    </div>



    <!-- =====================================================
         PLAN MODAL
    ====================================================== -->

    <div
        id="planModal"
        class="modal"
        onclick="
            if(event.target===this)
            closePlanModal()
        "
    >


        <div class="modal-box">


            <div class="modal-header">


                <div class="modal-title">

                    Select Plan

                </div>


                <button
                    class="close"
                    onclick="closePlanModal()"
                >

                    ×

                </button>


            </div>


            <div
                id="plans"
                class="plans"
            >

                Loading...

            </div>


        </div>


    </div>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>


        /* =================================================
           GLOBAL VARIABLES
        ================================================= */

        let html5QrCode = null;

        let galleryQrCode = null;

        let scannerRunning = false;

        let scanBusy = false;

        let currentUser = null;

        let plans = [];

        let flashOn = false;



        /* =================================================
           LOG
        ================================================= */

        function log(message) {

            const el =
                document.getElementById(
                    "log"
                );


            const time =
                new Date()
                    .toLocaleTimeString();


            el.textContent +=
                `\n[${time}] ${message}`;


            el.scrollTop =
                el.scrollHeight;

        }



        /* =================================================
           STATUS
        ================================================= */

        function setStatus(
            text,
            online = false
        ) {

            document.getElementById(
                "statusText"
            ).textContent = text;


            document.getElementById(
                "statusDot"
            ).classList.toggle(
                "online",
                online
            );

        }



        /* =================================================
           THEME
        ================================================= */

        function setTheme(theme) {

            if (
                theme !== "light" &&
                theme !== "dark" &&
                theme !== "auto"
            ) {

                theme = "auto";

            }


            document.documentElement
                .dataset.theme =
                theme;


            localStorage.setItem(
                "mikrotik_theme",
                theme
            );


            const select =
                document.getElementById(
                    "themeSelect"
                );


            if (select) {

                select.value = theme;

            }


            log(
                "Theme: " + theme
            );

        }



        function loadTheme() {

            const theme =
                localStorage.getItem(
                    "mikrotik_theme"
                ) || "auto";


            setTheme(theme);

        }



        /* =================================================
           SETTINGS
        ================================================= */

        function openSettings() {

            document
                .getElementById(
                    "settingsModal"
                )
                .classList.add(
                    "show"
                );

        }



        function closeSettings() {

            document
                .getElementById(
                    "settingsModal"
                )
                .classList.remove(
                    "show"
                );

        }



        /* =================================================
           PASSWORD
        ================================================= */

        function togglePassword() {

            const input =
                document.getElementById(
                    "apiPassword"
                );


            input.type =
                input.type === "password"
                    ? "text"
                    : "password";

        }



        /* =================================================
           SAVE SETTINGS
        ================================================= */

        function saveSettings() {

            const remember =
                document.getElementById(
                    "rememberMe"
                ).checked;


            if (!remember) {

                localStorage.removeItem(
                    "mikrotik_qr_config"
                );

                return;

            }


            const config = {

                apiUrl:
                    document.getElementById(
                        "apiUrl"
                    ).value.trim(),

                username:
                    document.getElementById(
                        "apiUser"
                    ).value.trim(),

                password:
                    document.getElementById(
                        "apiPassword"
                    ).value,

                remember: true

            };


            localStorage.setItem(
                "mikrotik_qr_config",
                JSON.stringify(config)
            );

        }



        /* =================================================
           LOAD SETTINGS
        ================================================= */

        function loadSavedSettings() {

            try {

                const saved =
                    localStorage.getItem(
                        "mikrotik_qr_config"
                    );


                if (!saved) return;


                const config =
                    JSON.parse(saved);


                document.getElementById(
                    "apiUrl"
                ).value =
                    config.apiUrl || "";


                document.getElementById(
                    "apiUser"
                ).value =
                    config.username || "";


                document.getElementById(
                    "apiPassword"
                ).value =
                    config.password || "";


                document.getElementById(
                    "rememberMe"
                ).checked =
                    !!config.remember;

            }

            catch (error) {

                console.error(
                    error
                );

            }

        }



        /* =================================================
           CLEAR SETTINGS
        ================================================= */

        function clearSavedSettings() {

            localStorage.removeItem(
                "mikrotik_qr_config"
            );


            document.getElementById(
                "apiUrl"
            ).value = "";


            document.getElementById(
                "apiUser"
            ).value = "";


            document.getElementById(
                "apiPassword"
            ).value = "";


            document.getElementById(
                "rememberMe"
            ).checked = false;


            setStatus(
                "Settings cleared"
            );


            log(
                "Saved settings cleared."
            );

        }



        /* =================================================
           CONNECT MIKROTIK
        ================================================= */

        async function connectMikrotik() {

            const url =
                document.getElementById(
                    "apiUrl"
                ).value.trim();


            const user =
                document.getElementById(
                    "apiUser"
                ).value.trim();


            const password =
                document.getElementById(
                    "apiPassword"
                ).value;


            if (!url || !user) {

                setStatus(
                    "Enter API URL and username"
                );

                return;

            }


            saveSettings();


            setStatus(
                "Connecting..."
            );


            try {

                const response =
                    await fetch(
                        url +
                        "/system/resource",
                        {

                            method: "GET",

                            headers: {

                                "Authorization":
                                    "Basic " +
                                    btoa(
                                        user +
                                        ":" +
                                        password
                                    )

                            }

                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }


                setStatus(
                    "Connected",
                    true
                );


                log(
                    "MikroTik connection successful."
                );


                closeSettings();

            }

            catch (error) {

                setStatus(
                    "Connection failed"
                );


                log(
                    "Connection error: " +
                    error.message
                );

            }

        }



        /* =================================================
           MIKROTIK FETCH
        ================================================= */

        async function mtFetch(
            endpoint,
            options = {}
        ) {

            const base =
                document.getElementById(
                    "apiUrl"
                ).value.trim();


            const user =
                document.getElementById(
                    "apiUser"
                ).value.trim();


            const password =
                document.getElementById(
                    "apiPassword"
                ).value;


            if (!base || !user) {

                throw new Error(
                    "MikroTik settings are incomplete."
                );

            }


            const headers =
                options.headers || {};


            headers.Authorization =
                "Basic " +
                btoa(
                    user +
                    ":" +
                    password
                );


            headers["Content-Type"] =
                "application/json";


            return fetch(
                base + endpoint,
                {

                    ...options,

                    headers

                }
            );

        }



        /* =================================================
           QR SUCCESS
        ================================================= */

        async function onScanSuccess(
            decodedText
        ) {

            if (scanBusy) return;


            scanBusy = true;


            log(
                "QR detected: " +
                decodedText
            );


            await stopScanner();


            await processUser(
                decodedText
            );

        }



        function onScanFailure() {

            /* QR scanning continuously
               tries again */

        }



        /* =================================================
           START CAMERA
        ================================================= */

        async function startScanner() {

            if (scannerRunning) return;


            try {

                html5QrCode =
                    new Html5Qrcode(
                        "reader"
                    );


                await html5QrCode.start(

                    {
                        facingMode:
                            "environment"
                    },

                    {

                        fps: 10,

                        qrbox:
                            function (
                                width,
                                height
                            ) {

                                const size =
                                    Math.min(
                                        width,
                                        height
                                    ) * .70;


                                return {

                                    width:
                                        size,

                                    height:
                                        size

                                };

                            }

                    },

                    onScanSuccess,

                    onScanFailure

                );


                scannerRunning = true;

                scanBusy = false;


                log(
                    "Camera scanner started."
                );

            }

            catch (error) {

                scannerRunning = false;


                log(
                    "Camera error: " +
                    error
                );

            }

        }



        /* =================================================
           STOP CAMERA
        ================================================= */

        async function stopScanner() {

            if (
                !html5QrCode ||
                !scannerRunning
            ) {

                return;

            }


            try {

                await html5QrCode.stop();

            }

            catch (error) {

                console.log(
                    error
                );

            }


            scannerRunning = false;

        }



        /* =================================================
           RESTART CAMERA
        ================================================= */

        async function restartScanner() {

            scanBusy = false;

            await stopScanner();

            await startScanner();

        }



        /* =================================================
           GALLERY
        ================================================= */

        async function scanGallery() {

            const input =
                document.createElement(
                    "input"
                );


            input.type = "file";

            input.accept =
                "image/*";


            input.onchange =
                async function () {

                    const file =
                        input.files[0];


                    if (!file) return;


                    await processGalleryQR(
                        file
                    );

                };


            input.click();

        }



        async function processGalleryQR(
            file
        ) {

            try {

                if (galleryQrCode) {

                    try {

                        await galleryQrCode
                            .clear();

                    }

                    catch (_) {}

                }


                galleryQrCode =
                    new Html5Qrcode(
                        "galleryScanner"
                    );


                const result =
                    await galleryQrCode
                        .scanFile(
                            file,
                            true
                        );


                log(
                    "Gallery QR detected."
                );


                await processUser(
                    result
                );

            }

            catch (error) {

                log(
                    "Gallery QR scan failed."
                );

            }

        }



        /* =================================================
           FLASHLIGHT
        ================================================= */

        function getVideoTrack() {

            const video =
                document.querySelector(
                    "#reader video"
                );


            if (!video) return null;


            const stream =
                video.srcObject;


            if (!stream) return null;


            const tracks =
                stream.getVideoTracks();


            return (
                tracks[0] ||
                null
            );

        }



        async function toggleFlash() {

            const track =
                getVideoTrack();


            if (!track) {

                log(
                    "Flashlight not available."
                );

                return;

            }


            const capabilities =
                track.getCapabilities();


            if (!capabilities.torch) {

                log(
                    "Torch is not supported."
                );

                return;

            }


            flashOn =
                !flashOn;


            try {

                await track.applyConstraints({

                    advanced: [

                        {
                            torch:
                                flashOn
                        }

                    ]

                });


                log(

                    flashOn
                        ? "Flash ON"
                        : "Flash OFF"

                );

            }

            catch (error) {

                log(
                    "Flash error: " +
                    error.message
                );

            }

        }



        /* =================================================
           PLAN JSON
        ================================================= */

        async function loadPlans() {

            try {

                const response =
                    await fetch(
                        "plan.json",
                        {
                            cache:
                                "no-store"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "plan.json not found"
                    );

                }


                const data =
                    await response.json();


                plans =
                    data.plans || [];


                renderPlans();

            }

            catch (error) {

                document.getElementById(
                    "plans"
                ).textContent =
                    "Unable to load plans.";

            }

        }



        function renderPlans() {

            const container =
                document.getElementById(
                    "plans"
                );


            container.innerHTML = "";


            plans
                .filter(
                    plan =>
                        plan.enabled !== false
                )
                .forEach(
                    plan => {

                        const button =
                            document.createElement(
                                "button"
                            );


                        button.className =
                            "plan";


                        button.innerHTML = `

                            <div class="plan-name">
                                ${escapeHtml(
                                    plan.name
                                )}
                            </div>

                            <div class="plan-description">
                                ${escapeHtml(
                                    plan.description ||
                                    ""
                                )}
                            </div>

                            <div class="plan-price">
                                ${
                                    plan.price === 0
                                        ? "FREE"
                                        : "₱" +
                                          plan.price
                                }
                            </div>

                        `;


                        button.onclick =
                            () => {

                                selectPlan(
                                    plan
                                );

                            };


                        container.appendChild(
                            button
                        );

                    }
                );

        }



        function escapeHtml(
            value = ""
        ) {

            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }



        /* =================================================
           SELECT PLAN
        ================================================= */

        async function selectPlan(
            plan
        ) {

            closePlanModal();


            if (!currentUser) {

                log(
                    "No user selected."
                );

                return;

            }


            document.getElementById(
                "planToAdd"
            ).textContent =
                plan.name;


            const current =
                validityToMilliseconds(
                    currentUser.limitUptime
                );


            const added =
                validityToMilliseconds(
                    plan.duration
                );


            const total =
                current + added;


            document.getElementById(
                "newTotal"
            ).textContent =
                formatDuration(
                    total
                );


            const expiration =
                new Date(
                    Date.now() +
                    total
                );


            document.getElementById(
                "newExpiration"
            ).textContent =
                formatDate(
                    expiration
                );


            log(
                "Selected plan: " +
                plan.name
            );


            /*
             * Enable this when you want
             * to execute script3.
             */

            // await runScript3();

        }



        /* =================================================
           PLAN MODAL
        ================================================= */

        function openPlanModal() {

            document
                .getElementById(
                    "planModal"
                )
                .classList.add(
                    "show"
                );

        }



        function closePlanModal() {

            document
                .getElementById(
                    "planModal"
                )
                .classList.remove(
                    "show"
                );

        }



        /* =================================================
           FIND HOTSPOT USER
        ================================================= */

        async function processUser(
            username
        ) {

            username =
                String(username)
                    .trim();


            if (!username) {

                log(
                    "Empty QR value."
                );

                scanBusy = false;

                return;

            }


            try {

                /*
                 * IMPORTANT:
                 * Do NOT download the entire
                 * hotspot user list.
                 *
                 * Only request the
                 * scanned username.
                 */

                const queryName =
                    encodeURIComponent(
                        username
                    );


                const response =
                    await mtFetch(
                        `/ip/hotspot/user?name=${queryName}`
                    );


                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }


                const data =
                    await response.json();


                if (
                    !Array.isArray(data) ||
                    data.length === 0
                ) {

                    log(
                        "User not found: " +
                        username
                    );

                    scanBusy = false;

                    return;

                }


                currentUser =
                    data[0];


                document.getElementById(
                    "username"
                ).textContent =
                    currentUser.name ||
                    username;


                document.getElementById(
                    "currentTime"
                ).textContent =
                    formatDuration(
                        validityToMilliseconds(
                            currentUser.limitUptime
                        )
                    );


                document
                    .getElementById(
                        "userCard"
                    )
                    .classList.remove(
                        "hidden"
                    );


                setStatus(
                    "Connected",
                    true
                );


                log(
                    "User loaded: " +
                    username
                );


                openPlanModal();

            }

            catch (error) {

                log(
                    "User lookup error: " +
                    error.message
                );

            }

            finally {

                scanBusy = false;

            }

        }



        /* =================================================
           CREATE USER
        ================================================= */

        async function createUser(
            username,
            password
        ) {

            const response =
                await mtFetch(
                    "/ip/hotspot/user",
                    {

                        method: "PUT",

                        body:
                            JSON.stringify({

                                name:
                                    username,

                                password:
                                    password

                            })

                    }
                );


            if (!response.ok) {

                throw new Error(
                    `HTTP ${response.status}`
                );

            }


            return response.json();

        }



        /* =================================================
           RUN SCRIPT3
        ================================================= */

        async function runScript3() {

            try {

                const response =
                    await mtFetch(
                        "/system/script"
                    );


                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }


                const scripts =
                    await response.json();


                const script =
                    scripts.find(
                        item =>
                            item.name ===
                            "script3"
                    );


                if (!script) {

                    throw new Error(
                        "script3 not found"
                    );

                }


                const id =
                    script[".id"];


                const run =
                    await mtFetch(
                        "/system/script/run",
                        {

                            method: "POST",

                            body:
                                JSON.stringify({

                                    ".id": id

                                })

                        }
                    );


                if (!run.ok) {

                    throw new Error(
                        `HTTP ${run.status}`
                    );

                }


                log(
                    "script3 executed."
                );

            }

            catch (error) {

                log(
                    "script3 error: " +
                    error.message
                );

            }

        }



        /* =================================================
           VALIDITY CONVERTER
        ================================================= */

        function validityToMilliseconds(
            value
        ) {

            if (!value) {

                return 0;

            }


            if (
                typeof value ===
                "number"
            ) {

                return value * 1000;

            }


            const text =
                String(value)
                    .trim()
                    .toLowerCase();


            let total = 0;


            const regex =
                /(\d+)\s*(w|d|h|m|s)/g;


            let match;


            while (
                (match =
                    regex.exec(text))
            ) {

                const number =
                    Number(
                        match[1]
                    );


                switch (
                    match[2]
                ) {

                    case "w":

                        total +=
                            number *
                            7 *
                            24 *
                            60 *
                            60 *
                            1000;

                        break;


                    case "d":

                        total +=
                            number *
                            24 *
                            60 *
                            60 *
                            1000;

                        break;


                    case "h":

                        total +=
                            number *
                            60 *
                            60 *
                            1000;

                        break;


                    case "m":

                        total +=
                            number *
                            60 *
                            1000;

                        break;


                    case "s":

                        total +=
                            number *
                            1000;

                        break;

                }

            }


            return total;

        }



        /* =================================================
           EXPIRATION
        ================================================= */

        function parseExpiration(
            value
        ) {

            if (!value) {

                return null;

            }


            const date =
                new Date(value);


            if (
                !isNaN(
                    date.getTime()
                )
            ) {

                return date;

            }


            return null;

        }



        /* =================================================
           FORMAT DATE
        ================================================= */

        function formatDate(
            date
        ) {

            if (!date) {

                return "—";

            }


            return date.toLocaleString(
                undefined,
                {

                    year:
                        "numeric",

                    month:
                        "short",

                    day:
                        "numeric",

                    hour:
                        "numeric",

                    minute:
                        "2-digit"

                }
            );

        }



        /* =================================================
           FORMAT DURATION
        ================================================= */

        function formatDuration(
            ms
        ) {

            if (
                !ms ||
                ms <= 0
            ) {

                return "0m";

            }


            let seconds =
                Math.floor(
                    ms / 1000
                );


            const days =
                Math.floor(
                    seconds /
                    86400
                );


            seconds %=
                86400;


            const hours =
                Math.floor(
                    seconds /
                    3600
                );


            seconds %=
                3600;


            const minutes =
                Math.floor(
                    seconds /
                    60
                );


            const parts = [];


            if (days) {

                parts.push(
                    `${days}d`
                );

            }


            if (hours) {

                parts.push(
                    `${hours}h`
                );

            }


            if (minutes) {

                parts.push(
                    `${minutes}m`
                );

            }


            if (
                parts.length === 0
            ) {

                parts.push(
                    `${seconds}s`
                );

            }


            return parts.join(
                " "
            );

        }



        /* =================================================
           INITIALIZE
        ================================================= */

        async function init() {

            loadTheme();

            loadSavedSettings();

            await loadPlans();

            await startScanner();

        }


        init();


    </script>
