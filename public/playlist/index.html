<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Video Playlist</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


/* =========================================================
   BODY
========================================================= */

body {

    background: #0f0f0f;

    color: #fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}


/* =========================================================
   HEADER
========================================================= */

header {

    height: 60px;

    background: #181818;

    border-bottom:
        1px solid #303030;

    display: flex;

    align-items: center;

    padding: 0 20px;

    position: sticky;

    top: 0;

    z-index: 100;

}


.logo {

    font-size: 20px;

    font-weight: bold;

    white-space: nowrap;

}


.logo span {

    color: #ff0033;

}


/* =========================================================
   SEARCH
========================================================= */

.search {

    width: 500px;

    max-width: 55%;

    margin: auto;

    display: flex;

}


.search input {

    flex: 1;

    height: 38px;

    background: #121212;

    color: #fff;

    border:
        1px solid #303030;

    outline: none;

    padding: 0 14px;

    border-radius:
        4px 0 0 4px;

}


.search button {

    width: 55px;

    border:
        1px solid #303030;

    border-left: none;

    background: #303030;

    color: white;

    cursor: pointer;

    border-radius:
        0 4px 4px 0;

}


/* =========================================================
   CONTAINER
========================================================= */

.container {

    max-width: 1500px;

    margin: auto;

    padding: 20px;

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        380px;

    gap: 20px;

}


/* =========================================================
   VIDEO
========================================================= */

.video-wrapper {

    width: 100%;

    aspect-ratio: 16 / 9;

    background: #000;

}


video {

    width: 100%;

    height: 100%;

    display: block;

    background: #000;

}


/* =========================================================
   VIDEO INFO
========================================================= */

.video-info {

    padding-top: 15px;

}


.video-title {

    font-size: 21px;

    line-height: 1.4;

    margin-bottom: 8px;

}


.video-description {

    color: #aaa;

    font-size: 14px;

    line-height: 1.5;

}


/* =========================================================
   BUTTONS
========================================================= */

.controls {

    display: flex;

    align-items: center;

    gap: 10px;

    margin-top: 15px;

}


.control-btn {

    background: #272727;

    color: white;

    border: none;

    padding: 10px 15px;

    border-radius: 5px;

    cursor: pointer;

}


.control-btn:hover {

    background: #3d3d3d;

}


.control-btn:disabled {

    opacity: .4;

    cursor: not-allowed;

}


.autoplay {

    margin-left: auto;

    color: #aaa;

    font-size: 13px;

    display: flex;

    align-items: center;

    gap: 6px;

}


/* =========================================================
   PLAYLIST
========================================================= */

.playlist {

    background: #181818;

    border:
        1px solid #303030;

    border-radius: 8px;

    overflow: hidden;

    position: sticky;

    top: 80px;

    height: fit-content;

}


.playlist-header {

    padding: 15px;

    border-bottom:
        1px solid #303030;

}


.playlist-title {

    font-size: 17px;

    font-weight: bold;

}


.playlist-count {

    color: #aaa;

    font-size: 12px;

    margin-top: 4px;

}


/* =========================================================
   PLAYLIST ITEMS
========================================================= */

.playlist-items {

    max-height:
        calc(100vh - 170px);

    overflow-y: auto;

}


.playlist-item {

    display: flex;

    gap: 10px;

    padding: 10px;

    cursor: pointer;

}


.playlist-item:hover {

    background: #272727;

}


.playlist-item.active {

    background: #303030;

}


.playlist-number {

    width: 25px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #aaa;

    font-size: 12px;

}


.playlist-item.active
.playlist-number {

    color: #ff0033;

    font-weight: bold;

}


.thumbnail {

    width: 120px;

    aspect-ratio: 16 / 9;

    object-fit: cover;

    background: #000;

    border-radius: 4px;

    flex-shrink: 0;

}


.item-info {

    min-width: 0;

}


.item-title {

    font-size: 14px;

    line-height: 1.35;

    display: -webkit-box;

    -webkit-line-clamp: 2;

    -webkit-box-orient: vertical;

    overflow: hidden;

}


.item-number {

    color: #888;

    font-size: 12px;

    margin-top: 5px;

}


/* =========================================================
   LOADING
========================================================= */

.loading {

    padding: 30px;

    text-align: center;

    color: #aaa;

}


/* =========================================================
   ERROR
========================================================= */

.error {

    padding: 30px;

    text-align: center;

    color: #ff5555;

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 900px) {

    .container {

        display: block;

        padding: 0;

    }


    .video-info {

        padding:
            14px;

    }


    .playlist {

        position: static;

        border-left: none;

        border-right: none;

        border-radius: 0;

        margin-top: 10px;

    }


    .playlist-items {

        max-height: none;

    }

}


@media (max-width: 500px) {

    header {

        height: 55px;

        padding:
            0 12px;

    }


    .logo {

        font-size: 15px;

    }


    .search {

        flex: 1;

        max-width: none;

        margin-left: 12px;

    }


    .search input {

        height: 34px;

    }


    .search button {

        width: 45px;

    }


    .video-title {

        font-size: 18px;

    }


    .thumbnail {

        width: 105px;

    }


    .item-title {

        font-size: 13px;

    }

}

</style>

</head>


<body>


<!-- =======================================================
     HEADER
======================================================= -->

<header>

    <div class="logo">

        <span>▶</span>
        VideoPlaylist

    </div>


    <div class="search">

        <input
            id="searchInput"
            type="text"
            placeholder="Search playlist..."
        >

        <button id="searchButton">

            🔍

        </button>

    </div>

</header>



<!-- =======================================================
     MAIN
======================================================= -->

<main class="container">


    <!-- ===================================================
         PLAYER
    ==================================================== -->

    <section>


        <div class="video-wrapper">

            <video
                id="videoPlayer"
                controls
                playsinline
                preload="metadata"
            ></video>

        </div>


        <div class="video-info">


            <h1
                id="videoTitle"
                class="video-title"
            >
                Loading...
            </h1>


            <p
                id="videoDescription"
                class="video-description"
            >
            </p>


            <div class="controls">


                <button
                    id="previousButton"
                    class="control-btn"
                >

                    ⏮ Previous

                </button>


                <button
                    id="nextButton"
                    class="control-btn"
                >

                    Next ⏭

                </button>


                <label class="autoplay">

                    <input
                        id="autoplayCheckbox"
                        type="checkbox"
                        checked
                    >

                    Auto Play

                </label>


            </div>


        </div>


    </section>



    <!-- ===================================================
         PLAYLIST
    ==================================================== -->

    <aside class="playlist">


        <div class="playlist-header">

            <div
                id="playlistTitle"
                class="playlist-title"
            >

                Playlist

            </div>


            <div
                id="playlistCount"
                class="playlist-count"
            >

                Loading...

            </div>

        </div>


        <div
            id="playlistItems"
            class="playlist-items"
        >

            <div class="loading">

                Loading playlist...

            </div>

        </div>


    </aside>


</main>



<script>

/* =========================================================
   VARIABLES
========================================================= */

let playlist = [];

let currentIndex = 0;


/* =========================================================
   ELEMENTS
========================================================= */

const videoPlayer =
    document.getElementById(
        "videoPlayer"
    );


const videoTitle =
    document.getElementById(
        "videoTitle"
    );


const videoDescription =
    document.getElementById(
        "videoDescription"
    );


const playlistTitle =
    document.getElementById(
        "playlistTitle"
    );


const playlistCount =
    document.getElementById(
        "playlistCount"
    );


const playlistItems =
    document.getElementById(
        "playlistItems"
    );


const previousButton =
    document.getElementById(
        "previousButton"
    );


const nextButton =
    document.getElementById(
        "nextButton"
    );


const autoplayCheckbox =
    document.getElementById(
        "autoplayCheckbox"
    );


const searchInput =
    document.getElementById(
        "searchInput"
    );


const searchButton =
    document.getElementById(
        "searchButton"
    );


/* =========================================================
   LOAD JSON
========================================================= */

async function loadPlaylist() {

    try {

        const response =
            await fetch(
                "playlist.json",
                {
                    cache: "no-cache"
                }
            );


        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const data =
            await response.json();


        /*
         * playlist.json format:
         *
         * {
         *   "title": "...",
         *   "videos": [...]
         * }
         */


        playlist =
            Array.isArray(data)
                ? data
                : data.videos;


        if (!Array.isArray(playlist)) {

            throw new Error(
                "Invalid playlist.json format"
            );

        }


        playlistTitle.textContent =
            data.title ||
            "Video Playlist";


        playlistCount.textContent =
            `${playlist.length} video${
                playlist.length !== 1
                    ? "s"
                    : ""
            }`;


        renderPlaylist();


        if (playlist.length > 0) {

            loadVideo(
                0,
                false
            );

        }


    } catch (error) {

        console.error(error);


        playlistItems.innerHTML = `

            <div class="error">

                Failed to load playlist.json

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

    }

}


/* =========================================================
   RENDER PLAYLIST
========================================================= */

function renderPlaylist(
    filter = ""
) {

    playlistItems.innerHTML = "";


    const search =
        filter
            .trim()
            .toLowerCase();


    let visible = 0;


    playlist.forEach(
        (item, index) => {


            if (
                search &&
                !item.title
                    .toLowerCase()
                    .includes(search)
            ) {

                return;

            }


            visible++;


            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "playlist-item";


            if (
                index === currentIndex
            ) {

                element.classList.add(
                    "active"
                );

            }


            element.innerHTML = `

                <div class="playlist-number">

                    ${String(
                        index + 1
                    ).padStart(2, "0")}

                </div>


                <img
                    class="thumbnail"
                    src="${escapeAttribute(
                        item.thumbnail
                    )}"
                    loading="lazy"
                    alt=""
                >


                <div class="item-info">

                    <div class="item-title">

                        ${escapeHtml(
                            item.title
                        )}

                    </div>


                    <div class="item-number">

                        Video ${index + 1}

                    </div>

                </div>

            `;


            element.addEventListener(
                "click",
                () => {

                    loadVideo(
                        index,
                        true
                    );

                }
            );


            playlistItems.appendChild(
                element
            );

        }
    );


    if (visible === 0) {

        playlistItems.innerHTML = `

            <div class="loading">

                No videos found.

            </div>

        `;

    }

}


/* =========================================================
   LOAD VIDEO
========================================================= */

function loadVideo(
    index,
    autoplay = false
) {

    if (
        index < 0 ||
        index >= playlist.length
    ) {

        return;

    }


    currentIndex = index;


    const item =
        playlist[index];


    videoPlayer.src =
        item.video || "";


    videoPlayer.poster =
        item.thumbnail || "";


    videoTitle.textContent =
        item.title ||
        "Untitled Video";


    videoDescription.textContent =
        item.description ||
        "";


    videoPlayer.load();


    renderPlaylist(
        searchInput.value
    );


    updateButtons();


    /*
     * Scroll active playlist item
     * into view.
     */

    setTimeout(() => {

        const active =
            playlistItems.querySelector(
                ".active"
            );


        if (active) {

            active.scrollIntoView({
                behavior: "smooth",
                block: "nearest"
            });

        }

    }, 50);


    if (autoplay) {

        videoPlayer
            .play()
            .catch(() => {

                /*
                 * Browser may block autoplay.
                 */

            });

    }

}


/* =========================================================
   NEXT
========================================================= */

function nextVideo() {

    if (
        currentIndex <
        playlist.length - 1
    ) {

        loadVideo(
            currentIndex + 1,
            true
        );

    }

}


/* =========================================================
   PREVIOUS
========================================================= */

function previousVideo() {

    if (
        currentIndex > 0
    ) {

        loadVideo(
            currentIndex - 1,
            true
        );

    }

}


/* =========================================================
   BUTTON STATE
========================================================= */

function updateButtons() {

    previousButton.disabled =
        currentIndex === 0;


    nextButton.disabled =
        currentIndex ===
        playlist.length - 1;

}


/* =========================================================
   AUTO NEXT
========================================================= */

videoPlayer.addEventListener(
    "ended",
    () => {

        if (
            autoplayCheckbox.checked &&
            currentIndex <
            playlist.length - 1
        ) {

            nextVideo();

        }

    }
);


/* =========================================================
   BUTTON EVENTS
========================================================= */

previousButton.addEventListener(
    "click",
    previousVideo
);


nextButton.addEventListener(
    "click",
    nextVideo
);


/* =========================================================
   SEARCH
========================================================= */

searchInput.addEventListener(
    "input",
    () => {

        renderPlaylist(
            searchInput.value
        );

    }
);


searchButton.addEventListener(
    "click",
    () => {

        renderPlaylist(
            searchInput.value
        );

    }
);


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
    value = ""
) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        value;

    return div.innerHTML;

}


function escapeAttribute(
    value = ""
) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

}


/* =========================================================
   START
========================================================= */

loadPlaylist();

</script>

</body>

</html>
