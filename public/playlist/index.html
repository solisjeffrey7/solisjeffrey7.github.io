<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Video Playlist</title>


<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


/* =========================================================
   BODY
========================================================= */

body {

    background: #0f0f0f;

    color: #ffffff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}


/* =========================================================
   HEADER
========================================================= */

header {

    height: 60px;

    background: #181818;

    border-bottom:
        1px solid #303030;

    display: flex;

    align-items: center;

    padding: 0 20px;

    position: sticky;

    top: 0;

    z-index: 100;

}


.logo {

    font-size: 20px;

    font-weight: bold;

    white-space: nowrap;

}


.logo span {

    color: #ff0033;

}


/* =========================================================
   SEARCH
========================================================= */

.search {

    width: 500px;

    max-width: 55%;

    margin-left: auto;

    margin-right: auto;

    display: flex;

}


.search input {

    width: 100%;

    height: 38px;

    background: #121212;

    border:
        1px solid #303030;

    color: #ffffff;

    outline: none;

    padding: 0 14px;

    border-radius:
        4px 0 0 4px;

    font-size: 14px;

}


.search button {

    width: 55px;

    height: 38px;

    background: #303030;

    border:
        1px solid #303030;

    border-left: none;

    color: #ffffff;

    cursor: pointer;

    border-radius:
        0 4px 4px 0;

}


/* =========================================================
   MAIN
========================================================= */

.container {

    max-width: 1500px;

    margin: auto;

    padding: 20px;

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        390px;

    gap: 20px;

}


/* =========================================================
   PLAYER
========================================================= */

.player-section {

    min-width: 0;

}


.video-wrapper {

    width: 100%;

    aspect-ratio: 16 / 9;

    background: #000000;

    position: relative;

    overflow: hidden;

}


video {

    width: 100%;

    height: 100%;

    display: block;

    background: #000000;

}


/* =========================================================
   VIDEO ERROR
========================================================= */

.video-error {

    display: none;

    background: #241313;

    color: #ff7777;

    padding: 12px;

    margin-top: 10px;

    border-radius: 5px;

    font-size: 13px;

}


/* =========================================================
   VIDEO INFORMATION
========================================================= */

.video-info {

    padding-top: 15px;

}


.video-title {

    font-size: 21px;

    line-height: 1.4;

    font-weight: 600;

    margin-bottom: 8px;

}


.video-description {

    color: #aaaaaa;

    font-size: 14px;

    line-height: 1.5;

    white-space: pre-line;

}


/* =========================================================
   CONTROLS
========================================================= */

.controls {

    display: flex;

    align-items: center;

    gap: 10px;

    margin-top: 15px;

}


.control-btn {

    background: #272727;

    color: #ffffff;

    border: none;

    padding: 10px 15px;

    border-radius: 5px;

    cursor: pointer;

    font-size: 14px;

}


.control-btn:hover {

    background: #3d3d3d;

}


.control-btn:disabled {

    opacity: .4;

    cursor: not-allowed;

}


.autoplay {

    margin-left: auto;

    display: flex;

    align-items: center;

    gap: 7px;

    color: #aaaaaa;

    font-size: 13px;

}


.autoplay input {

    width: 17px;

    height: 17px;

    accent-color: #ff0033;

}


/* =========================================================
   PLAYLIST
========================================================= */

.playlist {

    background: #181818;

    border:
        1px solid #303030;

    border-radius: 8px;

    overflow: hidden;

    position: sticky;

    top: 80px;

    height: fit-content;

}


.playlist-header {

    padding: 15px;

    border-bottom:
        1px solid #303030;

}


.playlist-title {

    font-size: 17px;

    font-weight: bold;

}


.playlist-count {

    color: #aaaaaa;

    font-size: 12px;

    margin-top: 4px;

}


/* =========================================================
   PLAYLIST SCROLL
========================================================= */

.playlist-items {

    max-height:
        calc(100vh - 170px);

    overflow-y: auto;

}


/* =========================================================
   PLAYLIST ITEM
========================================================= */

.playlist-item {

    display: flex;

    align-items: center;

    gap: 9px;

    padding: 10px;

    cursor: pointer;

    transition:
        background .15s ease;

}


.playlist-item:hover {

    background: #272727;

}


.playlist-item.active {

    background: #303030;

}


/* =========================================================
   NUMBER
========================================================= */

.playlist-number {

    width: 24px;

    flex-shrink: 0;

    color: #888888;

    font-size: 12px;

    text-align: center;

}


.playlist-item.active
.playlist-number {

    color: #ff0033;

    font-weight: bold;

}


/* =========================================================
   THUMBNAIL
========================================================= */

.thumbnail-wrapper {

    width: 120px;

    aspect-ratio: 16 / 9;

    flex-shrink: 0;

    position: relative;

    overflow: hidden;

    border-radius: 4px;

    background:
        linear-gradient(
            135deg,
            #292929,
            #111111
        );

}


.thumbnail {

    width: 100%;

    height: 100%;

    object-fit: cover;

    display: block;

}


/* =========================================================
   THUMBNAIL PLACEHOLDER
========================================================= */

.thumbnail-placeholder {

    width: 100%;

    height: 100%;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #777777;

    font-size: 20px;

}


/* =========================================================
   DURATION
========================================================= */

.duration {

    position: absolute;

    right: 4px;

    bottom: 4px;

    background: rgba(
        0,
        0,
        0,
        .85
    );

    color: #ffffff;

    padding:
        2px 4px;

    border-radius: 3px;

    font-size: 11px;

    line-height: 1.2;

}


/* =========================================================
   ITEM INFO
========================================================= */

.item-info {

    min-width: 0;

    flex: 1;

}


.item-title {

    font-size: 14px;

    line-height: 1.35;

    display: -webkit-box;

    -webkit-line-clamp: 2;

    -webkit-box-orient: vertical;

    overflow: hidden;

}


.item-meta {

    color: #888888;

    font-size: 11px;

    margin-top: 5px;

}


/* =========================================================
   LOADING
========================================================= */

.loading {

    padding: 30px;

    text-align: center;

    color: #888888;

    font-size: 14px;

}


/* =========================================================
   ERROR
========================================================= */

.error {

    padding: 25px 15px;

    text-align: center;

    color: #ff6666;

    font-size: 13px;

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 900px) {

    .container {

        display: block;

        padding: 0;

    }


    .video-info {

        padding: 14px;

    }


    .playlist {

        position: static;

        border-left: none;

        border-right: none;

        border-radius: 0;

        margin-top: 10px;

    }


    .playlist-items {

        max-height: none;

    }

}


/* =========================================================
   SMALL MOBILE
========================================================= */

@media (max-width: 500px) {

    header {

        height: 55px;

        padding: 0 12px;

    }


    .logo {

        font-size: 15px;

    }


    .search {

        max-width: none;

        flex: 1;

        margin-left: 12px;

        margin-right: 0;

    }


    .search input {

        height: 34px;

        font-size: 13px;

    }


    .search button {

        height: 34px;

        width: 45px;

    }


    .video-title {

        font-size: 18px;

    }


    .controls {

        gap: 6px;

    }


    .control-btn {

        padding: 9px 11px;

        font-size: 12px;

    }


    .autoplay {

        font-size: 11px;

    }


    .thumbnail-wrapper {

        width: 105px;

    }


    .item-title {

        font-size: 13px;

    }

}

</style>

</head>


<body>


<!-- =======================================================
     HEADER
======================================================= -->

<header>


    <div class="logo">

        <span>▶</span>

        VideoPlaylist

    </div>


    <div class="search">

        <input
            id="searchInput"
            type="text"
            placeholder="Search playlist..."
            autocomplete="off"
        >


        <button
            id="searchButton"
            type="button"
        >

            🔍

        </button>

    </div>


</header>



<!-- =======================================================
     MAIN
======================================================= -->

<main class="container">


    <!-- ===================================================
         PLAYER
    ==================================================== -->

    <section class="player-section">


        <div class="video-wrapper">


            <video
                id="videoPlayer"
                controls
                playsinline
                preload="metadata"
            ></video>


        </div>


        <div
            id="videoError"
            class="video-error"
        ></div>


        <div class="video-info">


            <h1
                id="videoTitle"
                class="video-title"
            >

                Loading...

            </h1>


            <p
                id="videoDescription"
                class="video-description"
            ></p>


            <div class="controls">


                <button
                    id="previousButton"
                    class="control-btn"
                    type="button"
                >

                    ⏮ Previous

                </button>


                <button
                    id="nextButton"
                    class="control-btn"
                    type="button"
                >

                    Next ⏭

                </button>


                <label class="autoplay">

                    <input
                        id="autoplayCheckbox"
                        type="checkbox"
                        checked
                    >

                    Auto Play

                </label>


            </div>


        </div>


    </section>



    <!-- ===================================================
         PLAYLIST
    ==================================================== -->

    <aside class="playlist">


        <div class="playlist-header">


            <div
                id="playlistTitle"
                class="playlist-title"
            >

                Playlist

            </div>


            <div
                id="playlistCount"
                class="playlist-count"
            >

                Loading...

            </div>


        </div>


        <div
            id="playlistItems"
            class="playlist-items"
        >

            <div class="loading">

                Loading playlist...

            </div>

        </div>


    </aside>


</main>



<script>

/* =========================================================
   GLOBAL DATA
========================================================= */

let playlist = [];

let currentIndex = 0;


/*
 * Stores generated thumbnails.
 *
 * Key:
 * video URL
 *
 * Value:
 * data URL
 */

const thumbnailCache =
    new Map();


/*
 * Stores video durations.
 */

const durationCache =
    new Map();



/* =========================================================
   ELEMENTS
========================================================= */

const videoPlayer =
    document.getElementById(
        "videoPlayer"
    );


const videoTitle =
    document.getElementById(
        "videoTitle"
    );


const videoDescription =
    document.getElementById(
        "videoDescription"
    );


const videoError =
    document.getElementById(
        "videoError"
    );


const playlistTitle =
    document.getElementById(
        "playlistTitle"
    );


const playlistCount =
    document.getElementById(
        "playlistCount"
    );


const playlistItems =
    document.getElementById(
        "playlistItems"
    );


const previousButton =
    document.getElementById(
        "previousButton"
    );


const nextButton =
    document.getElementById(
        "nextButton"
    );


const autoplayCheckbox =
    document.getElementById(
        "autoplayCheckbox"
    );


const searchInput =
    document.getElementById(
        "searchInput"
    );


const searchButton =
    document.getElementById(
        "searchButton"
    );



/* =========================================================
   LOAD PLAYLIST.JSON
========================================================= */

async function loadPlaylist() {

    try {

        const response =
            await fetch(
                "playlist.json",
                {
                    cache: "no-cache"
                }
            );


        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const data =
            await response.json();


        /*
         * Supports both:
         *
         * {
         *   "title": "...",
         *   "videos": [...]
         * }
         *
         * and:
         *
         * [...]
         */

        playlist =
            Array.isArray(data)
                ? data
                : data.videos;


        if (!Array.isArray(playlist)) {

            throw new Error(
                "Invalid playlist.json format."
            );

        }


        playlistTitle.textContent =
            data.title ||
            "Video Playlist";


        updatePlaylistCount(
            playlist.length
        );


        renderPlaylist();


        if (playlist.length > 0) {

            loadVideo(
                0,
                false
            );

        }


    } catch (error) {

        console.error(
            "Playlist error:",
            error
        );


        playlistItems.innerHTML = `

            <div class="error">

                Unable to load playlist.json

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

    }

}



/* =========================================================
   PLAYLIST COUNT
========================================================= */

function updatePlaylistCount(
    count
) {

    playlistCount.textContent =
        `${count} video${
            count !== 1
                ? "s"
                : ""
        }`;

}



/* =========================================================
   RENDER PLAYLIST
========================================================= */

function renderPlaylist(
    filter = ""
) {

    playlistItems.innerHTML = "";


    const search =
        filter
            .trim()
            .toLowerCase();


    let visibleCount = 0;


    playlist.forEach(
        (item, index) => {


            const title =
                String(
                    item.title ||
                    "Untitled Video"
                );


            /*
             * Search by title.
             */

            if (
                search &&
                !title
                    .toLowerCase()
                    .includes(search)
            ) {

                return;

            }


            visibleCount++;


            /*
             * Main playlist element.
             */

            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "playlist-item";


            if (
                index === currentIndex
            ) {

                element.classList.add(
                    "active"
                );

            }


            /*
             * Create playlist HTML.
             */

            element.innerHTML = `

                <div class="playlist-number">

                    ${String(
                        index + 1
                    ).padStart(2, "0")}

                </div>


                <div
                    class="thumbnail-wrapper"
                    data-thumbnail-index="${index}"
                >

                    <div
                        class="thumbnail-placeholder"
                    >

                        ▶

                    </div>

                </div>


                <div class="item-info">

                    <div class="item-title">

                        ${escapeHtml(
                            title
                        )}

                    </div>


                    <div class="item-meta">

                        Video ${index + 1}

                    </div>

                </div>

            `;


            /*
             * Click video.
             */

            element.addEventListener(
                "click",
                () => {

                    loadVideo(
                        index,
                        true
                    );

                }
            );


            playlistItems.appendChild(
                element
            );


            /*
             * Create thumbnail.
             */

            setupThumbnail(
                item,
                element
            );

        }
    );


    if (visibleCount === 0) {

        playlistItems.innerHTML = `

            <div class="loading">

                No videos found.

            </div>

        `;

    }

}



/* =========================================================
   SETUP THUMBNAIL
========================================================= */

function setupThumbnail(
    item,
    element
) {

    const wrapper =
        element.querySelector(
            ".thumbnail-wrapper"
        );


    if (!wrapper) {
        return;
    }


    /*
     * IMPORTANT:
     *
     * If JSON has thumbnail,
     * ALWAYS use that thumbnail.
     */

    if (
        typeof item.thumbnail ===
        "string" &&
        item.thumbnail.trim() !== ""
    ) {

        setImageThumbnail(
            wrapper,
            item.thumbnail
        );


        /*
         * Still load duration
         * separately.
         */

        loadDuration(
            item.video,
            wrapper
        );


        return;

    }


    /*
     * No thumbnail in JSON.
     *
     * Generate first frame.
     */

    generateFirstFrame(
        item.video,
        wrapper
    );

}



/* =========================================================
   CUSTOM THUMBNAIL
========================================================= */

function setImageThumbnail(
    wrapper,
    src
) {

    wrapper.innerHTML = "";


    const image =
        document.createElement(
            "img"
        );


    image.className =
        "thumbnail";


    image.src =
        src;


    image.alt = "";


    /*
     * If custom thumbnail fails,
     * use placeholder.
     */

    image.addEventListener(
        "error",
        () => {

            wrapper.innerHTML = `

                <div
                    class="thumbnail-placeholder"
                >

                    ▶

                </div>

            `;

        }
    );


    wrapper.appendChild(
        image
    );

}



/* =========================================================
   GENERATE FIRST FRAME
========================================================= */

function generateFirstFrame(
    videoUrl,
    wrapper
) {

    if (!videoUrl) {
        return;
    }


    /*
     * Check cache first.
     */

    if (
        thumbnailCache.has(
            videoUrl
        )
    ) {

        setGeneratedThumbnail(
            wrapper,
            thumbnailCache.get(
                videoUrl
            )
        );


        loadDuration(
            videoUrl,
            wrapper
        );


        return;

    }


    /*
     * Temporary video.
     */

    const tempVideo =
        document.createElement(
            "video"
        );


    tempVideo.preload =
        "metadata";


    tempVideo.muted =
        true;


    tempVideo.playsInline =
        true;


    /*
     * Required for external
     * video servers.
     *
     * This only works if the
     * server allows CORS.
     */

    tempVideo.crossOrigin =
        "anonymous";


    tempVideo.src =
        videoUrl;


    /*
     * Metadata loaded.
     */

    tempVideo.addEventListener(
        "loadedmetadata",
        () => {

            loadDuration(
                videoUrl,
                wrapper,
                tempVideo
            );


            try {

                /*
                 * Capture around
                 * 0.1 second.
                 */

                if (
                    Number.isFinite(
                        tempVideo.duration
                    ) &&
                    tempVideo.duration > 0
                ) {

                    tempVideo.currentTime =
                        Math.min(
                            0.1,
                            tempVideo.duration
                        );

                } else {

                    tempVideo.currentTime =
                        0;

                }

            } catch (error) {

                console.warn(
                    "Seek failed:",
                    error
                );

            }

        }
    );


    /*
     * Frame is ready.
     */

    tempVideo.addEventListener(
        "seeked",
        () => {

            try {

                if (
                    !tempVideo.videoWidth ||
                    !tempVideo.videoHeight
                ) {

                    return;

                }


                const canvas =
                    document.createElement(
                        "canvas"
                    );


                canvas.width =
                    tempVideo.videoWidth;


                canvas.height =
                    tempVideo.videoHeight;


                const context =
                    canvas.getContext(
                        "2d"
                    );


                context.drawImage(
                    tempVideo,
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );


                const image =
                    canvas.toDataURL(
                        "image/jpeg",
                        0.75
                    );


                /*
                 * Save cache.
                 */

                thumbnailCache.set(
                    videoUrl,
                    image
                );


                /*
                 * Display.
                 */

                setGeneratedThumbnail(
                    wrapper,
                    image
                );


            } catch (error) {

                /*
                 * Usually happens when
                 * external server blocks CORS.
                 */

                console.warn(
                    "Cannot capture video frame:",
                    error
                );

            }

            /*
             * Release resource.
             */

            tempVideo.pause();

            tempVideo.removeAttribute(
                "src"
            );

            tempVideo.load();

        }
    );


    /*
     * Video failed.
     */

    tempVideo.addEventListener(
        "error",
        () => {

            console.warn(
                "Unable to load video thumbnail:",
                videoUrl
            );

        }
    );

}



/* =========================================================
   GENERATED THUMBNAIL
========================================================= */

function setGeneratedThumbnail(
    wrapper,
    image
) {

    wrapper.innerHTML = "";


    const img =
        document.createElement(
            "img"
        );


    img.className =
        "thumbnail";


    img.src =
        image;


    img.alt = "";


    wrapper.appendChild(
        img
    );

}



/* =========================================================
   LOAD VIDEO DURATION
========================================================= */

function loadDuration(
    videoUrl,
    wrapper,
    existingVideo = null
) {

    if (!videoUrl) {
        return;
    }


    /*
     * Already cached.
     */

    if (
        durationCache.has(
            videoUrl
        )
    ) {

        setDuration(
            wrapper,
            durationCache.get(
                videoUrl
            )
        );

        return;

    }


    /*
     * Use existing temporary video
     * when available.
     */

    const durationVideo =
        existingVideo ||
        document.createElement(
            "video"
        );


    if (!existingVideo) {

        durationVideo.preload =
            "metadata";

        durationVideo.muted =
            true;

        durationVideo.playsInline =
            true;

        durationVideo.crossOrigin =
            "anonymous";

        durationVideo.src =
            videoUrl;

    }


    const handleMetadata =
        () => {

            const duration =
                durationVideo.duration;


            if (
                Number.isFinite(
                    duration
                ) &&
                duration > 0
            ) {

                durationCache.set(
                    videoUrl,
                    duration
                );


                setDuration(
                    wrapper,
                    duration
                );

            }

        };


    durationVideo.addEventListener(
        "loadedmetadata",
        handleMetadata,
        {
            once: true
        }
    );


    /*
     * If metadata is already available.
     */

    if (
        Number.isFinite(
            durationVideo.duration
        ) &&
        durationVideo.duration > 0
    ) {

        handleMetadata();

    }

}



/* =========================================================
   SET DURATION
========================================================= */

function setDuration(
    wrapper,
    seconds
) {

    /*
     * Remove old duration.
     */

    const old =
        wrapper.querySelector(
            ".duration"
        );


    if (old) {

        old.remove();

    }


    const duration =
        document.createElement(
            "div"
        );


    duration.className =
        "duration";


    duration.textContent =
        formatDuration(
            seconds
        );


    wrapper.appendChild(
        duration
    );

}



/* =========================================================
   FORMAT DURATION
========================================================= */

function formatDuration(
    seconds
) {

    seconds =
        Math.floor(
            Number(seconds) || 0
        );


    const hours =
        Math.floor(
            seconds / 3600
        );


    const minutes =
        Math.floor(
            (seconds % 3600) / 60
        );


    const secs =
        seconds % 60;


    if (hours > 0) {

        return (
            String(hours) +
            ":" +
            String(minutes)
                .padStart(2, "0") +
            ":" +
            String(secs)
                .padStart(2, "0")
        );

    }


    return (
        String(minutes) +
        ":" +
        String(secs)
            .padStart(2, "0")
    );

}



/* =========================================================
   LOAD MAIN VIDEO
========================================================= */

function loadVideo(
    index,
    autoplay = false
) {

    if (
        index < 0 ||
        index >= playlist.length
    ) {

        return;

    }


    currentIndex =
        index;


    const item =
        playlist[index];


    /*
     * Hide error.
     */

    videoError.style.display =
        "none";


    /*
     * Set video.
     */

    videoPlayer.src =
        item.video || "";


    /*
     * Set information.
     */

    videoTitle.textContent =
        item.title ||
        "Untitled Video";


    videoDescription.textContent =
        item.description ||
        "";


    /*
     * Load.
     */

    videoPlayer.load();


    /*
     * Re-render active state.
     */

    renderPlaylist(
        searchInput.value
    );


    updateButtons();


    /*
     * Scroll active item.
     */

    setTimeout(
        () => {

            const active =
                playlistItems.querySelector(
                    ".active"
                );


            if (active) {

                active.scrollIntoView({
                    behavior: "smooth",
                    block: "nearest"
                });

            }

        },
        50
    );


    /*
     * Autoplay.
     */

    if (autoplay) {

        videoPlayer
            .play()
            .catch(
                () => {

                    /*
                     * Browser may block
                     * autoplay.
                     */

                }
            );

    }

}



/* =========================================================
   NEXT
========================================================= */

function nextVideo() {

    if (
        currentIndex <
        playlist.length - 1
    ) {

        loadVideo(
            currentIndex + 1,
            true
        );

    }

}



/* =========================================================
   PREVIOUS
========================================================= */

function previousVideo() {

    if (
        currentIndex > 0
    ) {

        loadVideo(
            currentIndex - 1,
            true
        );

    }

}



/* =========================================================
   BUTTON STATE
========================================================= */

function updateButtons() {

    previousButton.disabled =
        currentIndex === 0;


    nextButton.disabled =
        currentIndex ===
        playlist.length - 1;

}



/* =========================================================
   VIDEO ENDED
========================================================= */

videoPlayer.addEventListener(
    "ended",
    () => {

        if (
            autoplayCheckbox.checked &&
            currentIndex <
            playlist.length - 1
        ) {

            nextVideo();

        }

    }
);



/* =========================================================
   VIDEO ERROR
========================================================= */

videoPlayer.addEventListener(
    "error",
    () => {

        videoError.style.display =
            "block";


        videoError.textContent =
            "Unable to play this video. The video URL may be unavailable or blocked by the server.";

    }
);



/* =========================================================
   VIDEO LOADED
========================================================= */

videoPlayer.addEventListener(
    "loadeddata",
    () => {

        videoError.style.display =
            "none";

    }
);



/* =========================================================
   BUTTON EVENTS
========================================================= */

previousButton.addEventListener(
    "click",
    previousVideo
);


nextButton.addEventListener(
    "click",
    nextVideo
);



/* =========================================================
   SEARCH
========================================================= */

searchInput.addEventListener(
    "input",
    () => {

        renderPlaylist(
            searchInput.value
        );

    }
);


searchButton.addEventListener(
    "click",
    () => {

        renderPlaylist(
            searchInput.value
        );

    }
);



/* =========================================================
   ENTER KEY SEARCH
========================================================= */

searchInput.addEventListener(
    "keydown",
    (event) => {

        if (
            event.key === "Enter"
        ) {

            renderPlaylist(
                searchInput.value
            );

        }

    }
);



/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(
    value = ""
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        value;


    return div.innerHTML;

}



/* =========================================================
   START
========================================================= */

loadPlaylist();

</script>
