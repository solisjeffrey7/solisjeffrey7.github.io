<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Karaoke Jukebox</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


/* =========================================================
   BODY
========================================================= */

body {

    background: #0b0b0b;

    color: #ffffff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}


/* =========================================================
   HEADER
========================================================= */

header {

    height: 60px;

    background: #151515;

    border-bottom:
        1px solid #303030;

    display: flex;

    align-items: center;

    padding: 0 18px;

    position: sticky;

    top: 0;

    z-index: 100;

}


.logo {

    font-size: 20px;

    font-weight: bold;

    white-space: nowrap;

}


.logo span {

    color: #ff1744;

}


/* =========================================================
   SEARCH
========================================================= */

.search {

    width: 500px;

    max-width: 55%;

    margin: auto;

    display: flex;

}


.search input {

    flex: 1;

    height: 38px;

    background: #101010;

    border:
        1px solid #333333;

    color: white;

    outline: none;

    padding: 0 14px;

    border-radius:
        4px 0 0 4px;

}


.search button {

    width: 55px;

    height: 38px;

    background: #303030;

    color: white;

    border:
        1px solid #333333;

    border-left: none;

    cursor: pointer;

    border-radius:
        0 4px 4px 0;

}


/* =========================================================
   MAIN
========================================================= */

.container {

    max-width: 1500px;

    margin: auto;

    padding: 20px;

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        420px;

    gap: 20px;

}


/* =========================================================
   PLAYER
========================================================= */

.player {

    min-width: 0;

}


.video-box {

    width: 100%;

    aspect-ratio: 16 / 9;

    background: #000000;

}


video {

    width: 100%;

    height: 100%;

    display: block;

    background: #000000;

}


/* =========================================================
   INFORMATION
========================================================= */

.info {

    padding-top: 15px;

}


.title {

    font-size: 22px;

    font-weight: bold;

    line-height: 1.4;

}


.artist {

    color: #aaaaaa;

    font-size: 15px;

    margin-top: 5px;

}


.description {

    color: #777777;

    font-size: 13px;

    margin-top: 8px;

}


/* =========================================================
   PLAYER BUTTONS
========================================================= */

.controls {

    display: flex;

    align-items: center;

    gap: 8px;

    margin-top: 15px;

}


.btn {

    background: #272727;

    color: white;

    border: none;

    padding: 10px 14px;

    border-radius: 5px;

    cursor: pointer;

}


.btn:hover {

    background: #3a3a3a;

}


.btn:disabled {

    opacity: .4;

    cursor: not-allowed;

}


.autoplay {

    margin-left: auto;

    color: #999999;

    font-size: 13px;

}


/* =========================================================
   RIGHT PANEL
========================================================= */

.right-panel {

    min-width: 0;

}


/* =========================================================
   TABS
========================================================= */

.tabs {

    display: flex;

    background: #151515;

    border:
        1px solid #303030;

    border-radius:
        8px 8px 0 0;

}


.tab {

    flex: 1;

    padding: 13px;

    text-align: center;

    color: #999999;

    cursor: pointer;

    font-size: 14px;

}


.tab.active {

    color: white;

    border-bottom:
        2px solid #ff1744;

}


/* =========================================================
   PANEL
========================================================= */

.panel {

    background: #151515;

    border:
        1px solid #303030;

    border-top: none;

    border-radius:
        0 0 8px 8px;

}


/* =========================================================
   PLAYLIST / QUEUE HEADER
========================================================= */

.panel-header {

    padding: 12px;

    border-bottom:
        1px solid #303030;

    display: flex;

    align-items: center;

}


.panel-title {

    font-size: 15px;

    font-weight: bold;

}


.panel-count {

    color: #888888;

    font-size: 12px;

    margin-left: 6px;

}


.clear-button {

    margin-left: auto;

    background: transparent;

    border: none;

    color: #ff6666;

    cursor: pointer;

    font-size: 12px;

}


/* =========================================================
   LIST
========================================================= */

.list {

    max-height:
        calc(100vh - 170px);

    overflow-y: auto;

}


/* =========================================================
   SONG
========================================================= */

.song {

    display: flex;

    gap: 8px;

    padding: 9px;

    cursor: pointer;

    border-bottom:
        1px solid #202020;

}


.song:hover {

    background: #252525;

}


.song.active {

    background: #303030;

}


/* =========================================================
   NUMBER
========================================================= */

.number {

    width: 25px;

    flex-shrink: 0;

    display: flex;

    justify-content: center;

    align-items: center;

    color: #777777;

    font-size: 11px;

}


.song.active .number {

    color: #ff1744;

}


/* =========================================================
   THUMBNAIL
========================================================= */

.thumb {

    width: 105px;

    aspect-ratio: 16 / 9;

    flex-shrink: 0;

    background: #222222;

    border-radius: 4px;

    overflow: hidden;

    position: relative;

}


.thumb img {

    width: 100%;

    height: 100%;

    object-fit: cover;

}


.placeholder {

    width: 100%;

    height: 100%;

    display: flex;

    justify-content: center;

    align-items: center;

    color: #666666;

}


/* =========================================================
   DURATION
========================================================= */

.duration {

    position: absolute;

    right: 4px;

    bottom: 4px;

    background:
        rgba(0,0,0,.85);

    color: white;

    font-size: 10px;

    padding: 2px 4px;

    border-radius: 3px;

}


/* =========================================================
   SONG INFO
========================================================= */

.song-info {

    flex: 1;

    min-width: 0;

}


.song-title {

    font-size: 13px;

    line-height: 1.35;

    display: -webkit-box;

    -webkit-line-clamp: 2;

    -webkit-box-orient: vertical;

    overflow: hidden;

}


.song-artist {

    color: #888888;

    font-size: 11px;

    margin-top: 5px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}


/* =========================================================
   QUEUE ACTION
========================================================= */

.queue-actions {

    display: flex;

    align-items: center;

}


.queue-add {

    width: 32px;

    height: 32px;

    border: none;

    border-radius: 50%;

    background: #272727;

    color: white;

    cursor: pointer;

    font-size: 18px;

}


.queue-add:hover {

    background: #ff1744;

}


.queue-remove {

    width: 28px;

    height: 28px;

    border: none;

    background: transparent;

    color: #888888;

    cursor: pointer;

    font-size: 17px;

}


.queue-remove:hover {

    color: #ff4444;

}


/* =========================================================
   EMPTY
========================================================= */

.empty {

    padding: 40px 15px;

    text-align: center;

    color: #666666;

    font-size: 13px;

}


.loading {

    padding: 40px;

    text-align: center;

    color: #888888;

}


.error {

    padding: 30px;

    text-align: center;

    color: #ff5555;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:900px) {

    .container {

        display: block;

        padding: 0;

    }


    .info {

        padding: 14px;

    }


    .right-panel {

        margin-top: 10px;

    }


    .panel {

        border-left: none;

        border-right: none;

        border-radius: 0;

    }


    .tabs {

        border-left: none;

        border-right: none;

        border-radius: 0;

    }


    .list {

        max-height: none;

    }

}


@media(max-width:500px) {

    header {

        height: 55px;

        padding: 0 10px;

    }


    .logo {

        font-size: 15px;

    }


    .search {

        flex: 1;

        max-width: none;

        margin-left: 12px;

    }


    .search input {

        height: 34px;

    }


    .search button {

        width: 45px;

        height: 34px;

    }


    .title {

        font-size: 18px;

    }


    .controls {

        gap: 5px;

    }


    .btn {

        padding: 9px 10px;

        font-size: 12px;

    }


    .thumb {

        width: 100px;

    }

}

</style>

</head>



<body>


<!-- =======================================================
     HEADER
======================================================= -->

<header>


    <div class="logo">

        <span>🎤</span>

        Karaoke Jukebox

    </div>


    <div class="search">

        <input
            id="search"
            type="text"
            placeholder="Search song or artist..."
            autocomplete="off"
        >


        <button id="searchButton">

            🔍

        </button>

    </div>


</header>



<!-- =======================================================
     MAIN
======================================================= -->

<main class="container">


<!-- =======================================================
     PLAYER
======================================================= -->

<section class="player">


    <div class="video-box">

        <video
            id="video"
            controls
            playsinline
            preload="metadata"
        ></video>

    </div>


    <div class="info">


        <div
            id="title"
            class="title"
        >

            Loading...

        </div>


        <div
            id="artist"
            class="artist"
        ></div>


        <div
            id="description"
            class="description"
        ></div>


        <div class="controls">


            <button
                id="previous"
                class="btn"
            >

                ⏮ Previous

            </button>


            <button
                id="next"
                class="btn"
            >

                Next ⏭

            </button>


            <label class="autoplay">

                <input
                    id="autoplay"
                    type="checkbox"
                    checked
                >

                Auto Next

            </label>


        </div>


    </div>


</section>



<!-- =======================================================
     RIGHT PANEL
======================================================= -->

<section class="right-panel">


    <!-- TABS -->

    <div class="tabs">


        <div
            id="playlistTab"
            class="tab active"
        >

            🎵 Songs

        </div>


        <div
            id="queueTab"
            class="tab"
        >

            📋 Queue
            <span id="queueTabCount">
                0
            </span>

        </div>


    </div>



    <!-- PANEL -->

    <div class="panel">


        <!-- HEADER -->

        <div class="panel-header">


            <div
                id="panelTitle"
                class="panel-title"
            >

                Songs

            </div>


            <div
                id="panelCount"
                class="panel-count"
            >

                0

            </div>


            <button
                id="clearQueue"
                class="clear-button"
                style="display:none"
            >

                Clear

            </button>


        </div>



        <!-- LIST -->

        <div
            id="list"
            class="list"
        >

            <div class="loading">

                Loading...

            </div>

        </div>


    </div>


</section>


</main>



<script>

/* =========================================================
   GLOBAL DATA
========================================================= */

let songs = [];

let queue = [];

let current = 0;

let currentView = "playlist";


/*
 * Thumbnail cache.
 */

const thumbnailCache =
    new Map();


/*
 * Duration cache.
 */

const durationCache =
    new Map();



/* =========================================================
   ELEMENTS
========================================================= */

const video =
    document.getElementById(
        "video"
    );


const title =
    document.getElementById(
        "title"
    );


const artist =
    document.getElementById(
        "artist"
    );


const description =
    document.getElementById(
        "description"
    );


const list =
    document.getElementById(
        "list"
    );


const search =
    document.getElementById(
        "search"
    );


const searchButton =
    document.getElementById(
        "searchButton"
    );


const previous =
    document.getElementById(
        "previous"
    );


const next =
    document.getElementById(
        "next"
    );


const autoplay =
    document.getElementById(
        "autoplay"
    );


const playlistTab =
    document.getElementById(
        "playlistTab"
    );


const queueTab =
    document.getElementById(
        "queueTab"
    );


const queueTabCount =
    document.getElementById(
        "queueTabCount"
    );


const panelTitle =
    document.getElementById(
        "panelTitle"
    );


const panelCount =
    document.getElementById(
        "panelCount"
    );


const clearQueueButton =
    document.getElementById(
        "clearQueue"
    );



/* =========================================================
   LOAD PLAYLIST
========================================================= */

async function loadPlaylist() {

    try {

        const response =
            await fetch(
                "playlist.json",
                {
                    cache: "no-cache"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        songs =
            Array.isArray(data)
                ? data
                : data.videos;


        if (!Array.isArray(songs)) {

            throw new Error(
                "Invalid playlist.json"
            );

        }


        /*
         * Set playlist title.
         */

        document.title =
            data.title ||
            "Karaoke Jukebox";


        renderPlaylist();


        if (songs.length > 0) {

            loadSong(
                0,
                false
            );

        }


    }

    catch(error) {

        console.error(error);


        list.innerHTML = `

            <div class="error">

                Unable to load playlist.json

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

    }

}



/* =========================================================
   RENDER PLAYLIST
========================================================= */

function renderPlaylist(
    filter = ""
) {

    list.innerHTML = "";


    const query =
        filter
            .trim()
            .toLowerCase();


    let visible = 0;


    songs.forEach(
        (song,index) => {


            const songTitle =
                song.title ||
                "Unknown Song";


            const songArtist =
                song.artist ||
                "";


            const searchable =
                (
                    songTitle +
                    " " +
                    songArtist
                )
                .toLowerCase();


            if (
                query &&
                !searchable.includes(
                    query
                )
            ) {

                return;

            }


            visible++;


            const element =
                createSongElement(
                    song,
                    index,
                    false
                );


            list.appendChild(
                element
            );


            setupThumbnail(
                song,
                element
            );

        }
    );


    panelTitle.textContent =
        "Songs";


    panelCount.textContent =
        songs.length;


    clearQueueButton.style.display =
        "none";


    if (!visible) {

        list.innerHTML = `

            <div class="empty">

                No songs found.

            </div>

        `;

    }

}



/* =========================================================
   CREATE PLAYLIST SONG
========================================================= */

function createSongElement(
    song,
    index,
    isQueue
) {

    const element =
        document.createElement(
            "div"
        );


    element.className =
        "song";


    /*
     * Active current song.
     */

    if (
        !isQueue &&
        index === current
    ) {

        element.classList.add(
            "active"
        );

    }


    element.innerHTML = `

        <div class="number">

            ${String(
                index + 1
            ).padStart(2,"0")}

        </div>


        <div class="thumb">

            <div class="placeholder">

                🎤

            </div>

        </div>


        <div class="song-info">

            <div class="song-title">

                ${escapeHtml(
                    song.title ||
                    "Unknown Song"
                )}

            </div>


            <div class="song-artist">

                ${escapeHtml(
                    song.artist ||
                    ""
                )}

            </div>

        </div>


        <div class="queue-actions">

            ${
                isQueue

                ?

                `

                <button
                    class="queue-remove"
                    title="Remove from queue"
                >

                    ✕

                </button>

                `

                :

                `

                <button
                    class="queue-add"
                    title="Add to queue"
                >

                    +

                </button>

                `

            }

        </div>

    `;


    /*
     * PLAYLIST
     */

    if (!isQueue) {

        element.addEventListener(
            "click",
            event => {

                /*
                 * Don't play when
                 * clicking + button.
                 */

                if (
                    event.target.closest(
                        ".queue-add"
                    )
                ) {

                    return;

                }


                loadSong(
                    index,
                    true
                );

            }
        );


        const addButton =
            element.querySelector(
                ".queue-add"
            );


        addButton.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                addToQueue(
                    index
                );

            }
        );

    }


    /*
     * QUEUE
     */

    else {

        const removeButton =
            element.querySelector(
                ".queue-remove"
            );


        removeButton.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                removeFromQueue(
                    index
                );

            }
        );


        element.addEventListener(
            "click",
            event => {

                if (
                    event.target.closest(
                        ".queue-remove"
                    )
                ) {

                    return;

                }


                playQueueItem(
                    index
                );

            }
        );

    }


    return element;

}



/* =========================================================
   SETUP THUMBNAIL
========================================================= */

function setupThumbnail(
    song,
    element
) {

    const wrapper =
        element.querySelector(
            ".thumb"
        );


    /*
     * CUSTOM THUMBNAIL
     *
     * JSON thumbnail has
     * highest priority.
     */

    if (
        song.thumbnail &&
        song.thumbnail.trim()
    ) {

        setThumbnail(
            wrapper,
            song.thumbnail
        );


        loadDuration(
            song.video,
            wrapper
        );


        return;

    }


    /*
     * NO THUMBNAIL
     *
     * Automatically create
     * first frame.
     */

    generateThumbnail(
        song.video,
        wrapper
    );

}



/* =========================================================
   CUSTOM THUMBNAIL
========================================================= */

function setThumbnail(
    wrapper,
    source
) {

    wrapper.innerHTML = "";


    const img =
        document.createElement(
            "img"
        );


    img.src =
        source;


    img.alt = "";


    img.addEventListener(
        "error",
        () => {

            wrapper.innerHTML = `

                <div class="placeholder">

                    🎤

                </div>

            `;

        }
    );


    wrapper.appendChild(
        img
    );

}



/* =========================================================
   AUTOMATIC FIRST FRAME
========================================================= */

function generateThumbnail(
    url,
    wrapper
) {

    if (!url) {
        return;
    }


    /*
     * Cached.
     */

    if (
        thumbnailCache.has(url)
    ) {

        setThumbnail(
            wrapper,
            thumbnailCache.get(url)
        );


        setDurationFromCache(
            url,
            wrapper
        );


        return;

    }


    const temp =
        document.createElement(
            "video"
        );


    temp.preload =
        "metadata";


    temp.muted =
        true;


    temp.playsInline =
        true;


    temp.crossOrigin =
        "anonymous";


    temp.src =
        url;


    temp.addEventListener(
        "loadedmetadata",
        () => {

            if (
                Number.isFinite(
                    temp.duration
                )
            ) {

                durationCache.set(
                    url,
                    temp.duration
                );


                setDuration(
                    wrapper,
                    temp.duration
                );

            }


            try {

                temp.currentTime =
                    Math.min(
                        0.1,
                        temp.duration
                    );

            }

            catch(error) {

                console.warn(
                    error
                );

            }

        }
    );


    temp.addEventListener(
        "seeked",
        () => {

            try {

                if (
                    !temp.videoWidth ||
                    !temp.videoHeight
                ) {

                    return;

                }


                const canvas =
                    document.createElement(
                        "canvas"
                    );


                canvas.width =
                    temp.videoWidth;


                canvas.height =
                    temp.videoHeight;


                const ctx =
                    canvas.getContext(
                        "2d"
                    );


                ctx.drawImage(
                    temp,
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );


                const image =
                    canvas.toDataURL(
                        "image/jpeg",
                        .75
                    );


                thumbnailCache.set(
                    url,
                    image
                );


                setThumbnail(
                    wrapper,
                    image
                );


                setDurationFromCache(
                    url,
                    wrapper
                );

            }

            catch(error) {

                console.warn(
                    "Thumbnail generation failed:",
                    error
                );

            }


            temp.pause();

            temp.removeAttribute(
                "src"
            );

            temp.load();

        }
    );


    temp.addEventListener(
        "error",
        () => {

            console.warn(
                "Unable to load video:",
                url
            );

        }
    );

}



/* =========================================================
   DURATION
========================================================= */

function loadDuration(
    url,
    wrapper
) {

    if (!url) {
        return;
    }


    if (
        durationCache.has(url)
    ) {

        setDuration(
            wrapper,
            durationCache.get(url)
        );

        return;

    }


    const temp =
        document.createElement(
            "video"
        );


    temp.preload =
        "metadata";


    temp.muted =
        true;


    temp.playsInline =
        true;


    temp.src =
        url;


    temp.addEventListener(
        "loadedmetadata",
        () => {

            if (
                Number.isFinite(
                    temp.duration
                )
            ) {

                durationCache.set(
                    url,
                    temp.duration
                );


                setDuration(
                    wrapper,
                    temp.duration
                );

            }

        },
        {
            once: true
        }
    );

}



/* =========================================================
   DURATION CACHE
========================================================= */

function setDurationFromCache(
    url,
    wrapper
) {

    if (
        durationCache.has(url)
    ) {

        setDuration(
            wrapper,
            durationCache.get(url)
        );

    }

}



/* =========================================================
   SET DURATION
========================================================= */

function setDuration(
    wrapper,
    seconds
) {

    const old =
        wrapper.querySelector(
            ".duration"
        );


    if (old) {

        old.remove();

    }


    const element =
        document.createElement(
            "div"
        );


    element.className =
        "duration";


    element.textContent =
        formatDuration(
            seconds
        );


    wrapper.appendChild(
        element
    );

}



/* =========================================================
   FORMAT DURATION
========================================================= */

function formatDuration(
    seconds
) {

    seconds =
        Math.floor(
            Number(seconds) || 0
        );


    const hours =
        Math.floor(
            seconds / 3600
        );


    const minutes =
        Math.floor(
            (seconds % 3600) / 60
        );


    const secs =
        seconds % 60;


    if (hours > 0) {

        return (
            hours +
            ":" +
            String(minutes)
                .padStart(2,"0") +
            ":" +
            String(secs)
                .padStart(2,"0")
        );

    }


    return (
        minutes +
        ":" +
        String(secs)
            .padStart(2,"0")
    );

}



/* =========================================================
   LOAD SONG
========================================================= */

function loadSong(
    index,
    shouldPlay = false
) {

    if (
        index < 0 ||
        index >= songs.length
    ) {

        return;

    }


    current =
        index;


    const song =
        songs[index];


    video.src =
        song.video || "";


    title.textContent =
        song.title ||
        "Unknown Song";


    artist.textContent =
        song.artist ||
        "";


    description.textContent =
        song.description ||
        "";


    video.load();


    updateButtons();


    renderPlaylist(
        search.value
    );


    if (shouldPlay) {

        video.play().catch(
            () => {}
        );

    }

}



/* =========================================================
   QUEUE
========================================================= */

function addToQueue(
    songIndex
) {

    /*
     * Prevent duplicate queue item.
     */

    if (
        queue.includes(songIndex)
    ) {

        return;

    }


    queue.push(
        songIndex
    );


    updateQueueCount();


    /*
     * If currently viewing queue,
     * refresh it.
     */

    if (
        currentView === "queue"
    ) {

        renderQueue();

    }

}



/* =========================================================
   REMOVE QUEUE
========================================================= */

function removeFromQueue(
    queueIndex
) {

    if (
        queueIndex < 0 ||
        queueIndex >= queue.length
    ) {

        return;

    }


    queue.splice(
        queueIndex,
        1
    );


    updateQueueCount();


    renderQueue();

}



/* =========================================================
   CLEAR QUEUE
========================================================= */

clearQueueButton.addEventListener(
    "click",
    () => {

        queue = [];


        updateQueueCount();


        renderQueue();

    }
);



/* =========================================================
   PLAY QUEUE ITEM
========================================================= */

function playQueueItem(
    queueIndex
) {

    if (
        queueIndex < 0 ||
        queueIndex >= queue.length
    ) {

        return;

    }


    const songIndex =
        queue[queueIndex];


    /*
     * Remove selected item from
     * queue because it is now playing.
     */

    queue.splice(
        queueIndex,
        1
    );


    updateQueueCount();


    /*
     * Play song.
     */

    loadSong(
        songIndex,
        true
    );


    /*
     * Show queue.
     */

    renderQueue();

}



/* =========================================================
   PLAY NEXT QUEUED SONG
========================================================= */

function playNextQueuedSong() {

    if (
        queue.length === 0
    ) {

        /*
         * No queue.
         *
         * Continue normal playlist.
         */

        if (
            current <
            songs.length - 1
        ) {

            loadSong(
                current + 1,
                true
            );

        }

        return;

    }


    /*
     * Get first queue item.
     */

    const songIndex =
        queue.shift();


    updateQueueCount();


    /*
     * Play it.
     */

    loadSong(
        songIndex,
        true
    );


    /*
     * Update queue display.
     */

    if (
        currentView === "queue"
    ) {

        renderQueue();

    }

}



/* =========================================================
   VIDEO ENDED
========================================================= */

video.addEventListener(
    "ended",
    () => {

        if (
            autoplay.checked
        ) {

            playNextQueuedSong();

        }

    }
);



/* =========================================================
   QUEUE COUNT
========================================================= */

function updateQueueCount() {

    queueTabCount.textContent =
        queue.length;

}



/* =========================================================
   RENDER QUEUE
========================================================= */

function renderQueue() {

    list.innerHTML = "";


    panelTitle.textContent =
        "Queue";


    panelCount.textContent =
        queue.length;


    clearQueueButton.style.display =
        queue.length
            ? "block"
            : "none";


    if (
        queue.length === 0
    ) {

        list.innerHTML = `

            <div class="empty">

                Queue is empty.

                <br><br>

                Tap <b>+</b> on a song
                to add it here.

            </div>

        `;

        return;

    }


    queue.forEach(
        (songIndex, queueIndex) => {


            const song =
                songs[songIndex];


            if (!song) {
                return;
            }


            const element =
                createSongElement(
                    song,
                    queueIndex,
                    true
                );


            list.appendChild(
                element
            );


            setupThumbnail(
                song,
                element
            );

        }
    );

}



/* =========================================================
   TABS
========================================================= */

playlistTab.addEventListener(
    "click",
    () => {

        currentView =
            "playlist";


        playlistTab.classList.add(
            "active"
        );


        queueTab.classList.remove(
            "active"
        );


        renderPlaylist(
            search.value
        );

    }
);


queueTab.addEventListener(
    "click",
    () => {

        currentView =
            "queue";


        queueTab.classList.add(
            "active"
        );


        playlistTab.classList.remove(
            "active"
        );


        renderQueue();

    }
);



/* =========================================================
   SEARCH
========================================================= */

search.addEventListener(
    "input",
    () => {

        /*
         * Search only Songs tab.
         */

        if (
            currentView === "playlist"
        ) {

            renderPlaylist(
                search.value
            );

        }

    }
);


searchButton.addEventListener(
    "click",
    () => {

        if (
            currentView === "playlist"
        ) {

            renderPlaylist(
                search.value
            );

        }

    }
);



/* =========================================================
   PREVIOUS
========================================================= */

previous.addEventListener(
    "click",
    () => {

        if (
            current > 0
        ) {

            loadSong(
                current - 1,
                true
            );

        }

    }
);



/* =========================================================
   NEXT
========================================================= */

next.addEventListener(
    "click",
    () => {

        /*
         * If queue has songs,
         * queue gets priority.
         */

        if (
            queue.length > 0
        ) {

            playNextQueuedSong();

        }

        else if (
            current <
            songs.length - 1
        ) {

            loadSong(
                current + 1,
                true
            );

        }

    }
);



/* =========================================================
   BUTTON STATE
========================================================= */

function updateButtons() {

    previous.disabled =
        current === 0;


    /*
     * Next is always available
     * if queue exists.
     */

    next.disabled =
        queue.length === 0 &&
        current === songs.length - 1;

}



/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
    value = ""
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        value;


    return div.innerHTML;

}



/* =========================================================
   START
========================================================= */

loadPlaylist();

</script>

</body>
