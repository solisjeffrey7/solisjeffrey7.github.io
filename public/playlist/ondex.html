<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>Karaoke Jukebox</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #0b0b0b;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    height: 60px;
    background: #151515;
    border-bottom: 1px solid #303030;

    display: flex;
    align-items: center;

    padding: 0 18px;

    position: sticky;
    top: 0;

    z-index: 100;
}

.logo {
    font-size: 20px;
    font-weight: bold;
    white-space: nowrap;
}

.logo span {
    color: #ff1744;
}

.search {
    width: 500px;
    max-width: 55%;

    margin: auto;

    display: flex;
}

.search input {
    flex: 1;

    height: 38px;

    background: #101010;

    border: 1px solid #333;

    color: white;

    outline: none;

    padding: 0 14px;

    border-radius: 4px 0 0 4px;
}

.search button {
    width: 55px;

    border: 1px solid #333;
    border-left: 0;

    background: #303030;

    color: white;

    cursor: pointer;

    border-radius: 0 4px 4px 0;
}

.container {
    max-width: 1500px;

    margin: auto;

    padding: 20px;

    display: grid;

    grid-template-columns:
        minmax(0,1fr)
        400px;

    gap: 20px;
}

/* PLAYER */

.player {
    min-width: 0;
}

.video-box {
    width: 100%;

    aspect-ratio: 16/9;

    background: black;
}

video {
    width: 100%;
    height: 100%;

    display: block;

    background: black;
}

.info {
    padding-top: 15px;
}

.title {
    font-size: 22px;
    font-weight: bold;

    line-height: 1.4;
}

.artist {
    color: #aaa;

    margin-top: 5px;

    font-size: 15px;
}

.description {
    color: #888;

    margin-top: 8px;

    font-size: 13px;
}

.controls {
    display: flex;

    align-items: center;

    gap: 8px;

    margin-top: 15px;
}

.btn {
    background: #272727;

    color: white;

    border: none;

    padding: 10px 14px;

    border-radius: 5px;

    cursor: pointer;
}

.btn:hover {
    background: #3b3b3b;
}

.btn:disabled {
    opacity: .4;
}

.autoplay {
    margin-left: auto;

    color: #aaa;

    font-size: 13px;
}

/* PLAYLIST */

.playlist {
    background: #151515;

    border: 1px solid #303030;

    border-radius: 8px;

    overflow: hidden;

    position: sticky;

    top: 80px;

    height: fit-content;
}

.playlist-head {
    padding: 15px;

    border-bottom: 1px solid #303030;
}

.playlist-name {
    font-weight: bold;

    font-size: 17px;
}

.count {
    color: #888;

    font-size: 12px;

    margin-top: 4px;
}

.song-list {
    max-height:
        calc(100vh - 160px);

    overflow-y: auto;
}

.song {
    display: flex;

    gap: 10px;

    padding: 9px;

    cursor: pointer;
}

.song:hover {
    background: #252525;
}

.song.active {
    background: #303030;
}

.number {
    width: 25px;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #888;

    font-size: 12px;
}

.song.active .number {
    color: #ff1744;
}

.thumb {
    width: 120px;

    aspect-ratio: 16/9;

    background: #222;

    border-radius: 4px;

    overflow: hidden;

    position: relative;

    flex-shrink: 0;
}

.thumb img {
    width: 100%;
    height: 100%;

    object-fit: cover;
}

.placeholder {
    width: 100%;
    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    color: #666;

    font-size: 20px;
}

.duration {
    position: absolute;

    right: 4px;
    bottom: 4px;

    background: rgba(0,0,0,.85);

    padding: 2px 4px;

    border-radius: 3px;

    font-size: 11px;
}

.song-info {
    min-width: 0;
}

.song-title {
    font-size: 14px;

    font-weight: 500;

    line-height: 1.35;

    display: -webkit-box;

    -webkit-line-clamp: 2;

    -webkit-box-orient: vertical;

    overflow: hidden;
}

.song-artist {
    color: #888;

    font-size: 12px;

    margin-top: 5px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.loading {
    padding: 30px;

    text-align: center;

    color: #888;
}

.error {
    padding: 25px;

    color: #ff6666;

    text-align: center;
}

/* MOBILE */

@media(max-width:900px) {

    .container {
        display: block;

        padding: 0;
    }

    .info {
        padding: 14px;
    }

    .playlist {
        position: static;

        margin-top: 10px;

        border-left: 0;
        border-right: 0;

        border-radius: 0;
    }

    .song-list {
        max-height: none;
    }

}

@media(max-width:500px) {

    header {
        height: 55px;

        padding: 0 10px;
    }

    .logo {
        font-size: 15px;
    }

    .search {
        flex: 1;

        max-width: none;

        margin-left: 12px;
    }

    .search input {
        height: 34px;
    }

    .search button {
        width: 45px;

        height: 34px;
    }

    .title {
        font-size: 18px;
    }

    .thumb {
        width: 105px;
    }

}

</style>

</head>


<body>


<header>

    <div class="logo">

        <span>🎤</span>
        Karaoke Jukebox

    </div>


    <div class="search">

        <input
            id="search"
            type="text"
            placeholder="Search song or artist..."
        >

        <button id="searchBtn">
            🔍
        </button>

    </div>

</header>



<main class="container">


<section class="player">


    <div class="video-box">

        <video
            id="video"
            controls
            playsinline
            preload="metadata"
        ></video>

    </div>


    <div class="info">

        <div
            id="title"
            class="title"
        >
            Loading...
        </div>


        <div
            id="artist"
            class="artist"
        ></div>


        <div
            id="description"
            class="description"
        ></div>


        <div class="controls">

            <button
                id="prev"
                class="btn"
            >
                ⏮ Previous
            </button>


            <button
                id="next"
                class="btn"
            >
                Next ⏭
            </button>


            <label class="autoplay">

                <input
                    id="auto"
                    type="checkbox"
                    checked
                >

                Auto Next

            </label>

        </div>

    </div>

</section>



<aside class="playlist">


    <div class="playlist-head">

        <div
            id="playlistTitle"
            class="playlist-name"
        >
            Karaoke Playlist
        </div>


        <div
            id="count"
            class="count"
        >
            Loading...
        </div>

    </div>


    <div
        id="songs"
        class="song-list"
    >

        <div class="loading">

            Loading songs...

        </div>

    </div>


</aside>


</main>



<script>

/* =========================================================
   DATA
========================================================= */

let songs = [];

let current = 0;


/* =========================================================
   CACHE
========================================================= */

const thumbCache =
    new Map();

const durationCache =
    new Map();



/* =========================================================
   ELEMENTS
========================================================= */

const video =
    document.getElementById("video");

const title =
    document.getElementById("title");

const artist =
    document.getElementById("artist");

const description =
    document.getElementById("description");

const songsElement =
    document.getElementById("songs");

const count =
    document.getElementById("count");

const playlistTitle =
    document.getElementById("playlistTitle");

const prev =
    document.getElementById("prev");

const next =
    document.getElementById("next");

const auto =
    document.getElementById("auto");

const search =
    document.getElementById("search");

const searchBtn =
    document.getElementById("searchBtn");



/* =========================================================
   LOAD JSON
========================================================= */

async function loadPlaylist() {

    try {

        const response =
            await fetch(
                "playlist.json",
                {
                    cache: "no-cache"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        songs =
            Array.isArray(data)
                ? data
                : data.videos;


        if (!Array.isArray(songs)) {

            throw new Error(
                "Invalid playlist.json"
            );

        }


        playlistTitle.textContent =
            data.title ||
            "Karaoke Playlist";


        updateCount(
            songs.length
        );


        render();


        if (songs.length) {

            loadSong(
                0,
                false
            );

        }

    }

    catch(error) {

        console.error(error);


        songsElement.innerHTML = `

            <div class="error">

                Unable to load playlist.json

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

    }

}



/* =========================================================
   COUNT
========================================================= */

function updateCount(
    number
) {

    count.textContent =
        number +
        " song" +
        (
            number !== 1
                ? "s"
                : ""
        );

}



/* =========================================================
   RENDER
========================================================= */

function render(
    filter = ""
) {

    songsElement.innerHTML = "";


    const query =
        filter
            .trim()
            .toLowerCase();


    let visible = 0;


    songs.forEach(
        (song,index) => {


            const songTitle =
                song.title ||
                "Unknown Song";


            const songArtist =
                song.artist ||
                "";


            const searchText =
                (
                    songTitle +
                    " " +
                    songArtist
                )
                .toLowerCase();


            if (
                query &&
                !searchText.includes(
                    query
                )
            ) {

                return;

            }


            visible++;


            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "song";


            if (
                index === current
            ) {

                element.classList.add(
                    "active"
                );

            }


            element.innerHTML = `

                <div class="number">

                    ${String(
                        index + 1
                    ).padStart(2,"0")}

                </div>


                <div
                    class="thumb"
                    data-index="${index}"
                >

                    <div class="placeholder">

                        🎤

                    </div>

                </div>


                <div class="song-info">

                    <div class="song-title">

                        ${escapeHtml(
                            songTitle
                        )}

                    </div>


                    <div class="song-artist">

                        ${escapeHtml(
                            songArtist
                        )}

                    </div>

                </div>

            `;


            element.addEventListener(
                "click",
                () => {

                    loadSong(
                        index,
                        true
                    );

                }
            );


            songsElement.appendChild(
                element
            );


            setupThumbnail(
                song,
                element
            );

        }
    );


    if (!visible) {

        songsElement.innerHTML = `

            <div class="loading">

                No songs found.

            </div>

        `;

    }

}



/* =========================================================
   THUMBNAIL
========================================================= */

function setupThumbnail(
    song,
    element
) {

    const wrapper =
        element.querySelector(
            ".thumb"
        );


    /*
     * CUSTOM THUMBNAIL
     *
     * Highest priority.
     */

    if (
        song.thumbnail &&
        song.thumbnail.trim()
    ) {

        setThumbnail(
            wrapper,
            song.thumbnail
        );


        loadDuration(
            song.video,
            wrapper
        );


        return;

    }


    /*
     * NO CUSTOM THUMBNAIL
     *
     * Generate first frame.
     */

    generateThumbnail(
        song.video,
        wrapper
    );

}



/* =========================================================
   CUSTOM THUMBNAIL
========================================================= */

function setThumbnail(
    wrapper,
    src
) {

    wrapper.innerHTML = "";


    const img =
        document.createElement(
            "img"
        );


    img.src = src;

    img.alt = "";


    img.addEventListener(
        "error",
        () => {

            wrapper.innerHTML = `

                <div class="placeholder">

                    🎤

                </div>

            `;

        }
    );


    wrapper.appendChild(
        img
    );

}



/* =========================================================
   AUTO THUMBNAIL
========================================================= */

function generateThumbnail(
    url,
    wrapper
) {

    if (!url) {
        return;
    }


    if (
        thumbCache.has(url)
    ) {

        setThumbnail(
            wrapper,
            thumbCache.get(url)
        );


        setDurationFromCache(
            url,
            wrapper
        );


        return;

    }


    const temp =
        document.createElement(
            "video"
        );


    temp.preload =
        "metadata";

    temp.muted =
        true;

    temp.playsInline =
        true;

    temp.crossOrigin =
        "anonymous";

    temp.src =
        url;


    temp.addEventListener(
        "loadedmetadata",
        () => {

            /*
             * Duration.
             */

            if (
                Number.isFinite(
                    temp.duration
                )
            ) {

                durationCache.set(
                    url,
                    temp.duration
                );


                setDuration(
                    wrapper,
                    temp.duration
                );

            }


            /*
             * Seek first frame.
             */

            try {

                temp.currentTime =
                    Math.min(
                        .1,
                        temp.duration
                    );

            }

            catch(error) {

                console.warn(
                    error
                );

            }

        }
    );


    temp.addEventListener(
        "seeked",
        () => {

            try {

                if (
                    !temp.videoWidth ||
                    !temp.videoHeight
                ) {

                    return;

                }


                const canvas =
                    document.createElement(
                        "canvas"
                    );


                canvas.width =
                    temp.videoWidth;


                canvas.height =
                    temp.videoHeight;


                const ctx =
                    canvas.getContext(
                        "2d"
                    );


                ctx.drawImage(
                    temp,
                    0,
                    0
                );


                const image =
                    canvas.toDataURL(
                        "image/jpeg",
                        .75
                    );


                thumbCache.set(
                    url,
                    image
                );


                setThumbnail(
                    wrapper,
                    image
                );


                setDurationFromCache(
                    url,
                    wrapper
                );

            }

            catch(error) {

                console.warn(
                    "Automatic thumbnail failed:",
                    error
                );

            }


            temp.removeAttribute(
                "src"
            );

            temp.load();

        }
    );


    temp.addEventListener(
        "error",
        () => {

            console.warn(
                "Video cannot be loaded:",
                url
            );

        }
    );

}



/* =========================================================
   DURATION
========================================================= */

function loadDuration(
    url,
    wrapper
) {

    if (!url) {
        return;
    }


    if (
        durationCache.has(url)
    ) {

        setDuration(
            wrapper,
            durationCache.get(url)
        );

        return;

    }


    const temp =
        document.createElement(
            "video"
        );


    temp.preload =
        "metadata";

    temp.muted =
        true;

    temp.playsInline =
        true;

    temp.src =
        url;


    temp.addEventListener(
        "loadedmetadata",
        () => {

            if (
                Number.isFinite(
                    temp.duration
                )
            ) {

                durationCache.set(
                    url,
                    temp.duration
                );


                setDuration(
                    wrapper,
                    temp.duration
                );

            }

        },
        {
            once: true
        }
    );

}



/* =========================================================
   CACHE DURATION
========================================================= */

function setDurationFromCache(
    url,
    wrapper
) {

    if (
        durationCache.has(url)
    ) {

        setDuration(
            wrapper,
            durationCache.get(url)
        );

    }

}



/* =========================================================
   SET DURATION
========================================================= */

function setDuration(
    wrapper,
    seconds
) {

    const old =
        wrapper.querySelector(
            ".duration"
        );


    if (old) {

        old.remove();

    }


    const duration =
        document.createElement(
            "div"
        );


    duration.className =
        "duration";


    duration.textContent =
        formatTime(seconds);


    wrapper.appendChild(
        duration
    );

}



/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(
    seconds
) {

    seconds =
        Math.floor(
            Number(seconds) || 0
        );


    const h =
        Math.floor(
            seconds / 3600
        );


    const m =
        Math.floor(
            (seconds % 3600) / 60
        );


    const s =
        seconds % 60;


    if (h) {

        return (
            h +
            ":" +
            String(m)
                .padStart(2,"0") +
            ":" +
            String(s)
                .padStart(2,"0")
        );

    }


    return (
        m +
        ":" +
        String(s)
            .padStart(2,"0")
    );

}



/* =========================================================
   LOAD SONG
========================================================= */

function loadSong(
    index,
    autoplay = false
) {

    if (
        index < 0 ||
        index >= songs.length
    ) {

        return;

    }


    current =
        index;


    const song =
        songs[index];


    video.src =
        song.video || "";


    title.textContent =
        song.title ||
        "Unknown Song";


    artist.textContent =
        song.artist ||
        "";


    description.textContent =
        song.description ||
        "";


    video.load();


    render(
        search.value
    );


    updateButtons();


    setTimeout(
        () => {

            const active =
                songsElement.querySelector(
                    ".active"
                );


            if (active) {

                active.scrollIntoView({
                    behavior: "smooth",
                    block: "nearest"
                });

            }

        },
        50
    );


    if (autoplay) {

        video.play().catch(
            () => {}
        );

    }

}



/* =========================================================
   BUTTON STATE
========================================================= */

function updateButtons() {

    prev.disabled =
        current === 0;


    next.disabled =
        current ===
        songs.length - 1;

}



/* =========================================================
   NEXT
========================================================= */

function nextSong() {

    if (
        current <
        songs.length - 1
    ) {

        loadSong(
            current + 1,
            true
        );

    }

}



/* =========================================================
   PREVIOUS
========================================================= */

function previousSong() {

    if (
        current > 0
    ) {

        loadSong(
            current - 1,
            true
        );

    }

}



/* =========================================================
   AUTO NEXT
========================================================= */

video.addEventListener(
    "ended",
    () => {

        if (
            auto.checked &&
            current <
            songs.length - 1
        ) {

            nextSong();

        }

    }
);



/* =========================================================
   EVENTS
========================================================= */

prev.addEventListener(
    "click",
    previousSong
);


next.addEventListener(
    "click",
    nextSong
);


search.addEventListener(
    "input",
    () => {

        render(
            search.value
        );

    }
);


searchBtn.addEventListener(
    "click",
    () => {

        render(
            search.value
        );

    }
);


search.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            render(
                search.value
            );

        }

    }
);



/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
    value = ""
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        value;


    return div.innerHTML;

}



/* =========================================================
   START
========================================================= */

loadPlaylist();

</script>

</body>

</html>
