<html lang="en">

    <!-- =====================================================
         HTML5 QR CODE
    ====================================================== -->

    <script src="https://unpkg.com/html5-qrcode"></script>


    <style>

        /* =====================================================
           RESET
        ====================================================== */

        * {

            margin: 0;

        }


        html,
        body {

        }

            color: #fff;

        /* =====================================================

        ====================================================== */

        #log {

            width: 100%;
            height: 230px;

            overflow-y: auto;

            padding: 12px;

            background: #111;

            border:
                1px solid #333;

            border-radius: 10px;

            font-size: 13px;

            line-height: 1.5;

        }


        #log p {

            margin-bottom: 5px;

            word-break: break-word;

        }


        .success {

            color: #00ff88;

        }


        .error {

            color: #ff5555;

        }


        .warning {

            color: #ffaa00;

        }


        /* =====================================================
           MODAL
        ====================================================== */

        .modal {

            display: none;

            position: fixed;

            inset: 0;

            z-index: 1000;

            align-items: center;
            justify-content: center;

            padding: 15px;

        /* =====================================================

        ====================================================== */

        .footer {

    </style>

</head>


<body>


<!-- =========================================================

========================================================== -->

<header class="header">

<div class="container">

<!-- =========================================================
     MIKROTIK SETTINGS MODAL
========================================================== -->

<div
    id="settingsModal"
    class="modal"
>

    <div class="modal-content">


        <div class="modal-title">
            MikroTik API Settings
        </div>


        <!-- =================================================
             API URL
        ================================================== -->

        <div class="form-group">

            <label>
                MikroTik REST API URL

            <input
                id="apiUrl"

        <!-- =================================================
             USERNAME
        ================================================== -->

<script>

/* =========================================================
   VARIABLES
========================================================= */

let mikrotik = null;

let scanner = null;

let videoTrack = null;

let scanBusy = false;

let selectedPlan = "";

let planResolver = null;


/* =========================================================
   LOG
========================================================= */

function log(
    message,
    type = ""
) {

    const p =
        document.createElement("p");


    p.textContent =
        message;


    if (type) {

        p.className =
            type;

    }


    const box =
        document.getElementById(
            "log"
        );


    box.appendChild(p);


    box.scrollTop =
        box.scrollHeight;

}


/* =========================================================
   SETTINGS
========================================================= */

function openSettings() {

    document
        .getElementById(
            "settingsModal"
        )
        .style.display =
            "flex";

}


function closeSettings() {

    document
        .getElementById(
            "settingsModal"
        )
        .style.display =
            "none";

}


/* =========================================================
   SAVE SETTINGS
========================================================= */

function saveSettings() {

    let apiUrl =
        document
            .getElementById(
                "apiUrl"
            )
            .value
            .trim();


    const username =
        document
            .getElementById(
                "apiUser"
            )
            .value
            .trim();


    const password =
        document
            .getElementById(
                "apiPassword"
            )
            .value;


    if (!apiUrl) {

        alert(
            "Enter MikroTik REST API URL."
        );

        return;

    }


    if (!username) {

        alert(
            "Enter MikroTik username."
        );

        return;

    }


    if (!password) {

        alert(
            "Enter MikroTik password."
        );

        return;

    }


    /*
       Automatically remove trailing /
    */

    apiUrl =
        apiUrl.replace(
            /\/+$/,
            ""
        );


    mikrotik = {

        apiUrl:
            apiUrl,

        username:
            username,

        password:
            password

    };


    updateStatus();

    closeSettings();


    log(
        "MikroTik API configuration loaded.",
        "success"
    );


    /*
       Test connection
    */

    testConnection();

}


/* =========================================================
   CLEAR SETTINGS
========================================================= */

function clearSettings() {

    mikrotik = null;


    document
        .getElementById(
            "apiUrl"
        )
        .value = "";


    document
        .getElementById(
            "apiUser"
        )
        .value = "";


    document
        .getElementById(
            "apiPassword"
        )
        .value = "";


    updateStatus();


    log(
        "MikroTik configuration cleared.",
        "warning"
    );

}


/* =========================================================
   STATUS
========================================================= */

function updateStatus() {

    const status =
        document.getElementById(
            "status"
        );


    if (mikrotik) {

        status.textContent =
            "MikroTik API: " +
            mikrotik.apiUrl;


        status.className =
            "status ok";

    } else {

        status.textContent =
            "MikroTik configuration not set";


        status.className =
            "status error";

    }

}


/* =========================================================
   PASSWORD
========================================================= */

function togglePassword() {

    const input =
        document.getElementById(
            "apiPassword"
        );


    if (
        input.type ===
        "password"
    ) {

        input.type =
            "text";

    } else {

        input.type =
            "password";

    }

}


/* =========================================================
   MIKROTIK API REQUEST
========================================================= */

async function apiRequest(
    endpoint,
    method = "GET",
    body = null
) {

    if (!mikrotik) {

        throw new Error(
            "MikroTik API is not configured."
        );

    }


    const url =
        mikrotik.apiUrl +
        endpoint;


    const options = {

        method:

            method,

        headers: {

            "Authorization":
                "Basic " +
                btoa(
                    mikrotik.username +
                    ":" +
                    mikrotik.password
                ),

            "Content-Type":
                "application/json"

        }

    };


    if (body !== null) {

        options.body =
            JSON.stringify(
                body
            );

    }


    const response =
        await fetch(
            url,
            options
        );


    const text =
        await response.text();


    let data;


    try {

        data =
            text
                ? JSON.parse(text)
                : null;

    } catch {

        data =
            text;

    }


    if (!response.ok) {

        let message =
            "HTTP " +
            response.status;


        if (data) {

            if (
                typeof data ===
                "object"
            ) {

                message =
                    data.detail ||
                    data.error ||
                    data.message ||
                    message;

            } else {

                message =
                    data;

            }

        }


        throw new Error(
            message
        );

    }


    return data;

}


/* =========================================================
   TEST CONNECTION
========================================================= */

async function testConnection() {

    log(
        "Testing MikroTik API connection..."
    );


    try {

        const data =
            await apiRequest(
                "/system/resource"
            );


        log(
            "MikroTik API connection successful.",
            "success"
        );


        if (data) {

            if (data[0]) {

                log(
                    "RouterOS version: " +
                    (
                        data[0].version ||
                        "Unknown"
                    )
                );

            }

        }

    } catch (error) {

        log(
            "API connection failed: " +
            error.message,
            "error"
        );

    }

}


/* =========================================================
   QR PARAMETERS
========================================================= */

function getParams(
    parameter,
    url
) {

    try {

        const parsed =
            new URL(url);


        return parsed
            .searchParams
            .get(
                parameter
            );

    } catch {

        return null;

    }

}


/* =========================================================
   QR SCAN
========================================================= */

async function onScanSuccess(
    decodedText
) {

    if (scanBusy) {

        return;

    }


    scanBusy = true;


    log(
        "QR Code detected.",
        "success"
    );


    log(
        decodedText
    );


    const username =
        getParams(
            "username",
            decodedText
        );


    const password =
        getParams(
            "password",
            decodedText
        );


    if (
        !username ||
        !password
    ) {

        log(
            "Invalid QR code. username/password not found.",
            "error"
        );


        scanBusy = false;

        return;

    }


    log(
        "Ticket Username: " +
        username
    );


    const validity =
        await selectValidity();


    if (!validity) {

        log(
            "Plan selection cancelled.",
            "warning"
        );


        scanBusy = false;

        return;

    }


    log(
        "Selected plan: " +
        validity,
        "success"
    );


    await updateHotspotUser(
        username,
        password,
        validity
    );


    setTimeout(
        () => {

            scanBusy = false;

        },
        1500
    );

}


/* =========================================================
   UPDATE HOTSPOT USER
========================================================= */

async function updateHotspotUser(
    username,
    password,
    validity
) {

    if (!mikrotik) {

        log(
            "MikroTik API is not configured.",
            "error"
        );


        openSettings();

        scanBusy = false;

        return;

    }


    try {

        log(
            "Checking MikroTik hotspot user..."
        );


        /*
           GET all hotspot users
        */

        const users =
            await apiRequest(
                "/ip/hotspot/user"
            );


        const userList =
            Array.isArray(users)
                ? users
                : [];


        const existing =
            userList.find(
                user =>
                    user.name ===
                    username
            );


        /* =================================================
           NEW USER
        ================================================== */

        if (!existing) {

            log(
                "User does not exist. Creating user..."
            );


            const expire =
                addTime(
                    new Date(),
                    validity
                );


            await apiRequest(
                "/ip/hotspot/user",
                "PUT",
                {

                    name:
                        username,

                    password:
                        password,

                    comment:
                        expire,

                    profile:
                        "General"

                }
            );


            log(
                "User created successfully.",
                "success"
            );


            log(
                "Expiration: " +
                expire,
                "success"
            );


            /*
               Run RouterOS script3
            */

            await runScript3();


            return;

        }


        /* =================================================
           EXISTING USER
        ================================================== */

        log(
            "User already exists."
        );


        const oldComment =
            existing.comment || "";


        log(
            "Current expiration: " +
            oldComment
        );


        let newExpire;


        /*
           If old comment is not a valid
           remaining-time/date value,
           start from NOW.
        */

        if (!oldComment.trim()) {

            newExpire =
                addTime(
                    new Date(),
                    validity
                );

        } else {

            newExpire =
                addTime(
                    oldComment.trim(),
                    validity
                );

        }


        /*
           RouterOS REST API uses
           .id to identify the user.
        */

        await apiRequest(

            "/ip/hotspot/user/" +
            encodeURIComponent(
                existing[".id"]
            ),

            "PATCH",

            {

                comment:
                    newExpire,

                password:
                    password

            }

        );


        log(
            "User updated successfully.",
            "success"
        );


        log(
            "New expiration: " +
            newExpire,
            "success"
        );


        await runScript3();

    } catch (error) {

        log(
            "MikroTik API ERROR: " +
            error.message,
            "error"
        );

    }

}


/* =========================================================
   RUN SCRIPT3
========================================================= */

async function runScript3() {

    try {

        log(
            "Running RouterOS script3..."
        );


        /*
           RouterOS REST API:
           
           /system/script/run
        */

        await apiRequest(

            "/system/script/run",

            "POST",

            {

                ".id":
                    "*script3"

            }

        );


        log(
            "script3 executed.",
            "success"
        );


    } catch (error) {

        /*
           Don't fail the whole transaction
           if script3 is unavailable.
        */

        log(
            "script3 warning: " +
            error.message,
            "warning"
        );

    }

}


/* =========================================================
   GET REMAINING TIME
========================================================= */

function getRemainingTime(
    targetDate
) {

    const now =
        new Date();


    const target =
        new Date(
            targetDate
        );


    const difference =
        target - now;


    if (
        isNaN(
            target.getTime()
        )
    ) {

        return null;

    }


    if (
        difference <= 0
    ) {

        return "0d 0h 0m 0s";

    }


    const seconds =
        Math.floor(
            (
                difference /
                1000
            ) % 60
        );


    const minutes =
        Math.floor(
            (
                difference /
                1000 /
                60
            ) % 60
        );


    const hours =
        Math.floor(
            (
                difference /
                1000 /
                60 /
                60
            ) % 24
        );


    const days =
        Math.floor(
            difference /
            (
                1000 *
                60 *
                60 *
                24
            )
        );


    return (
        days +
        "d " +
        hours +
        "h " +
        minutes +
        "m " +
        seconds +
        "s"
    );

}


/* =========================================================
   ADD TIME
========================================================= */

function addTime(
    targetDate,
    timeToAdd
) {

    /*
       If targetDate is already a
       valid Date object
    */

    if (
        targetDate instanceof Date
    ) {

        const units = {

            d:
                24 *
                60 *
                60 *
                1000,

            h:
                60 *
                60 *
                1000,

            m:
                60 *
                1000,

            s:
                1000

        };


        const date =
            new Date(
                targetDate
            );


        const regex =
            /(\d+)([dhms])/g;


        let match;


        while (
            (
                match =
                regex.exec(
                    timeToAdd
                )
            ) !== null
        ) {

            const value =
                parseInt(
                    match[1],
                    10
                );


            const unit =
                match[2];


            date.setTime(
                date.getTime() +
                (
                    value *
                    units[unit]
                )
            );

        }


        return formatDate(
            date
        );

    }


    /*
       Existing expiration
       stored as:
       
       jan/01/2026 12:00:00
    */

    const target =
        parseExpiration(
            String(
                targetDate
            )
        );


    if (!target) {

        return addTime(
            new Date(),
            timeToAdd
        );

    }


    const units = {

        d:
            24 *
            60 *
            60 *
            1000,

        h:
            60 *
            60 *
            1000,

        m:
            60 *
            1000,

        s:
            1000

    };


    const date =
        new Date(
            target
        );


    const regex =
        /(\d+)([dhms])/g;


    let match;


    while (
        (
            match =
            regex.exec(
                timeToAdd
            )
        ) !== null
    ) {

        const value =
            parseInt(
                match[1],
                10
            );


        const unit =
            match[2];


        date.setTime(
            date.getTime() +
            (
                value *
                units[unit]
            )
        );

    }


    /*
       If expiration is already past,
       add validity from NOW instead.
    */

    if (
        target.getTime() <
        Date.now()
    ) {

        return addTime(
            new Date(),
            timeToAdd
        );

    }


    return formatDate(
        date
    );

}


/* =========================================================
   PARSE EXPIRATION
========================================================= */

function parseExpiration(
    value
) {

    /*
       Format:

       jan/01/2026 12:00:00

    */

    const regex =
        /^([a-zA-Z]{3})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2}):(\d{2})$/;


    const match =
        value.match(
            regex
        );


    if (!match) {

        return null;

    }


    const months = {

        jan: 0,
        feb: 1,
        mar: 2,
        apr: 3,
        may: 4,
        jun: 5,
        jul: 6,
        aug: 7,
        sep: 8,
        oct: 9,
        nov: 10,
        dec: 11

    };


    const month =
        months[
            match[1]
                .toLowerCase()
        ];


    if (
        month === undefined
    ) {

        return null;

    }


    return new Date(

        Number(
            match[3]
        ),

        month,

        Number(
            match[2]
        ),

        Number(
            match[4]
        ),

        Number(
            match[5]
        ),

        Number(
            match[6]
        )

    );

}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDate(
    date
) {

    const months = [

        "jan",
        "feb",
        "mar",
        "apr",
        "may",
        "jun",
        "jul",
        "aug",
        "sep",
        "oct",
        "nov",
        "dec"

    ];


    const month =
        months[
            date.getMonth()
        ];


    const day =
        String(
            date.getDate()
        ).padStart(
            2,
            "0"
        );


    const year =
        date.getFullYear();


    const hours =
        String(
            date.getHours()
        ).padStart(
            2,
            "0"
        );


    const minutes =
        String(
            date.getMinutes()
        ).padStart(
            2,
            "0"
        );


    const seconds =
        String(
            date.getSeconds()
        ).padStart(
            2,
            "0"
        );


    return (

        month +
        "/" +
        day +
        "/" +
        year +
        " " +
        hours +
        ":" +
        minutes +
        ":" +
        seconds

    );

}


/* =========================================================
   GALLERY
========================================================= */

function openGallery() {

    document
        .getElementById(
            "galleryInput"
        )
        .click();

}


async function scanGallery(
    event
) {

    const file =
        event.target.files[0];


    if (!file) {

        return;

    }


    if (scanBusy) {

        return;

    }


    scanBusy = true;


    log(
        "Scanning gallery image..."
    );


    const imageScanner =
        new Html5Qrcode(
            "qr-reader"
        );


    try {

        const decodedText =
            await imageScanner.scanFile(
                file,
                true
            );


        await onScanSuccess(
            decodedText
        );


    } catch {

        log(
            "No QR code found in image.",
            "error"
        );


        scanBusy = false;

    }


    event.target.value = "";

}


/* =========================================================
   FLASHLIGHT
========================================================= */

async function toggleFlash() {

    try {

        if (!videoTrack) {

            const video =
                document.querySelector(
                    "#qr-reader video"
                );


            if (
                !video ||
                !video.srcObject
            ) {

                log(
                    "Camera is not ready.",
                    "warning"
                );

                return;

            }


            videoTrack =
                video.srcObject
                    .getVideoTracks()[0];

        }


        const capabilities =
            videoTrack
                .getCapabilities();


        if (!capabilities.torch) {

            log(
                "Flashlight is not supported.",
                "warning"
            );

            return;

        }


        const settings =
            videoTrack
                .getSettings();


        await videoTrack
            .applyConstraints({

                advanced: [

                    {

                        torch:
                            !settings.torch

                    }

                ]

            });


        log(
            settings.torch
                ? "Flashlight OFF."
                : "Flashlight ON."
        );

    } catch (error) {

        log(
            "Flashlight error: " +
            error.message,
            "error"
        );

    }

}


/* =========================================================
   PLAN SELECTOR
========================================================= */

function selectValidity() {

    return new Promise(
        resolve => {

            selectedPlan =
                "";

            planResolver =
                resolve;


            document
                .querySelectorAll(
                    ".plan"
                )
                .forEach(
                    plan => {

                        plan.classList
                            .remove(
                                "selected"
                            );

                    }
                );


            document
                .getElementById(
                    "planModal"
                )
                .style.display =
                    "flex";

        }
    );

}


function selectPlan(
    element
) {

    document
        .querySelectorAll(
            ".plan"
        )
        .forEach(
            plan => {

                plan.classList
                    .remove(
                        "selected"
                    );

            }
        );


    element.classList.add(
        "selected"
    );


    selectedPlan =
        element.dataset.value;

}


function confirmPlan() {

    if (!selectedPlan) {

        alert(
            "Please select a plan."
        );

        return;

    }


    document
        .getElementById(
            "planModal"
        )
        .style.display =
            "none";


    if (planResolver) {

        planResolver(
            selectedPlan
        );

        planResolver =
            null;

    }

}


function cancelPlan() {

    document
        .getElementById(
            "planModal"
        )
        .style.display =
            "none";


    if (planResolver) {

        planResolver(
            null
        );

        planResolver =
            null;

    }

}


/* =========================================================
   OUTSIDE MODAL CLICK
========================================================= */

window.addEventListener(
    "click",
    function(event) {

        const settings =
            document.getElementById(
                "settingsModal"
            );


        const plans =
            document.getElementById(
                "planModal"
            );


        if (
            event.target ===
            settings
        ) {

            closeSettings();

        }


        if (
            event.target ===
            plans
        ) {

            cancelPlan();

        }

    }
);


/* =========================================================
   START CAMERA
========================================================= */

async function startScanner() {

    log(
        "Initializing QR scanner..."
    );


    scanner =
        new Html5Qrcode(
            "qr-reader"
        );


    try {

        await scanner.start(

            {
                facingMode:
                    "environment"
            },

            {
                fps: 10,

                qrbox: 250

            },

            onScanSuccess,

            () => {}

        );


        log(
            "QR scanner ready.",
            "success"
        );


        log(
            "Scan a ticket QR code."
        );


        setTimeout(
            () => {

                const video =
                    document.querySelector(
                        "#qr-reader video"
                    );


                if (
                    video &&
                    video.srcObject
                ) {

                    videoTrack =
                        video.srcObject
                            .getVideoTracks()[0];

                }

            },
            1000
        );


    } catch (error) {

        log(
            "Camera error: " +
            error,
            "error"
        );

    }

}


/* =========================================================
   INITIALIZE
========================================================= */

updateStatus();


log(
    "MikroTik REST API QR Ticket System"
);


log(
    "Open ⚙️ to configure MikroTik."
);


startScanner();

</script>
