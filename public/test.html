<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="MikroTik Hotspot QR Ticket Scanner"
    >

    <title>MikroTik QR Scanner</title>


    <!-- =====================================================
         HTML5 QR CODE
    ====================================================== -->

    <script src="https://unpkg.com/html5-qrcode"></script>


    <style>

        /* =====================================================
           RESET
        ====================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;
        }


        body {

            background: #000;
            color: #fff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }


        /* =====================================================
           HEADER
        ====================================================== */

        .header {

            position: sticky;
            top: 0;
            z-index: 100;

            width: 100%;
            height: 60px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 15px;

            background: #111;

            border-bottom:
                1px solid #333;

        }


        .title {

            font-size: 18px;
            font-weight: bold;

        }


        .settings-btn {

            width: 42px;
            height: 42px;

            border: none;
            border-radius: 50%;

            background: #222;
            color: white;

            font-size: 20px;

            cursor: pointer;

        }


        .settings-btn:active {

            transform: scale(.95);

        }


        /* =====================================================
           MAIN
        ====================================================== */

        .container {

            width: 100%;
            max-width: 500px;

            margin: auto;

            padding: 15px;

        }


        /* =====================================================
           QR READER
        ====================================================== */

        #qr-reader {

            width: 100%;
            max-width: 360px;

            margin:
                10px auto;

            background: #111;

            border-radius: 15px;

            overflow: hidden;

        }


        #qr-reader video {

            width: 100% !important;

            border-radius: 15px;

        }


        /* =====================================================
           BUTTONS
        ====================================================== */

        .buttons {

            display: flex;

            gap: 10px;

            margin-top: 15px;

        }


        .main-btn {

            flex: 1;

            padding: 13px 10px;

            border: none;
            border-radius: 10px;

            background: #222;

            color: white;

            font-size: 14px;
            font-weight: bold;

            cursor: pointer;

        }


        .main-btn:hover {

            background: #333;

        }


        .main-btn:active {

            transform: scale(.98);

        }


        #galleryInput {

            display: none;

        }


        /* =====================================================
           STATUS
        ====================================================== */

        .status {

            margin-top: 15px;

            padding: 11px;

            border-radius: 8px;

            background: #111;

            border:
                1px solid #333;

            text-align: center;

            font-size: 13px;

        }


        .status.ok {

            color: #00ff88;

        }


        .status.error {

            color: #ff5555;

        }


        .status.warning {

            color: #ffaa00;

        }


        /* =====================================================
           LOG
        ====================================================== */

        .log-title {

            margin-top: 20px;
            margin-bottom: 8px;

            font-size: 14px;
            font-weight: bold;

        }


        #log {

            width: 100%;
            height: 300px;

            overflow-y: auto;

            padding: 12px;

            background: #111;

            border:
                1px solid #333;

            border-radius: 10px;

            font-size: 13px;

            line-height: 1.5;

        }


        #log p {

            margin-bottom: 5px;

            word-break: break-word;

        }


        .success {

            color: #00ff88;

        }


        .error {

            color: #ff5555;

        }


        .warning {

            color: #ffaa00;

        }


        .info {

            color: #66b3ff;

        }


        /* =====================================================
           USER INFORMATION
        ====================================================== */

        #userInfo {

            display: none;

            margin-top: 15px;

            padding: 15px;

            background: #111;

            border:
                1px solid #333;

            border-radius: 12px;

        }


        .user-info-title {

            margin-bottom: 10px;

            font-size: 16px;
            font-weight: bold;

        }


        .time-row {

            display: flex;

            justify-content: space-between;

            gap: 10px;

            padding: 7px 0;

            border-bottom:
                1px solid #222;

        }


        .time-row:last-child {

            border-bottom: none;

        }


        .time-label {

            color: #aaa;

        }


        .time-value {

            text-align: right;

            font-weight: bold;

            word-break: break-word;

        }


        /* =====================================================
           MODAL
        ====================================================== */

        .modal {

            display: none;

            position: fixed;

            inset: 0;

            z-index: 1000;

            align-items: center;
            justify-content: center;

            padding: 15px;

            background:
                rgba(0, 0, 0, .82);

        }


        .modal-content {

            width: 100%;
            max-width: 420px;

            max-height: 90vh;

            overflow-y: auto;

            padding: 20px;

            background: #151515;

            border:
                1px solid #444;

            border-radius: 15px;

        }


        .modal-title {

            margin-bottom: 20px;

            font-size: 20px;

            font-weight: bold;

        }


        /* =====================================================
           FORM
        ====================================================== */

        .form-group {

            margin-bottom: 15px;

        }


        .form-group label {

            display: block;

            margin-bottom: 6px;

            color: #bbb;

            font-size: 13px;

        }


        .form-group input {

            width: 100%;

            padding: 12px;

            background: #222;

            color: white;

            border:
                1px solid #444;

            border-radius: 8px;

            outline: none;

            font-size: 15px;

        }


        .form-group input:focus {

            border-color: #008cff;

        }


        .password-box {

            position: relative;

        }


        .password-box input {

            padding-right: 50px;

        }


        .show-password {

            position: absolute;

            right: 8px;
            top: 50%;

            transform:
                translateY(-50%);

            border: none;

            background: transparent;

            color: #aaa;

            font-size: 18px;

            cursor: pointer;

        }


        /* =====================================================
           REMEMBER ME
        ====================================================== */

        .remember-row {

            display: flex;

            align-items: center;

            gap: 9px;

            margin-top: 5px;

            color: #ccc;

            font-size: 13px;

            cursor: pointer;

            user-select: none;

        }


        .remember-row input {

            width: 18px;
            height: 18px;

            accent-color: #008cff;

            cursor: pointer;

        }


        /* =====================================================
           MODAL BUTTONS
        ====================================================== */

        .modal-buttons {

            display: flex;

            gap: 8px;

            margin-top: 20px;

        }


        .modal-btn {

            flex: 1;

            padding: 12px;

            border: none;

            border-radius: 8px;

            font-weight: bold;

            cursor: pointer;

        }


        .save {

            background: #007bff;

            color: white;

        }


        .clear {

            background: #333;

            color: white;

        }


        .cancel {

            background: #b52b2b;

            color: white;

        }


        /* =====================================================
           PLANS
        ====================================================== */

        #plansContainer {

            width: 100%;

        }


        .plan {

            padding: 14px;

            margin-bottom: 10px;

            background: #222;

            border:
                1px solid #444;

            border-radius: 10px;

            cursor: pointer;

            transition:
                .15s ease;

        }


        .plan:hover {

            background: #2d2d2d;

        }


        .plan:active {

            transform:
                scale(.99);

        }


        .plan.selected {

            background: #063b70;

            border-color: #008cff;

        }


        .plan-name {

            font-size: 15px;

            font-weight: bold;

        }


        .plan-info {

            margin-top: 4px;

            color: #aaa;

            font-size: 12px;

        }


        .plan-price {

            margin-top: 7px;

            color: #00ff88;

            font-size: 14px;

            font-weight: bold;

        }


        .no-plans {

            padding: 15px;

            color: #ff5555;

            text-align: center;

        }


        /* =====================================================
           FOOTER
        ====================================================== */

        .footer {

            padding: 20px;

            color: #666;

            text-align: center;

            font-size: 11px;

        }

    </style>

</head>


<body>


<!-- =========================================================
     HEADER
========================================================== -->

<header class="header">

    <div class="title">
        MikroTik QR Scanner
    </div>


    <button
        class="settings-btn"
        onclick="openSettings()"
        title="MikroTik Settings"
    >
        ⚙️
    </button>

</header>



<!-- =========================================================
     MAIN
========================================================== -->

<div class="container">


    <!-- CAMERA -->

    <div id="qr-reader"></div>


    <!-- BUTTONS -->

    <div class="buttons">

        <button
            class="main-btn"
            onclick="openGallery()"
        >
            🖼️ Gallery
        </button>


        <button
            class="main-btn"
            onclick="toggleFlash()"
            id="flashButton"
        >
            🔦 Flash
        </button>

    </div>


    <!-- GALLERY INPUT -->

    <input
        id="galleryInput"
        type="file"
        accept="image/*"
        onchange="scanGallery(event)"
    >


    <!-- STATUS -->

    <div
        id="status"
        class="status error"
    >
        MikroTik configuration not set
    </div>


    <!-- =====================================================
         USER INFORMATION
    ====================================================== -->

    <div id="userInfo">

        <div class="user-info-title">
            👤 User Information
        </div>


        <div class="time-row">

            <span class="time-label">
                Username
            </span>

            <span
                class="time-value"
                id="infoUsername"
            >
                -
            </span>

        </div>


        <div class="time-row">

            <span class="time-label">
                Current Time Left
            </span>

            <span
                class="time-value"
                id="infoCurrentTime"
            >
                -
            </span>

        </div>


        <div class="time-row">

            <span class="time-label">
                Plan to Add
            </span>

            <span
                class="time-value"
                id="infoAddTime"
            >
                -
            </span>

        </div>


        <div class="time-row">

            <span class="time-label">
                New Total Time
            </span>

            <span
                class="time-value"
                id="infoNewTime"
            >
                -
            </span>

        </div>


        <div class="time-row">

            <span class="time-label">
                New Expiration
            </span>

            <span
                class="time-value"
                id="infoExpiration"
            >
                -
            </span>

        </div>

    </div>


    <!-- LOG -->

    <div class="log-title">
        Activity Log
    </div>


    <div id="log"></div>


    <div class="footer">
        MikroTik Hotspot QR Ticket System
    </div>

</div>



<!-- =========================================================
     SETTINGS MODAL
========================================================== -->

<div
    id="settingsModal"
    class="modal"
>

    <div class="modal-content">


        <div class="modal-title">
            MikroTik API Settings
        </div>


        <div class="form-group">

            <label>
                MikroTik REST API URL
            </label>


            <input
                id="apiUrl"
                type="url"
                placeholder="https://10.0.0.1/rest"
                autocomplete="off"
            >

        </div>


        <div class="form-group">

            <label>
                MikroTik Username
            </label>


            <input
                id="apiUser"
                type="text"
                placeholder="admin"
                autocomplete="off"
            >

        </div>


        <div class="form-group">

            <label>
                MikroTik Password
            </label>


            <div class="password-box">

                <input
                    id="apiPassword"
                    type="password"
                    placeholder="Password"
                    autocomplete="off"
                >


                <button
                    type="button"
                    class="show-password"
                    onclick="togglePassword()"
                >
                    👁️
                </button>

            </div>

        </div>


        <!-- REMEMBER ME -->

        <label class="remember-row">

            <input
                id="rememberMe"
                type="checkbox"
            >

            <span>
                Remember Me
            </span>

        </label>


        <div class="modal-buttons">

            <button
                class="modal-btn save"
                onclick="saveSettings()"
            >
                Connect
            </button>


            <button
                class="modal-btn clear"
                onclick="clearSettings()"
            >
                Clear
            </button>


            <button
                class="modal-btn cancel"
                onclick="closeSettings()"
            >
                Cancel
            </button>

        </div>

    </div>

</div>



<!-- =========================================================
     PLAN MODAL
========================================================== -->

<div
    id="planModal"
    class="modal"
>

    <div class="modal-content">


        <div class="modal-title">
            Select Plan
        </div>


        <!-- Plans generated from plan.json -->

        <div id="plansContainer">

            <div class="no-plans">
                Loading plans...
            </div>

        </div>


        <div class="modal-buttons">

            <button
                class="modal-btn save"
                onclick="confirmPlan()"
            >
                OK
            </button>


            <button
                class="modal-btn cancel"
                onclick="cancelPlan()"
            >
                Cancel
            </button>

        </div>

    </div>

</div>



<script>

/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let mikrotik = null;

let scanner = null;

let videoTrack = null;

let scanBusy = false;

let selectedPlan = "";

let selectedPlanData = null;

let planResolver = null;

let plans = [];


/* =========================================================
   STORAGE
========================================================= */

const CONFIG_KEY =
    "mikrotik_qr_config";


/* =========================================================
   LOG
========================================================= */

function log(
    message,
    type = ""
) {

    const p =
        document.createElement(
            "p"
        );


    p.textContent =
        message;


    if (type) {

        p.className =
            type;

    }


    const box =
        document.getElementById(
            "log"
        );


    box.appendChild(
        p
    );


    box.scrollTop =
        box.scrollHeight;

}


/* =========================================================
   LOAD PLAN.JSON
========================================================= */

async function loadPlans() {

    const container =
        document.getElementById(
            "plansContainer"
        );


    try {

        const response =
            await fetch(
                "plan.json",
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        plans =
            Array.isArray(
                data.plans
            )
                ? data.plans
                : [];


        /*
           Only enabled plans.
        */

        plans =
            plans.filter(
                plan =>
                    plan.enabled !== false
            );


        renderPlans();


        log(
            plans.length +
            " plan(s) loaded from plan.json.",
            "success"
        );


    } catch (error) {

        plans = [];


        container.innerHTML =

            '<div class="no-plans">' +

            'Unable to load plan.json<br>' +

            '<small>' +

            error.message +

            '</small>' +

            '</div>';


        log(
            "Failed to load plan.json: " +
            error.message,
            "error"
        );

    }

}


/* =========================================================
   RENDER PLANS
========================================================= */

function renderPlans() {

    const container =
        document.getElementById(
            "plansContainer"
        );


    container.innerHTML = "";


    if (!plans.length) {

        container.innerHTML =

            '<div class="no-plans">' +

            'No enabled plans found.' +

            '</div>';

        return;

    }


    plans.forEach(
        plan => {

            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "plan";


            element.dataset.id =
                plan.id;


            element.onclick =
                () => selectPlan(
                    element
                );


            const name =
                document.createElement(
                    "div"
                );


            name.className =
                "plan-name";


            name.textContent =
                plan.name ||
                plan.duration ||
                plan.id;


            const description =
                document.createElement(
                    "div"
                );


            description.className =
                "plan-info";


            description.textContent =
                plan.description ||
                (
                    "Add " +
                    plan.duration
                );


            element.appendChild(
                name
            );


            element.appendChild(
                description
            );


            /*
               Show price only if
               price is supplied.
            */

            if (
                plan.price !== undefined &&
                plan.price !== null
            ) {

                const price =
                    document.createElement(
                        "div"
                    );


                price.className =
                    "plan-price";


                if (
                    Number(plan.price) ===
                    0
                ) {

                    price.textContent =
                        "FREE";

                } else {

                    price.textContent =
                        "₱" +
                        Number(
                            plan.price
                        ).toLocaleString(
                            "en-PH"
                        );

                }


                element.appendChild(
                    price
                );

            }


            container.appendChild(
                element
            );

        }
    );

}


/* =========================================================
   SETTINGS
========================================================= */

function openSettings() {

    document
        .getElementById(
            "settingsModal"
        )
        .style.display =
            "flex";

}


function closeSettings() {

    document
        .getElementById(
            "settingsModal"
        )
        .style.display =
            "none";

}


/* =========================================================
   SAVE SETTINGS
========================================================= */

function saveSettings() {

    let apiUrl =
        document
            .getElementById(
                "apiUrl"
            )
            .value
            .trim();


    const username =
        document
            .getElementById(
                "apiUser"
            )
            .value
            .trim();


    const password =
        document
            .getElementById(
                "apiPassword"
            )
            .value;


    const remember =
        document
            .getElementById(
                "rememberMe"
            )
            .checked;


    if (!apiUrl) {

        alert(
            "Enter MikroTik REST API URL."
        );

        return;

    }


    if (!username) {

        alert(
            "Enter MikroTik username."
        );

        return;

    }


    if (!password) {

        alert(
            "Enter MikroTik password."
        );

        return;

    }


    apiUrl =
        apiUrl.replace(
            /\/+$/,
            ""
        );


    mikrotik = {

        apiUrl:
            apiUrl,

        username:
            username,

        password:
            password

    };


    if (remember) {

        try {

            localStorage.setItem(

                CONFIG_KEY,

                JSON.stringify({

                    apiUrl:
                        apiUrl,

                    username:
                        username,

                    password:
                        password,

                    remember:
                        true

                })

            );


            log(
                "Configuration saved. Remember Me is ON.",
                "success"
            );


        } catch (error) {

            log(
                "Could not save configuration: " +
                error.message,
                "warning"
            );

        }

    } else {

        localStorage.removeItem(
            CONFIG_KEY
        );


        log(
            "Remember Me is OFF."
        );

    }


    updateStatus();

    closeSettings();

    testConnection();

}


/* =========================================================
   CLEAR SETTINGS
========================================================= */

function clearSettings() {

    mikrotik = null;


    localStorage.removeItem(
        CONFIG_KEY
    );


    document
        .getElementById(
            "apiUrl"
        )
        .value = "";


    document
        .getElementById(
            "apiUser"
        )
        .value = "";


    document
        .getElementById(
            "apiPassword"
        )
        .value = "";


    document
        .getElementById(
            "rememberMe"
        )
        .checked = false;


    updateStatus();


    log(
        "Configuration and saved credentials cleared.",
        "warning"
    );

}


/* =========================================================
   LOAD SAVED SETTINGS
========================================================= */

function loadSavedSettings() {

    try {

        const saved =
            localStorage.getItem(
                CONFIG_KEY
            );


        if (!saved) {

            return;

        }


        const config =
            JSON.parse(
                saved
            );


        if (
            !config.apiUrl ||
            !config.username ||
            !config.password
        ) {

            localStorage.removeItem(
                CONFIG_KEY
            );

            return;

        }


        document
            .getElementById(
                "apiUrl"
            )
            .value =
                config.apiUrl;


        document
            .getElementById(
                "apiUser"
            )
            .value =
                config.username;


        document
            .getElementById(
                "apiPassword"
            )
            .value =
                config.password;


        document
            .getElementById(
                "rememberMe"
            )
            .checked =
                true;


        mikrotik = {

            apiUrl:
                config.apiUrl,

            username:
                config.username,

            password:
                config.password

        };


        updateStatus();


        log(
            "Saved MikroTik configuration restored.",
            "success"
        );


        testConnection();


    } catch (error) {

        localStorage.removeItem(
            CONFIG_KEY
        );


        log(
            "Saved configuration could not be restored.",
            "warning"
        );

    }

}


/* =========================================================
   STATUS
========================================================= */

function updateStatus() {

    const status =
        document.getElementById(
            "status"
        );


    if (mikrotik) {

        status.textContent =
            "MikroTik API: " +
            mikrotik.apiUrl;


        status.className =
            "status ok";

    } else {

        status.textContent =
            "MikroTik configuration not set";


        status.className =
            "status error";

    }

}


/* =========================================================
   PASSWORD
========================================================= */

function togglePassword() {

    const input =
        document.getElementById(
            "apiPassword"
        );


    input.type =
        input.type === "password"
            ? "text"
            : "password";

}


/* =========================================================
   API REQUEST
========================================================= */

async function apiRequest(
    endpoint,
    method = "GET",
    body = null
) {

    if (!mikrotik) {

        throw new Error(
            "MikroTik API is not configured."
        );

    }


    const url =
        mikrotik.apiUrl +
        endpoint;


    const options = {

        method:
            method,

        headers: {

            "Authorization":
                "Basic " +
                btoa(
                    mikrotik.username +
                    ":" +
                    mikrotik.password
                ),

            "Content-Type":
                "application/json"

        }

    };


    if (body !== null) {

        options.body =
            JSON.stringify(
                body
            );

    }


    const response =
        await fetch(
            url,
            options
        );


    const text =
        await response.text();


    let data;


    try {

        data =
            text
                ? JSON.parse(text)
                : null;

    } catch {

        data =
            text;

    }


    if (!response.ok) {

        let message =
            "HTTP " +
            response.status;


        if (data) {

            if (
                typeof data ===
                "object"
            ) {

                message =
                    data.detail ||
                    data.error ||
                    data.message ||
                    message;

            } else {

                message =
                    data;

            }

        }


        throw new Error(
            message
        );

    }


    return data;

}


/* =========================================================
   TEST CONNECTION
========================================================= */

async function testConnection() {

    if (!mikrotik) {

        return;

    }


    log(
        "Testing MikroTik REST API..."
    );


    try {

        const data =
            await apiRequest(
                "/system/resource"
            );


        log(
            "MikroTik API connection successful.",
            "success"
        );


        if (
            Array.isArray(data) &&
            data[0]
        ) {

            log(
                "RouterOS version: " +
                (
                    data[0].version ||
                    "Unknown"
                )
            );

        }

    } catch (error) {

        log(
            "API connection failed: " +
            error.message,
            "error"
        );

    }

}


/* =========================================================
   GET QR PARAMETER
========================================================= */

function getParams(
    parameter,
    url
) {

    try {

        const parsed =
            new URL(
                url
            );


        return parsed
            .searchParams
            .get(
                parameter
            );

    } catch {

        return null;

    }

}


/* =========================================================
   CAMERA QR SUCCESS
========================================================= */

async function onScanSuccess(
    decodedText
) {

    if (scanBusy) {

        return;

    }


    scanBusy = true;


    hideUserInfo();


    log(
        "================================"
    );


    log(
        "QR CODE DETECTED",
        "success"
    );


    log(
        decodedText,
        "success"
    );


    log(
        "================================"
    );


    await processQrContent(
        decodedText
    );

}


/* =========================================================
   PROCESS QR
========================================================= */

async function processQrContent(
    decodedText
) {

    try {

        const username =
            getParams(
                "username",
                decodedText
            );


        const password =
            getParams(
                "password",
                decodedText
            );


        if (
            !username ||
            !password
        ) {

            log(
                "Invalid QR code.",
                "error"
            );


            log(
                "username or password not found.",
                "error"
            );


            scanBusy = false;

            return;

        }


        log(
            "Username: " +
            username
        );


        await updateHotspotUser(
            username,
            password
        );


    } catch (error) {

        log(
            "Processing error: " +
            error.message,
            "error"
        );


        scanBusy = false;

    }

}


/* =========================================================
   UPDATE HOTSPOT USER
========================================================= */

async function updateHotspotUser(
    username,
    password
) {

    if (!mikrotik) {

        log(
            "MikroTik API is not configured.",
            "error"
        );


        openSettings();

        scanBusy = false;

        return;

    }


    try {

        log(
            "GET /ip/hotspot/user"
        );


        const users =
            await apiRequest(
                "/ip/hotspot/user"
            );


        const list =
            Array.isArray(users)
                ? users
                : [];


        const existing =
            list.find(
                user =>
                    user.name ===
                    username
            );


        /* =================================================
           EXISTING USER
        ================================================== */

        if (existing) {

            log(
                "================================"
            );


            log(
                "USER FOUND",
                "success"
            );


            log(
                "================================"
            );


            log(
                "Username: " +
                username
            );


            const oldComment =
                existing.comment ||
                "";


            log(
                "Current Expiration: " +
                (
                    oldComment ||
                    "NONE"
                )
            );


            const expirationDate =
                parseExpiration(
                    oldComment
                );


            const currentMilliseconds =
                expirationDate
                    ? Math.max(
                        0,
                        expirationDate.getTime()
                        -
                        Date.now()
                    )
                    : 0;


            const currentTimeText =
                expirationDate
                    ? formatDuration(
                        currentMilliseconds
                    )
                    : "NO EXPIRATION";


            log(
                "Current Time Left: " +
                currentTimeText,
                currentMilliseconds > 0
                    ? "info"
                    : "warning"
            );


            showUserInfo(

                username,

                currentTimeText,

                "-",

                "-",

                oldComment ||
                "-"

            );


            /*
               Select plan from
               plan.json.
            */

            const selected =
                await selectValidity();


            if (!selected) {

                log(
                    "Plan selection cancelled.",
                    "warning"
                );


                hideUserInfo();

                scanBusy = false;

                return;

            }


            const validity =
                selected.duration;


            const addMilliseconds =
                validityToMilliseconds(
                    validity
                );


            const addTimeText =
                formatDuration(
                    addMilliseconds
                );


            let newExpiration;


            if (
                expirationDate &&
                expirationDate.getTime() >
                Date.now()
            ) {

                newExpiration =
                    new Date(

                        expirationDate.getTime()
                        +
                        addMilliseconds

                    );

            } else {

                newExpiration =
                    new Date(

                        Date.now()
                        +
                        addMilliseconds

                    );

            }


            const newTotalMilliseconds =
                Math.max(

                    0,

                    newExpiration.getTime()
                    -
                    Date.now()

                );


            const newTotalText =
                formatDuration(
                    newTotalMilliseconds
                );


            const newExpirationText =
                formatDate(
                    newExpiration
                );


            showUserInfo(

                username,

                currentTimeText,

                addTimeText,

                newTotalText,

                newExpirationText

            );


            log(
                "Plan Selected: " +
                selected.name,
                "success"
            );


            log(
                "Duration: " +
                validity
            );


            if (
                selected.price !== undefined
            ) {

                log(
                    "Price: ₱" +
                    Number(
                        selected.price
                    ).toLocaleString(
                        "en-PH"
                    )
                );

            }


            log(
                "Time to Add: " +
                addTimeText,
                "success"
            );


            log(
                "New Total Time Left: " +
                newTotalText,
                "success"
            );


            log(
                "New Expiration: " +
                newExpirationText,
                "success"
            );


            log(
                "Updating MikroTik..."
            );


            await apiRequest(

                "/ip/hotspot/user/" +
                encodeURIComponent(
                    existing[".id"]
                ),

                "PATCH",

                {

                    comment:
                        newExpirationText,

                    password:
                        password

                }

            );


            log(
                "User updated successfully.",
                "success"
            );


            log(
                "Added: " +
                addTimeText,
                "success"
            );


            log(
                "Total remaining: " +
                newTotalText,
                "success"
            );


            await runScript3();


            finishScan();


            return;

        }


        /* =================================================
           NEW USER
        ================================================== */

        log(
            "================================"
        );


        log(
            "NEW USER",
            "info"
        );


        log(
            "================================"
        );


        log(
            "Username: " +
            username
        );


        log(
            "Current Time Left: 0"
        );


        const selected =
            await selectValidity();


        if (!selected) {

            log(
                "Plan selection cancelled.",
                "warning"
            );


            scanBusy = false;

            return;

        }


        const validity =
            selected.duration;


        const addMilliseconds =
            validityToMilliseconds(
                validity
            );


        const addTimeText =
            formatDuration(
                addMilliseconds
            );


        const newExpiration =
            new Date(

                Date.now()
                +
                addMilliseconds

            );


        const newExpirationText =
            formatDate(
                newExpiration
            );


        const newTotalText =
            formatDuration(
                addMilliseconds
            );


        showUserInfo(

            username,

            "0 minutes",

            addTimeText,

            newTotalText,

            newExpirationText

        );


        log(
            "Plan Selected: " +
            selected.name,
            "success"
        );


        log(
            "Duration: " +
            validity
        );


        if (
            selected.price !== undefined
        ) {

            log(
                "Price: ₱" +
                Number(
                    selected.price
                ).toLocaleString(
                    "en-PH"
                )
            );

        }


        log(
            "Time to Add: " +
            addTimeText,
            "success"
        );


        log(
            "New Total Time Left: " +
            newTotalText,
            "success"
        );


        log(
            "New Expiration: " +
            newExpirationText,
            "success"
        );


        log(
            "Creating hotspot user..."
        );


        await apiRequest(

            "/ip/hotspot/user",

            "PUT",

            {

                name:
                    username,

                password:
                    password,

                comment:
                    newExpirationText,

                profile:
                    "General"

            }

        );


        log(
            "User created successfully.",
            "success"
        );


        await runScript3();


        finishScan();


    } catch (error) {

        log(
            "MikroTik API ERROR: " +
            error.message,
            "error"
        );


        scanBusy = false;

    }

}

/* =========================================================
   VALIDITY → MILLISECONDS
========================================================= */

function validityToMilliseconds(
    validity
) {

    const units = {

        h:
            60 *
            60 *
            1000,

        d:
            24 *
            60 *
            60 *
            1000

    };


    const regex =
        /(\d+)([hd])/g;


    let total = 0;

    let match;


    while (
        (
            match =
            regex.exec(
                validity
            )
        ) !== null
    ) {

        total +=

            Number(
                match[1]
            ) *

            units[
                match[2]
            ];

    }


    return total;

}


/* =========================================================
   FORMAT DURATION
========================================================= */

function formatDuration(
    milliseconds
) {

    milliseconds =
        Math.max(
            0,
            milliseconds
        );


    let totalSeconds =
        Math.floor(
            milliseconds /
            1000
        );


    const days =
        Math.floor(
            totalSeconds /
            86400
        );


    totalSeconds %=
        86400;


    const hours =
        Math.floor(
            totalSeconds /
            3600
        );


    totalSeconds %=
        3600;


    const minutes =
        Math.floor(
            totalSeconds /
            60
        );


    const seconds =
        totalSeconds %
        60;


    const parts = [];


    if (days > 0) {

        parts.push(

            days +

            (
                days === 1
                    ? " day"
                    : " days"
            )

        );

    }


    if (hours > 0) {

        parts.push(

            hours +

            (
                hours === 1
                    ? " hour"
                    : " hours"
            )

        );

    }


    if (minutes > 0) {

        parts.push(

            minutes +

            (
                minutes === 1
                    ? " minute"
                    : " minutes"
            )

        );

    }


    if (
        seconds > 0 &&
        parts.length === 0
    ) {

        parts.push(

            seconds +

            (
                seconds === 1
                    ? " second"
                    : " seconds"
            )

        );

    }


    if (parts.length === 0) {

        return "EXPIRED";

    }


    return parts.join(
        " "
    );

}


/* =========================================================
   PLAN SELECTOR
========================================================= */

function selectValidity() {

    return new Promise(
        resolve => {

            selectedPlan =
                "";

            selectedPlanData =
                null;

            planResolver =
                resolve;


            document
                .querySelectorAll(
                    ".plan"
                )
                .forEach(
                    plan => {

                        plan.classList
                            .remove(
                                "selected"
                            );

                    }
                );


            document
                .getElementById(
                    "planModal"
                )
                .style.display =
                    "flex";

        }
    );

}


/* =========================================================
   SELECT PLAN
========================================================= */

function selectPlan(
    element
) {

    document
        .querySelectorAll(
            ".plan"
        )
        .forEach(
            plan => {

                plan.classList
                    .remove(
                        "selected"
                    );

            }
        );


    element.classList.add(
        "selected"
    );


    selectedPlan =
        element.dataset.id;


    selectedPlanData =
        plans.find(
            plan =>
                plan.id ===
                selectedPlan
        );

}


/* =========================================================
   CONFIRM PLAN
========================================================= */

function confirmPlan() {

    if (
        !selectedPlan ||
        !selectedPlanData
    ) {

        alert(
            "Please select a plan."
        );

        return;

    }


    document
        .getElementById(
            "planModal"
        )
        .style.display =
            "none";


    if (planResolver) {

        planResolver(
            selectedPlanData
        );

        planResolver =
            null;

    }

}


/* =========================================================
   CANCEL PLAN
========================================================= */

function cancelPlan() {

    document
        .getElementById(
            "planModal"
        )
        .style.display =
            "none";


    if (planResolver) {

        planResolver(
            null
        );

        planResolver =
            null;

    }

}

/* =========================================================
   GALLERY QR SCANNER
========================================================= */

async function scanGallery(
    event
) {

    const file =
        event.target.files[0];


    if (!file) {

        return;

    }


    if (scanBusy) {

        event.target.value = "";

        return;

    }


    scanBusy = true;


    hideUserInfo();


    log(
        "Gallery image selected."
    );


    log(
        "Scanning QR..."
    );


    /*
       Invisible temporary scanner.
    */

    const tempContainer =
        document.createElement(
            "div"
        );


    tempContainer.id =
        "temporaryQrScanner";


    tempContainer.style.position =
        "fixed";


    tempContainer.style.left =
        "-99999px";


    tempContainer.style.top =
        "-99999px";


    tempContainer.style.width =
        "1px";


    tempContainer.style.height =
        "1px";


    tempContainer.style.overflow =
        "hidden";


    document.body.appendChild(
        tempContainer
    );


    const imageScanner =
        new Html5Qrcode(
            "temporaryQrScanner"
        );


    try {

        const decodedText =
            await imageScanner.scanFile(
                file,
                false
            );


        /*
           Log QR content immediately.
        */

        log(
            "================================"
        );


        log(
            "QR CODE FROM GALLERY",
            "success"
        );


        log(
            decodedText,
            "success"
        );


        log(
            "================================"
        );


        await processQrContent(
            decodedText
        );


    } catch (error) {

        log(
            "No QR code found in selected image.",
            "error"
        );


        scanBusy = false;

    } finally {

        try {

            await imageScanner.clear();

        } catch {

        }


        tempContainer.remove();


        event.target.value = "";

    }

}


/* =========================================================
   FLASHLIGHT
========================================================= */

async function toggleFlash() {

    try {

        if (!videoTrack) {

            const video =
                document.querySelector(
                    "#qr-reader video"
                );


            if (
                !video ||
                !video.srcObject
            ) {

                log(
                    "Camera is not ready.",
                    "warning"
                );

                return;

            }


            videoTrack =
                video.srcObject
                    .getVideoTracks()[0];

        }


        const capabilities =
            videoTrack.getCapabilities();


        if (!capabilities.torch) {

            log(
                "Flashlight is not supported.",
                "warning"
            );

            return;

        }


        const current =
            videoTrack
                .getSettings()
                .torch ||
            false;


        await videoTrack.applyConstraints({

            advanced: [

                {

                    torch:
                        !current

                }

            ]

        });


        document
            .getElementById(
                "flashButton"
            )
            .textContent =
                current
                    ? "🔦 Flash"
                    : "💡 Flash";


        log(

            current
                ? "Flashlight OFF."
                : "Flashlight ON."

        );


    } catch (error) {

        log(
            "Flashlight error: " +
            error.message,
            "error"
        );

    }

}


/* =========================================================
   PARSE EXPIRATION
========================================================= */

function parseExpiration(
    value
) {

    if (!value) {

        return null;

    }


    const regex =
        /^([a-zA-Z]{3})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2}):(\d{2})$/;


    const match =
        value.match(
            regex
        );


    if (!match) {

        return null;

    }


    const months = {

        jan: 0,
        feb: 1,
        mar: 2,
        apr: 3,
        may: 4,
        jun: 5,
        jul: 6,
        aug: 7,
        sep: 8,
        oct: 9,
        nov: 10,
        dec: 11

    };


    const month =
        months[
            match[1]
                .toLowerCase()
        ];


    if (
        month === undefined
    ) {

        return null;

    }


    return new Date(

        Number(
            match[3]
        ),

        month,

        Number(
            match[2]
        ),

        Number(
            match[4]
        ),

        Number(
            match[5]
        ),

        Number(
            match[6]
        )

    );

}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDate(
    date
) {

    const months = [

        "jan",
        "feb",
        "mar",
        "apr",
        "may",
        "jun",
        "jul",
        "aug",
        "sep",
        "oct",
        "nov",
        "dec"

    ];


    return (

        months[
            date.getMonth()
        ] +

        "/" +

        String(
            date.getDate()
        ).padStart(
            2,
            "0"
        ) +

        "/" +

        date.getFullYear() +

        " " +

        String(
            date.getHours()
        ).padStart(
            2,
            "0"
        ) +

        ":" +

        String(
            date.getMinutes()
        ).padStart(
            2,
            "0"
        ) +

        ":" +

        String(
            date.getSeconds()
        ).padStart(
            2,
            "0"
        )

    );

}

/* =========================================================
   START CAMERA
========================================================= */

async function startScanner() {

    log(
        "Initializing QR scanner..."
    );


    scanner =
        new Html5Qrcode(
            "qr-reader"
        );


    try {

        await scanner.start(

            {
                facingMode:
                    "environment"
            },

            {

                fps: 10,

                qrbox: 250

            },

            onScanSuccess,

            () => {}

        );


        log(
            "QR scanner ready.",
            "success"
        );


        log(
            "Scan a ticket QR code."
        );


        setTimeout(
            () => {

                const video =
                    document.querySelector(
                        "#qr-reader video"
                    );


                if (
                    video &&
                    video.srcObject
                ) {

                    videoTrack =
                        video.srcObject
                            .getVideoTracks()[0];

                }

            },
            1000
        );


    } catch (error) {

        log(
            "Camera error: " +
            error,
            "error"
        );

    }

}
