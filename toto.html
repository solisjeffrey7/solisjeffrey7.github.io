<!DOCTYPE html><html lang="en">  <head>  
  <meta charset="UTF-8">  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Jeffrey Solis | Contact</title>  <meta name="description" content="Personal contact profile">  <link  
    rel="stylesheet"  
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"  
  >  <style>  * {  
  box-sizing: border-box;  
  margin: 0;  
  padding: 0;  
}  

body {  
  min-height: 100vh;  
  font-family: Arial, Helvetica, sans-serif;  
  background: #f2f3f5;  
  color: #17191c;  
  padding: 16px 10px;  
}  

.container {  
  width: 100%;  
  max-width: 390px;  
  margin: auto;  
}  

/* =========================  
   PROFILE CARD  
========================= */  

.profile-card {  
  background: #fff;  
  border-radius: 20px;  
  padding: 25px 18px;  
  box-shadow: 0 8px 30px rgba(0,0,0,.08);  
}  

/* =========================  
   PROFILE  
========================= */  

.profile {  
  text-align: center;  
}  

.profile-photo {  
  width: 92px;  
  height: 92px;  
  border-radius: 50%;  
  object-fit: cover;  
  display: block;  
  margin: 0 auto 11px;  
  border: 2px solid #eee;  
  background: #eee;  
}  

.name {  
  font-size: 27px;  
  font-weight: 700;  
  line-height: 1.2;  
}  

.subtitle {  
  margin-top: 4px;  
  color: #777;  
  font-size: 13px;  
}  

/* =========================  
   SECTIONS  
========================= */  

.section {  
  margin-top: 21px;  
}  

.section-title {  
  font-size: 11px;  
  font-weight: 700;  
  color: #888;  
  text-transform: uppercase;  
  letter-spacing: 1.2px;  
  margin-bottom: 9px;  
}  

/* =========================  
   ADDRESS  
========================= */  

.address-box {  
  display: flex;  
  align-items: center;  
  gap: 11px;  
  background: #f7f7f8;  
  border-radius: 12px;  
  padding: 12px;  
}  

.address-icon {  
  width: 38px;  
  height: 38px;  
  min-width: 38px;  
  display: flex;  
  align-items: center;  
  justify-content: center;  
  background: #e9eaec;  
  border-radius: 50%;  
  font-size: 16px;  
}  

.address-text {  
  font-size: 14px;  
  line-height: 1.45;  
}  

/* =========================  
   CONTACT BUTTONS  
========================= */  

.icon-buttons {  
  display: flex;  
  gap: 9px;  
  flex-wrap: wrap;  
}  

.icon-button {  
  width: 45px;  
  height: 45px;  
  display: flex;  
  align-items: center;  
  justify-content: center;  
  border-radius: 50%;  
  color: #fff;  
  text-decoration: none;  
  font-size: 17px;  
  transition: transform .15s, filter .15s;  
}  

.icon-button:active {  
  transform: scale(.92);  
}  

.icon-button:hover {  
  filter: brightness(1.08);  
}  

.call {  
  background: #22a447;  
}  

.sms {  
  background: #1976d2;  
}  

.messenger {  
  background: #4267b2;  
}  

.facebook {  
  background: #1877f2;  
}  

.email {  
  background: #6b7280;  
}  

.maps {  
  background: #d14b3f;  
}  

/* =========================  
   OTHER PEOPLE  
========================= */  

.contact-list {  
  display: flex;  
  flex-direction: column;  
  gap: 8px;  
}  

.contact {  
  display: flex;  
  align-items: center;  
  justify-content: space-between;  
  gap: 9px;  
  background: #f7f7f8;  
  border-radius: 12px;  
  padding: 10px 11px;  
}  

.contact-info {  
  display: flex;  
  align-items: center;  
  gap: 10px;  
  min-width: 0;  
}  

.contact-avatar {  
  width: 40px;  
  height: 40px;  
  min-width: 40px;  
  display: flex;  
  align-items: center;  
  justify-content: center;  
  background: #e9eaec;  
  border-radius: 50%;  
  font-size: 18px;  
}  

.contact-name {  
  font-size: 14px;  
  font-weight: 700;  
  line-height: 1.2;  
}  

.contact-role {  
  margin-top: 3px;  
  color: #888;  
  font-size: 11px;  
}  

.contact-icons {  
  display: flex;  
  gap: 6px;  
}  

.mini-icon {  
  width: 34px;  
  height: 34px;  
  min-width: 34px;  
  display: flex;  
  align-items: center;  
  justify-content: center;  
  border-radius: 50%;  
  color: #fff;  
  text-decoration: none;  
  font-size: 13px;  
  transition: transform .15s, filter .15s;  
}  

.mini-icon:active {  
  transform: scale(.92);  
}  

.mini-icon:hover {  
  filter: brightness(1.08);  
}  

/* =========================  
   MESSAGE  
========================= */  

.message {  
  margin-top: 19px;  
  padding-top: 15px;  
  border-top: 1px solid #eee;  
  text-align: center;  
  color: #777;  
  font-size: 11px;  
  line-height: 1.55;  
}  

.footer {  
  text-align: center;  
  margin-top: 11px;  
  color: #aaa;  
  font-size: 10px;  
}  

/* =========================  
   DARK MODE  
========================= */  

@media (prefers-color-scheme: dark) {  

  body {  
    background: #101214;  
    color: #f1f1f1;  
  }  

  .profile-card {  
    background: #191c20;  
    box-shadow: 0 8px 30px rgba(0,0,0,.3);  
  }  

  .subtitle,  
  .section-title,  
  .contact-role,  
  .message {  
    color: #92979d;  
  }  

  .address-box,  
  .contact {  
    background: #22262b;  
  }  

  .address-icon,  
  .contact-avatar {  
    background: #2c3137;  
  }  

  .address-text,  
  .contact-name {  
    color: #f1f1f1;  
  }  

  .message {  
    border-color: #30343a;  
  }  

  .footer {  
    color: #62676d;  
  }  

  .profile-photo {  
    border-color: #30343a;  
  }  
}  

/* =========================  
   SMALL PHONE  
========================= */  

@media (max-width: 360px) {  

  body {  
    padding: 8px;  
  }  

  .profile-card {  
    padding: 21px 14px;  
  }  

  .profile-photo {  
    width: 84px;  
    height: 84px;  
  }  

  .name {  
    font-size: 24px;  
  }  

  .icon-button {  
    width: 42px;  
    height: 42px;  
    font-size: 16px;  
  }  

  .mini-icon {  
    width: 31px;  
    height: 31px;  
    min-width: 31px;  
    font-size: 12px;  
  }  

}
